name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài thư viện
        run: npm install

      - name: Tạo project Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Đổi tên file APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BitXau-Radar.apk

      - name: Lưu APK vào Actions (tải ở mục Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: BitXau-Radar-apk
          path: BitXau-Radar.apk

      - name: Đăng APK lên Releases (bản mới nhất)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: BitXau Radar - bản mới nhất
          body: Bản APK build tự động từ commit ${{ github.sha }}. Tải file BitXau-Radar.apk và cài lên Android.
          artifacts: BitXau-Radar.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          commit: ${{ github.sha }}
