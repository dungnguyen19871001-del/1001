tmode=\"url\" autocomplete=\"off\" placeholder=\"http://localhost:8787\">\n      <\/label>\n      <label>Quỹ và market maker cần theo dõi (mỗi dòng một tên Arkham, lấy từ địa chỉ trang entity trên intel.arkm.com)\n        <textarea id=\"arkFunds\" rows=\"6\" spellcheck=\"false\"><\/textarea>\n      <\/label>\n      <label>Chỉ tính các lần chuyển từ (USD)\n        <input id=\"arkMin\" type=\"number\" min=\"10000\" step=\"10000\">\n      <\/label>\n      <div class=\"ark-actions\">\n        <button class=\"toggle\" id=\"arkSave\">Lưu<\/button>\n        <button class=\"toggle\" id=\"arkTest\">Kiểm tra kết nối<\/button>\n        <button class=\"toggle\" id=\"arkScan\">Quét các coin có ID Arkham<\/button>\n      <\/div>\n      <p class=\"hint\" id=\"arkMsg\"><\/p>\n    <\/div>\n  <\/details>\n\n  <div class=\"banner\" id=\"banner\" hidden>\n    <span id=\"bannerText\"><\/span>\n    <button id=\"bannerBtn\"><\/button>\n  <\/div>\n\n  <section class=\"panel chartpanel\" id=\"chartPanel\" aria-label=\"Biểu đồ giá TradingView\">\n    <div class=\"chart-head\">\n      <div class=\"chart-ttl\"><span id=\"chartTitle\">Biểu đồ giá<\/span><small>TradingView · dữ liệu Binance<\/small><\/div>\n      <select id=\"chartSel\" aria-label=\"Chọn coin cho biểu đồ\"><\/select>\n      <a class=\"chart-link\" id=\"chartLink\" href=\"https://www.tradingview.com/\" target=\"_blank\" rel=\"noopener\">Mở trên TradingView<\/a>\n      <button class=\"toggle\" id=\"chartMine\" type=\"button\">Layout của tôi<\/button>\n      <button class=\"chip\" id=\"chartMineEdit\" type=\"button\" hidden>Đổi link<\/button>\n      <button class=\"toggle\" id=\"chartToggle\" type=\"button\" aria-expanded=\"true\" aria-controls=\"chartBox\">Thu gọn<\/button>\n    <\/div>\n    <div class=\"chart-mine\" id=\"chartMineRow\" hidden>\n      <input id=\"chartLayoutIn\" type=\"url\" inputmode=\"url\" autocomplete=\"off\" placeholder=\"Dán link layout, ví dụ tradingview.com/chart/AbCdEfGh/\" aria-label=\"Link layout TradingView của bạn\">\n      <button class=\"toggle\" id=\"chartLayoutSave\" type=\"button\">Lưu<\/button>\n      <button class=\"toggle\" id=\"chartLayoutDel\" type=\"button\">Xóa<\/button>\n      <p class=\"hint\" id=\"chartLayoutMsg\"><\/p>\n    <\/div>\n    <div class=\"chart-box\" id=\"chartBox\"><\/div>\n  <\/section>\n\n  <main class=\"grid\">\n    <section class=\"panel\" aria-label=\"Danh sách coin\">\n      <ul id=\"coinList\"><\/ul>\n    <\/section>\n    <aside class=\"panel\" aria-label=\"Lệnh lớn gần nhất\">\n      <h3><span class=\"tabs\" role=\"group\" aria-label=\"Loại dữ liệu\"><button data-t=\"whale\" aria-pressed=\"true\">Lệnh cá voi<\/button><button data-t=\"liq\" aria-pressed=\"false\">Thanh lý<\/button><button data-t=\"sig\" aria-pressed=\"false\">Tín hiệu<\/button><button data-t=\"news\" aria-pressed=\"false\">Tin tức<span class=\"nbadge\" id=\"newsBadge\" hidden><\/span><\/button><\/span><button class=\"chip\" id=\"sigResetBtn\" hidden>Đặt lại sổ tín hiệu<\/button><button class=\"chip\" id=\"filterChip\" hidden><\/button><\/h3>\n      <div class=\"newsbar\" id=\"newsBar\" hidden>\n        <div class=\"ncats\" role=\"group\" aria-label=\"Nhóm tin\"><button class=\"chip\" data-nc=\"all\" aria-pressed=\"true\">Tất cả<\/button><button class=\"chip\" data-nc=\"crypto\" aria-pressed=\"false\">Crypto<\/button><button class=\"chip\" data-nc=\"gold\" aria-pressed=\"false\">Vàng<\/button><button class=\"chip\" data-nc=\"macro\" aria-pressed=\"false\">Vĩ mô<\/button><button class=\"chip\" data-nc=\"geo\" aria-pressed=\"false\">Thế giới<\/button><\/div>\n        <div class=\"nright\" role=\"group\" aria-label=\"Ngôn ngữ tin\"><button class=\"chip\" data-nl=\"vi\" aria-pressed=\"true\">VI<\/button><button class=\"chip\" data-nl=\"en\" aria-pressed=\"false\">EN<\/button><button class=\"chip\" id=\"newsRefresh\" type=\"button\">Làm mới<\/button><\/div>\n        <p class=\"hint\" id=\"newsHint\"><\/p>\n      <\/div>\n      <ul class=\"feed\" id=\"feed\"><\/ul>\n    <\/aside>\n  <\/main>\n\n  <footer>\n    <details>\n      <summary>Hướng dẫn: app nhận biết cá voi, vùng thanh khoản và thanh lý như thế nào?<\/summary>\n\n      <h4>Nhận biết cá voi đang mua hay bán<\/h4>\n      <ul>\n        <li>Cá voi là những lệnh giao dịch có giá trị lớn. App theo dõi từng lệnh khớp của cặp coin/USDT và coin/USDC trên Binance, tự cộng chung thành một (Spot và Futures tính riêng). Lệnh nào vượt ngưỡng của coin đó (ví dụ BTC từ $300K, SOL từ $100K) thì được tính là lệnh cá voi.<\/li>\n        <li>Lệnh chủ động mua (khớp với lệnh đang chờ bán) tính là <b>mua<\/b>. Lệnh chủ động bán (khớp với lệnh đang chờ mua) tính là <b>bán<\/b>.<\/li>\n        <li>Trong khung thời gian bạn chọn, app cộng tổng tiền mua và tổng tiền bán của cá voi, rồi xem bên nào chiếm nhiều hơn:\n          <ul>\n            <li>Từ 60% trở lên: hiện “Cá voi đang mua” hoặc “Cá voi đang bán”.<\/li>\n            <li>Từ 80% trở lên và có ít nhất 3 lệnh: hiện “mua mạnh” hoặc “bán mạnh”.<\/li>\n            <li>Các trường hợp còn lại: hiện “Cân bằng”.<\/li>\n          <\/ul>\n        <\/li>\n        <li>Muốn đổi ngưỡng, bạn dùng nút “Ngưỡng lệnh lớn” (Nhạy, Chuẩn, Lớn, Rất lớn) hoặc sửa số <code>th<\/code> của từng coin trong mảng <code>COINS<\/code> ở đầu phần script.<\/li>\n      <\/ul>\n\n      <h4>Vùng thanh khoản (bấm vào một coin để xem)<\/h4>\n      <ul>\n        <li>Vùng thanh khoản là những mức giá có rất nhiều giao dịch. App chia khối lượng giao dịch 24 giờ hoặc 7 ngày theo từng mức giá để tìm ra các vùng này.<\/li>\n        <li>Vùng nằm dưới giá hiện tại là vùng mua, thường đóng vai trò hỗ trợ. Vùng nằm trên giá hiện tại là vùng bán, thường đóng vai trò kháng cự.<\/li>\n        <li><b>POC<\/b> là mức giá được giao dịch nhiều nhất trong khoảng thời gian đã chọn.<\/li>\n        <li><b>Đỉnh hoặc đáy chưa bị quét<\/b> là mốc cũ mà giá chưa vượt qua. Nhiều lệnh dừng lỗ thường nằm sau các mốc này, nên giá hay bị kéo về đó.<\/li>\n        <li><b>Sổ lệnh sát giá<\/b> gồm 1000 mức giá gần nhất trong sổ lệnh của Binance, cho thấy các “tường” lệnh chờ mua và chờ bán. Với BTC và ETH, phạm vi này rất hẹp (dưới 0,1% quanh giá), nên chỉ phản ánh lực đỡ và lực cản ngay lúc này.<\/li>\n      <\/ul>\n\n      <h4>Thanh lý futures<\/h4>\n      <ul>\n        <li>Thanh lý là khi sàn buộc phải đóng một vị thế đòn bẩy vì tài khoản không còn đủ ký quỹ. App lấy dữ liệu này từ Binance USDⓈ-M Futures.<\/li>\n        <li><b>Long bị thanh lý<\/b> (màu đỏ): sàn bán cưỡng bức, thường xảy ra khi giá giảm nhanh.<\/li>\n        <li><b>Short bị thanh lý<\/b> (màu xanh): sàn mua cưỡng bức, thường xảy ra khi giá tăng nhanh.<\/li>\n        <li>Bản đồ thanh lý gom số tiền bị thanh lý theo từng mức giá, cho thấy giá đã quét qua vùng nào. Đây là các lần thanh lý đã xảy ra, không phải dự báo về các mức thanh lý sắp tới.<\/li>\n        <li>Binance chỉ gửi tối đa một lệnh thanh lý mỗi giây cho mỗi coin, nên tổng thực tế có thể lớn hơn số hiển thị. App chỉ ghi nhận khi trang đang mở và lưu 24 giờ gần nhất trong trình duyệt này.<\/li>\n      <\/ul>\n\n      <h4>Tín hiệu Long / Short<\/h4>\n      <ul>\n        <li>App chấm điểm từ -1 (nghiêng Short) đến +1 (nghiêng Long), tổng hợp từ 16 yếu tố và chỉ báo: dòng tiền cá voi (14,4%), vị trí giá so với vùng thanh khoản (9,9%), SuperTrend (8,1%), SMC/ICT (8,1%), Ichimoku Cloud (7,2%), động lượng RSI kết hợp MACD (7,2%), funding rate futures (7,2%), đa khung ngắn/trung/dài trong cùng khung đã chọn (5,4%), xu hướng EMA20/EMA50 (5,4%), Parabolic SAR (4,5%), biến động Open Interest (4,5%), thanh lý futures (4,5%), dải Bollinger (3,6%), 2 yếu tố onchain từ Arkham (3,6% và 3,6%), sổ lệnh sát giá (2,7%). Yếu tố nào chưa có dữ liệu (ví dụ chưa mở coin để lấy sổ lệnh, hoặc chưa cấu hình Arkham) thì bị bỏ ra và các yếu tố còn lại được tính lại tỉ trọng.<\/li>\n        <li><b>Chấm điểm nâng cao:<\/b> trọng số tự đổi theo trạng thái thị trường (thị trường có xu hướng thì ưu tiên nhóm xu hướng, đi ngang thì ưu tiên động lượng và vùng thanh khoản), giảm điểm khi khối lượng cạn và cộng/trừ theo xu hướng khung lớn hơn. Tín hiệu chỉ phát khi các yếu tố cùng chiều chiếm từ 50% trọng số, không có nhóm ngược chiều mạnh quá 18% trọng số và RSI chưa cực đoan.<\/li>\n        <li><b>Khung thời gian phân tích<\/b> (chọn ở lớp \"Tín hiệu\" khi mở một coin): M5, M15, M30, H1, H4, D, W — từ nến 5 phút đến nến hàng tháng. Đổi khung sẽ tính lại toàn bộ chỉ báo, vùng thanh khoản, và cả Entry/SL/TP theo đúng khung đó (khung càng lớn, SL/TP càng rộng vì biến động giá đo được cũng lớn hơn). App tự tải nến của khung đang chọn cho cả 20 coin ở nền, không cần mở từng coin.<\/li>\n        <li><b>SuperTrend<\/b> là một đường bám theo giá dựa trên ATR: giá nằm trên đường là xu hướng tăng, nằm dưới là xu hướng giảm. Đường vừa đổi phía là tín hiệu mới, được tính điểm cao hơn.<\/li>\n        <li><b>Parabolic SAR<\/b> là các chấm bám theo giá, dùng để dò xu hướng và điểm dừng lỗ động: chấm nằm dưới giá là xu hướng tăng, nằm trên giá là xu hướng giảm.<\/li>\n        <li><b>Ichimoku Cloud<\/b> dùng dải mây (Senkou Span A/B) để xác định vùng hỗ trợ/kháng cự tổng quát: giá trên mây nghiêng tăng, dưới mây nghiêng giảm, trong mây là chưa rõ xu hướng. App cũng dùng cạnh mây gần nhất làm một mốc SL/TP tiềm năng.<\/li>\n        <li><b>SMC/ICT<\/b> (Smart Money Concepts): App dò các đỉnh/đáy xoay chiều gần nhất để nhận diện <b>BOS<\/b> (Break of Structure, giá phá mốc cũ theo đúng chiều xu hướng) và <b>CHoCH<\/b> (Change of Character, giá phá mốc cũ ngược chiều xu hướng, tín hiệu đảo chiều sớm). App cũng tìm <b>FVG<\/b> (Fair Value Gap, khoảng trống giá chưa được lấp giữa 3 nến liên tiếp) gần giá nhất và dùng làm một mốc SL/TP tiềm năng.<\/li>\n        <li><b>RSI(14)<\/b> đo phần trăm tăng/giảm gần đây: trên 50 nghiêng tăng, dưới 50 nghiêng giảm. <b>MACD<\/b> đo phần chênh giữa hai đường trung bình động 12 và 26 nến so với đường tín hiệu của nó, cho biết động lượng đang mạnh lên hay yếu đi. App gộp hai chỉ báo này thành một điểm \"động lượng\" duy nhất.<\/li>\n        <li><b>EMA20/EMA50<\/b> là hai đường trung bình động hàm mũ. EMA20 nằm trên EMA50 và đang dốc lên thường cho thấy xu hướng tăng đang chiếm ưu thế, và ngược lại.<\/li>\n        <li><b>Dải Bollinger<\/b> đo giá đang ở đâu trong biên độ biến động 20 nến gần nhất (%B). Giá vượt lên trên dải hoặc xuống dưới dải là dấu hiệu biến động mạnh theo một hướng.<\/li>\n        <li><b>Đa khung (trong cùng một khung đã chọn)<\/b> so sánh biến động giá ở 8 nến, 32 nến và 96 nến gần nhất. Khi cả ba độ dài đều cùng chiều, App cho điểm cao hơn vì xu hướng đang đồng thuận ở nhiều độ dài khác nhau.<\/li>\n        <li><b>Funding rate<\/b> là phí các vị thế đòn bẩy trả cho nhau mỗi 8 giờ trên hợp đồng futures. Funding dương cao nghĩa là bên Long đang quá đông và phải trả phí cho bên Short (rủi ro bị ép bán), funding âm cao là bên Short đang quá đông. App dùng chỉ báo này theo hướng ngược dòng (funding cực đoan thường đảo chiều).<\/li>\n        <li><b>Open Interest (OI)<\/b> là tổng số vị thế đang mở trên futures. Giá tăng cùng OI tăng nghĩa là có dòng tiền mới thực sự vào Long, đáng tin hơn giá tăng mà OI giảm (thường chỉ là short đóng vị thế).<\/li>\n        <li>Ở mỗi khung, App chỉ báo Long khi điểm từ +0,22 trở lên, Short khi điểm từ -0,22 trở xuống, và các yếu tố đồng thuận phải đến từ ít nhất 2 trong 4 nhóm chỉ báo khác nhau (xu hướng, cấu trúc giá, động lượng, dòng tiền) chứ không được dồn vào một nhóm duy nhất. Nếu có một yếu tố quan trọng đang ngược chiều rất mạnh, App để trạng thái Chờ thay vì ép ra tín hiệu.<\/li>\n        <li><b>Mỗi khung một tín hiệu riêng (M5, M15, M30, H1, H4, D, W):<\/b> App không cần các khung đồng thuận với nhau. Tín hiệu của từng khung là điểm tổng hợp từ chỉ báo kỹ thuật, vùng thanh khoản, khối lượng, thanh lý, dòng tiền cá voi và sổ lệnh. App tự ghi vào sổ khi khung đó có kế hoạch lệnh hợp lệ, độ tin cậy từ Vừa trở lên và hướng giữ ổn định vài phút.<\/li>\n        <li><b>Đặt lại sổ tín hiệu:<\/b> bấm nút \"Đặt lại sổ tín hiệu\" ở đầu danh sách khi đang xem tab \"Tín hiệu\" để xoá toàn bộ lịch sử và bắt đầu quét lại từ đầu bất cứ lúc nào.<\/li>\n        <li><b>Về tỉ lệ thắng:<\/b> đây là một bộ quy tắc kết hợp nhiều chỉ báo được nhiều người giao dịch tin dùng (SuperTrend, Ichimoku, SMC/ICT, RSI/MACD, EMA, funding rate, open interest...), lọc rất chặt qua 5 khung thời gian để giảm nhiễu. Dù được thiết kế để chọn lọc, không có công thức nào (kể cả công thức này) có thể đảm bảo trước một tỉ lệ thắng cụ thể, vì thị trường luôn thay đổi và app chưa được kiểm chứng bằng backtest trên dữ liệu lịch sử dài hạn. Tỉ lệ thắng thật cần được bạn tự theo dõi qua số liệu \"thắng/thua\" hiển thị ngay trong sổ tín hiệu theo thời gian.<\/li>\n        <li><b>Entry, SL, TP<\/b> được tính từ biến động gần đây (ATR) và các vùng thanh khoản, kể cả cạnh mây Ichimoku và khoảng trống giá (FVG): SL đặt ngoài vùng hỗ trợ/kháng cự gần nhất, TP đặt ngay trước các vùng thanh khoản phía trước (hoặc theo bội số R nếu không có vùng phù hợp). Nếu giá đang cách vùng hỗ trợ/kháng cự không xa, app đề xuất đặt lệnh chờ tại vùng đó thay vì vào ngay.<\/li>\n        <li><b>Cỡ vị thế<\/b> = mức rủi ro bạn chọn (0,5%, 1% hoặc 2% vốn) chia cho khoảng cách từ entry tới SL. Ví dụ rủi ro 1% và SL cách entry 0,5% thì vị thế bằng 200% vốn (đòn bẩy khoảng 2x).<\/li>\n        <li><b>Sổ tín hiệu<\/b> (tab \"Tín hiệu\") ghi lại mỗi tín hiệu. Mỗi lệnh có 2 nút <b>✓ Theo<\/b> / <b>✗ Bỏ qua<\/b> để bạn tự chọn có theo tín hiệu đó hay không — thắng/thua và lời/lỗ chỉ tính trên các lệnh bạn đã bấm ✓ Theo, lệnh chưa chọn hoặc bấm ✗ không tính vào thống kê. Lệnh chờ (limit) không khớp giá bị hủy và <b>không tính là thua<\/b>. Lệnh mở <b>không giới hạn thời gian<\/b>: chỉ đóng khi chạm SL, hoặc khi bạn tự bấm <b>Đóng lệnh<\/b>. Khi giá chạm TP1, app tự dời SL lên (long) hoặc xuống (short) một mức có lời nhỏ để không còn khả năng lỗ ngược; chạm TP2 dời SL lên mức TP1, chạm TP3 dời lên mức TP2 — mỗi lần đều khoá thêm lời trong khi bạn tự quyết định đóng lệnh hay gồng tiếp lên các TP sau. App còn quy đổi ra lời/lỗ USDT với vốn giả định 13.000 USDT (cỡ lệnh theo % rủi ro đang chọn), có trừ phí giao dịch (0,1%/0,1% spot, 0,02%/0,05% futures, hạng thường không chiết khấu BNB) và trượt giá ước tính cho các lệnh khớp theo giá thị trường (vào lệnh market, chạm SL, tự đóng lệnh) — lệnh chờ và TP coi như khớp đúng giá. Đây vẫn là số ước tính, không phải kết quả giao dịch thật.<\/li>\n        <li>Không có bộ quy tắc kỹ thuật nào, kể cả khi kết hợp nhiều chỉ báo uy tín và đòi hỏi đồng thuận nhiều khung, có thể đảm bảo trước một tỉ lệ thắng cụ thể. Đây vẫn là quy tắc đơn giản, <b>chưa được kiểm chứng bằng backtest trên dữ liệu thật<\/b> và không phải lời khuyên đầu tư. Tỉ lệ thắng thật sự chỉ có thể biết được bằng cách theo dõi sổ tín hiệu của chính bạn qua thời gian. Vì tín hiệu bây giờ hiếm hơn và cần dữ liệu từ 4 khung, App cần khoảng 5 phút để thu thập dữ liệu trước khi có thể ghi tín hiệu đầu tiên, và mỗi coin cách nhau ít nhất 2 giờ giữa hai tín hiệu.<\/li>\n      <\/ul>\n\n      <h4>Onchain Arkham<\/h4>\n      <ul>\n        <li><b>Lấy API key:<\/b> Arkham cấp API theo dạng xin quyền dùng thử, không tự đăng ký tức thì. Vào intel.arkm.com/api (hoặc arkm.com/api, bấm \"Start free trial\") để xin cấp quyền. Sau khi được duyệt, đăng nhập intel.arkm.com, vào Settings → API Keys để tạo key.<\/li>\n        <li>Lệnh chuyển lớn trong 24 giờ qua được lấy từ API của Arkham cho từng coin. Coin chuyển <b>ra khỏi<\/b> ví sàn (CEX) thường được xem là tích lũy (nghiêng Long). Coin chuyển <b>vào<\/b> ví sàn thường được xem là chuẩn bị bán (nghiêng Short).<\/li>\n        <li>Với quỹ và market maker trong danh sách của bạn, app tính họ đang nhận thêm hay chuyển bớt coin. Danh sách mặc định chỉ là gợi ý, bạn nên sửa theo tên hiển thị trên arkm.com.<\/li>\n        <li>Mỗi coin cần 3 lượt gọi và Arkham giới hạn 1 lượt mỗi giây cho loại truy vấn này, nên quét cả 20 coin mất khoảng 1 phút. Mỗi dòng dữ liệu tiêu tốn một phần hạn mức (datapoints) của gói API, vì vậy app chỉ lấy khi bạn bấm.<\/li>\n        <li>Arkham chưa phủ hết các blockchain (một số coin như XRP, ADA có thể không có dữ liệu). Nhóm TradFi không có dữ liệu onchain.<\/li>\n        <li><b>Vì sao cần \"proxy\"?<\/b> Trình duyệt (kể cả trên điện thoại) chặn trang web gọi thẳng tới hầu hết API bên thứ ba vì lý do bảo mật (CORS). App cần một điểm trung gian nhận yêu cầu từ trình duyệt, gắn API key vào, rồi mới gọi Arkham hộ bạn.<\/li>\n        <li><b>Dùng điện thoại, không cần máy tính:<\/b> Cloudflare cung cấp dịch vụ \"Workers\" chạy đoạn mã trung gian đó miễn phí, tạo hoàn toàn qua trình duyệt (dash.cloudflare.com), không cần cài ứng dụng hay dòng lệnh. Mở file <code>arkham-worker.js<\/code> đi kèm với app để xem từng bước cụ thể và đoạn mã cần dán vào. Sau khi tạo xong, bạn có một địa chỉ dạng <code>https://...workers.dev<\/code>, dán vào ô \"Địa chỉ proxy\" trong app là dùng được.<\/li>\n        <li><b>Dùng máy tính:<\/b> chạy file <code>arkham-proxy.py<\/code> đi kèm với app rồi dùng địa chỉ <code>http://localhost:8787<\/code>.<\/li>\n      <\/ul>\n\n      <h4>Tin tức<\/h4>\n      <ul>\n        <li>Tab \"Tin tức\" gom tiêu đề tin mới trong 24 giờ qua về 4 nhóm: <b>Crypto<\/b>, <b>Vàng<\/b>, <b>Vĩ mô<\/b> (Fed, lãi suất, lạm phát, đồng USD) và <b>Thế giới<\/b> (Mỹ, Nga, Trung Quốc, chiến sự, thuế quan, trừng phạt). Tin được tổng hợp từ Google News và tự làm mới vài phút một lần. Con số đỏ trên tab là số tin mới từ lần bạn xem trước.<\/li>\n        <li>App chỉ hiện tiêu đề, tên báo và giờ đăng. Bấm vào một tin để đọc bài gốc trên trang của báo. Chọn nút VI hoặc EN để đổi ngôn ngữ tin.<\/li>\n        <li>Khi bạn bấm chọn một coin (chip \"Đang lọc\"), tab Tin tức chỉ giữ các tin nhắc tới coin đó. Bấm ✕ để xem lại tất cả.<\/li>\n        <li>Tin tức chỉ để bạn nắm bối cảnh nhanh, không phải khuyến nghị mua bán và không được đưa vào điểm tín hiệu Long/Short.<\/li>\n      <\/ul>\n\n      <h4>Thị trường Spot và Futures<\/h4>\n      <ul>\n        <li>App luôn theo dõi lệnh khớp của cả hai thị trường cùng lúc. Trong danh sách, mỗi lệnh được ghi rõ <b>Mua Spot<\/b>, <b>Bán Spot<\/b>, <b>Mua Futures<\/b> hoặc <b>Bán Futures<\/b> (Futures có viền), và bạn lọc được bằng nút Tất cả, Spot, Futures. Mỗi hàng coin hiện hai dòng riêng cho Spot và Futures.<\/li>\n        <li>Mua hoặc bán ở đây là bên chủ động khớp lệnh (taker). Với futures, mua có thể là mở Long hoặc đóng Short, bán có thể là mở Short hoặc đóng Long, vì sàn không cho biết lệnh mở hay đóng.<\/li>\n        <li>Nút \"Thị trường\" (Spot hoặc Futures) chọn thị trường dùng cho nhãn trên hàng coin, nến, khối lượng, sổ lệnh và vùng thanh khoản.<\/li>\n        <li>Chọn <b>Spot<\/b> (nhóm Crypto): app hiện mua/bán Spot, khối lượng, lớp <b>Dòng tiền<\/b> và tab <b>Tín hiệu<\/b> riêng cho Spot. Hai tab/lớp \"Thanh lý\" vẫn ẩn, và các yếu tố chỉ có ở futures (funding, Open Interest, thanh lý) tự động bị loại khỏi điểm tín hiệu Spot.<\/li>\n        <li><b>Dòng tiền Spot<\/b> (lớp \"Dòng tiền\" khi mở một coin): tổng hợp lệnh cá voi Spot theo 15 phút, 1 giờ, 4 giờ, 24 giờ; tỉ lệ mua chủ động (taker) và CVD trên nến của khung đang chọn, kèm phát hiện phân kỳ giữa giá và CVD; sổ lệnh sát giá. Kết quả gộp thành một điểm từ -1 đến +1, hiển thị thành chip \"Tiền vào / Tiền ra\" ở mỗi dòng coin.<\/li>\n        <li><b>Tín hiệu Spot<\/b>: dùng cùng bộ chỉ báo và quy tắc lọc như Futures, cộng thêm 2 yếu tố riêng của Spot (lực mua/bán chủ động và CVD). Vì Spot không bán khống nên app chỉ ghi lệnh <b>MUA<\/b> (Entry, SL, TP1-3, cỡ vị thế tối đa 100% vốn, không đòn bẩy, phí 0,1%/0,1%). Khi điểm nghiêng Bán, app chỉ hiện chip \"Nghiêng BÁN\" để bạn tránh mua mới hoặc cân nhắc chốt bớt, và không ghi lệnh vào sổ. Sổ tín hiệu tách riêng theo thị trường đang chọn.<\/li>\n        <li><b>USDT và USDC tính chung<\/b> (nhóm Crypto, áp dụng cho cả Spot và Futures): dữ liệu coin/USDT và coin/USDC được cộng dồn thành một — lệnh cá voi, nến và khối lượng, CVD, sổ lệnh, thanh lý và Open Interest (funding lấy trung bình hai cặp). Không còn nút chọn riêng từng cặp. Coin nào chưa có cặp USDC thì tự dùng USDT. Sổ tín hiệu chỉ tách theo Spot / Futures, các tín hiệu cũ tạo từ cặp USDT hay USDC đều hiển thị chung. Lệnh cá voi và thanh lý của cặp USDC chỉ được ghi từ khi app có dữ liệu USDC. TradFi chỉ có cặp USDT.<\/li>\n        <li>Chọn <b>Futures<\/b> (hoặc nhóm TradFi, vốn chỉ có futures): đầy đủ mua/bán, khối lượng, Thanh lý, thanh khoản, Tín hiệu, funding và Open Interest — không còn hiện lẫn dòng Spot, mỗi dòng coin chỉ hiện đúng thị trường đang chọn.<\/li>\n        <li><b>Khung thời gian<\/b> dùng chung một kiểu thu gọn/xổ ra cho mọi nơi cần chọn thời gian — lệnh cá voi, thanh lý, và khung phân tích khối lượng/tín hiệu ở panel từng coin: mặc định thu gọn 6 mức M5, M15, M30, H1, H4, D; bấm nút \"Thêm\" cạnh bộ lọc để xổ ra đủ 13 mức M5, M15, M30, H1, H2, H4, H6, H8, H12, D, 3D, W, M (tháng). Mục \"Khoảng dữ liệu khối lượng\" (24 giờ/7 ngày) trước đây đã gộp chung vào khung phân tích này cho gọn — chọn khung nào thì biểu đồ Khối lượng hiện đúng dữ liệu khung đó. App tự lưu lịch sử lệnh cá voi tới 30 ngày trong trình duyệt để các khung dài (D, 3D, W, M) có dữ liệu ngay cả sau khi mở lại app.<\/li>\n      <\/ul>\n\n      <h4>Nhóm TradFi<\/h4>\n      <ul>\n        <li>TradFi là các hợp đồng perpetual (hợp đồng tương lai không kỳ hạn) trên Binance Futures, bám theo giá cổ phiếu, ETF, vàng, bạc, dầu… Bạn không sở hữu cổ phiếu hay hàng hóa thật.<\/li>\n        <li>App tự lấy danh sách hợp đồng TradFi đang giao dịch trên Binance rồi chọn 20 hợp đồng có khối lượng 24 giờ lớn nhất. Ngưỡng lệnh lớn được tính theo khối lượng đó (từ $25K đến $500K), nên hợp đồng càng sôi động thì ngưỡng càng cao.<\/li>\n        <li>Lệnh khớp, vùng thanh khoản, sổ lệnh và thanh lý của nhóm này đều lấy từ Binance Futures. Giá hợp đồng theo phiên của thị trường gốc, nên ngoài giờ giao dịch có thể rất ít lệnh.<\/li>\n      <\/ul>\n\n      <h4>Top Altcoin tăng mạnh / giảm mạnh<\/h4>\n      <ul>\n        <li>App lấy %change 24h của toàn bộ cặp .../USDT đang giao dịch trên Binance Spot, loại BTC, ETH, các stablecoin và token đòn bẩy, chỉ giữ coin có khối lượng 24h từ 3 triệu USD trở lên để tránh %change ảo do thanh khoản quá mỏng.<\/li>\n        <li>Nhóm <b>Tăng mạnh<\/b> là 20 altcoin có %change 24h cao nhất; nhóm <b>Giảm mạnh<\/b> là 20 altcoin thấp nhất (âm nhiều nhất). Ngưỡng lệnh lớn tự tính theo khối lượng 24h của từng coin (từ $10K đến $400K).<\/li>\n        <li>Danh sách được xếp hạng lại mỗi 3 phút. Coin rớt khỏi Top 20 sẽ bị gỡ khỏi danh sách, coin mới lọt vào Top 20 sẽ được thêm vào; coin vẫn còn trong danh sách giữ nguyên lịch sử lệnh cá voi và thanh lý đang có.<\/li>\n        <li>Một số altcoin chỉ có Spot mà chưa niêm yết Futures trên Binance, nên sẽ không có dữ liệu Thanh lý, Funding, Open Interest hay giá khi chuyển sang chế độ Futures.<\/li>\n      <\/ul>\n\n      <h4>Âm báo<\/h4>\n      <ul>\n        <li><b>Lệnh lớn<\/b>: kêu khi có lệnh cá voi vượt ngưỡng hiện tại, hoặc lệnh thanh lý cỡ cá voi. <b>Rất lớn<\/b>: chỉ kêu khi lệnh gấp 3 lần ngưỡng.<\/li>\n        <li>Hai tiếng tăng dần là cá voi <b>mua<\/b>, hai tiếng giảm dần là cá voi <b>bán<\/b>, ba tiếng trầm là <b>thanh lý<\/b>. Mỗi lần kêu còn có một thông báo nhỏ ở cuối màn hình.<\/li>\n        <li>Trình duyệt chỉ cho phát âm thanh sau khi bạn bấm vào trang, nên hãy bấm chọn mức âm báo (app sẽ kêu thử ngay). Nếu không nghe thấy, kiểm tra âm lượng và công tắc im lặng của thiết bị.<\/li>\n      <\/ul>\n\n      <h4>Lịch kinh tế (Mỹ)<\/h4><ul><li>Tab “Lịch kinh tế” liệt kê các sự kiện kinh tế của Mỹ (USD) theo giờ thiết bị: giờ công bố, mức ảnh hưởng (Cao, Vừa, Thấp), <b>Dự kiến<\/b> (mức các chuyên gia kỳ vọng), <b>Trước đó<\/b> (số của kỳ trước) và <b>Thực tế<\/b> (số vừa được công bố).<\/li><li>Khi có số thực tế, app so với dự kiến (hoặc kỳ trước nếu thiếu dự kiến) và nêu tác động điển hình lên <b>USD, XAU (vàng), BTC<\/b>: ▲ là tăng, ▼ là giảm, hai mũi tên là chênh lệch lớn. Ví dụ CPI hoặc NFP cao hơn dự kiến thường làm USD mạnh lên, vàng và BTC chịu áp lực; tỷ lệ thất nghiệp cao hơn dự kiến thì ngược lại. Với tin chưa ra số, app hiện hai kịch bản (cao hơn hoặc thấp hơn dự kiến).<\/li><li>Nguồn miễn phí chỉ có dự kiến và kỳ trước. Để số thực tế tự cập nhật, hãy cài Cloudflare Worker (file <code>bitxau-eco-worker.js<\/code>), bấm “Nguồn số liệu” rồi dán địa chỉ. Hoặc bấm ✎ để tự nhập số thực tế.<\/li><li>Đây là phản ứng điển hình, không phải dự báo chắc chắn: giá còn phụ thuộc kỳ vọng thị trường và bối cảnh, BTC kém ổn định hơn USD và vàng. Không phải lời khuyên đầu tư.<\/li><\/ul><h4>Lưu ý<\/h4>\n      <p>Dữ liệu chỉ đến từ sàn Binance, không phải từ ví on-chain. Cá voi có thể chia nhỏ lệnh nên một số dòng tiền sẽ không bị phát hiện. Đây là công cụ tham khảo, không phải lời khuyên đầu tư.<\/p>\n    <\/details>\n  <\/footer>\n<\/div>\n\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\" hidden><\/div>\n<script>\n/* ===== Cấu hình: 20 coin, ngưỡng lệnh cá voi (USD). Sửa tại đây nếu muốn đổi danh sách. ===== */\nconst COINS = [\n  {s:'BTC',  n:'Bitcoin',      th:300000},\n  {s:'ETH',  n:'Ethereum',     th:200000},\n  {s:'BNB',  n:'BNB',          th:100000},\n  {s:'SOL',  n:'Solana',       th:100000},\n  {s:'XRP',  n:'XRP',          th:100000},\n  {s:'DOGE', n:'Dogecoin',     th:75000},\n  {s:'ADA',  n:'Cardano',      th:60000},\n  {s:'TRX',  n:'TRON',         th:60000},\n  {s:'AVAX', n:'Avalanche',    th:60000},\n  {s:'LINK', n:'Chainlink',    th:60000},\n  {s:'TON',  n:'Toncoin',      th:50000},\n  {s:'SHIB', n:'Shiba Inu',    th:50000},\n  {s:'SUI',  n:'Sui',          th:50000},\n  {s:'XLM',  n:'Stellar',      th:50000},\n  {s:'BCH',  n:'Bitcoin Cash', th:60000},\n  {s:'HBAR', n:'Hedera',       th:50000},\n  {s:'DOT',  n:'Polkadot',     th:50000},\n  {s:'LTC',  n:'Litecoin',     th:60000},\n  {s:'UNI',  n:'Uniswap',      th:50000},\n  {s:'NEAR', n:'NEAR',         th:50000},\n];\nconst HOSTS = ['wss://stream.binance.com:9443', 'wss://data-stream.binance.vision'];\nconst MIN_STORE = 0.5;            // lưu lệnh từ 0.5x ngưỡng để đổi độ nhạy không mất dữ liệu\n/* Danh sách đầy đủ các khung thời gian dùng chung cho lệnh cá voi và thanh lý.\n   WIN_COMPACT là tập mặc định hiển thị thu gọn (M5, M15, M30, H1, H4, D); bấm \"Thêm\" để xổ ra đủ 13 khung. */\nconst WIN_FULL = [[5,'M5'],[15,'M15'],[30,'M30'],[60,'H1'],[120,'H2'],[240,'H4'],[360,'H6'],[480,'H8'],[720,'H12'],[1440,'D'],[4320,'3D'],[10080,'W'],[43200,'M']];\nconst WIN_LABEL = Object.fromEntries(WIN_FULL);\nconst WIN_COMPACT = new Set([5,15,30,60,240,1440]);\nconst MAX_WIN = 43200; /* cửa sổ dài nhất (phút) cho lệnh cá voi: khung Tháng (M) */\nfunction winSegButtons(dataAttr, cur){\n  return WIN_FULL.map(([v,l]) => '<button ' + dataAttr + '=\"' + v + '\"' + (WIN_COMPACT.has(v) ? '' : ' data-more=\"1\"') + ' aria-pressed=\"' + (Number(cur) === v) + '\">' + l + '<\/button>').join('');\n}\ndocument.addEventListener('click', e => {\n  const t = e.target.closest('[data-moretoggle]'); if (!t) return;\n  const wrap = t.closest('.winwrap'); if (!wrap) return;\n  const seg = wrap.querySelector('.seg'); if (!seg) return;\n  const wasCollapsed = seg.dataset.collapsed !== '0';\n  seg.dataset.collapsed = wasCollapsed ? '0' : '1';\n  t.textContent = wasCollapsed ? 'Thu gọn ▴' : 'Thêm ▾';\n});\n\n/* ===== Trạng thái ===== */\nconst cfg = {win:15, mult:1, sort:'cap', lwin:60, layer:'vol', tab:'whale', grp:'crypto', sound:'off', risk:1, tf:'M15', mkt:'spot', quote:'both'};\ndocument.querySelector('[data-key=\"win\"]').innerHTML = winSegButtons('data-v', cfg.win);\ndocument.querySelector('[data-key=\"lwin\"]').innerHTML = WIN_FULL.map(([v,l]) => '<button data-v=\"' + v + '\" data-lw=\"' + v + '\"' + (WIN_COMPACT.has(v) ? '' : ' data-more=\"1\"') + ' aria-pressed=\"' + (Number(cfg.lwin) === v) + '\">' + l + '<\/button>').join('');\nCOINS.forEach(c => { c.grp = 'crypto'; });\n/* ===== Cặp giao dịch: USDT và USDC luôn được coi là chung =====\n   Với mỗi thị trường (Spot hoặc Futures), dữ liệu coin/USDT và coin/USDC được cộng dồn thành một, không tách riêng.\n   Coin nào chưa có cặp USDC thì chỉ dùng USDT. TradFi chỉ có cặp USDT. */\nconst QNAME = {usdt:'USDT', usdc:'USDC', both:'USDT+USDC'};\nconst AVAIL = {spot:null, fut:null};   /* tập cặp USDC đang niêm yết (null = chưa biết, coi như có) */\nfunction qcur(st){ return (st && st.grp === 'tradfi') ? 'usdt' : 'both'; }\nfunction qOk(e, st){ return true; }\nfunction hasPair(coin, mk, quote){\n  if (quote === 'USDT') return true;\n  const set = AVAIL[mk]; if (!set){ const s0 = state[coin]; return !(s0 && (s0.grp === 'gain' || s0.grp === 'lose')); }\n  return set.has((mk === 'fut' ? (FUT_MULT[coin] || '') : '') + coin + quote);\n}\nfunction quotesFor(st, mk){\n  if (mk === 'fut' && st.hasFut === false) return [];\n  const m = qcur(st), want = m === 'usdt' ? ['USDT'] : m === 'usdc' ? ['USDC'] : ['USDT', 'USDC'];\n  return want.filter(q => hasPair(st.s, mk, q));\n}\nfunction mkTag(st){ return useFut(st) ? '· Futures' : '· Spot'; }\nconst state = {};\nfunction makeState(c, i){\n  return state[c.s] = {...c, idx:i, price:null, ev:[], flashAt:0, flashSide:'', row:null, li:null, liq:null, net:0, prof:{}, profErr:{}, loading:{}, book:null, bookErr:null, bookLoading:false, llCache:'', liqs:[], la:null, sf:null, ark:null, arkLoading:false, arkErr:null, candDir:null, candSince:0, lastSigClose:0, funding:null, oiHist:[], tfProf:{}, lmin:Math.max(5000, c.th*.1)};\n}\nCOINS.forEach((c,i) => makeState(c, i));\nconst feed = [];\nlet uid = 0, lastSeenId = 0, filterCoin = null, demo = false, live = false, fails = 0, hostIdx = 0, evDirty = false;\nlet ws = null, retryTimer = null, lastMsg = 0, lastBeep = 0, actx = null, soundOn = false, lastRender = 0, wsSig = '', fwsSig = '';\n\n/* ===== Tiện ích ===== */\nconst $ = id => document.getElementById(id);\nfunction usd(n, sign){\n  const a = Math.abs(n); let t;\n  if (a >= 1e9) t = (a/1e9).toFixed(2)+'B';\n  else if (a >= 1e7) t = (a/1e6).toFixed(1)+'M';\n  else if (a >= 1e6) t = (a/1e6).toFixed(2)+'M';\n  else if (a >= 1e3) t = Math.round(a/1e3)+'K';\n  else t = Math.round(a).toString();\n  return (sign ? (n>=0?'+':'−') : '') + '$' + t;\n}\nfunction pf(p){\n  if (!(p > 0)) return '–';\n  if (p >= 1000) return p.toLocaleString('en-US',{maximumFractionDigits:0});\n  if (p >= 1) return p.toFixed(2);\n  if (p >= 0.01) return p.toFixed(4);\n  return p.toFixed(Math.min(10, 2 - Math.floor(Math.log10(p))));\n}\nfunction price(p){ return p == null ? '–' : '$' + pf(p); }\nfunction pct(x){ return (x >= 0 ? '+' : '−') + (Math.abs(x)*100).toFixed(2) + '%'; }\nfunction clock(t){ return new Date(t).toLocaleTimeString('vi-VN',{hour12:false}); }\n\n/* ===== Xử lý một lệnh khớp ===== */\nfunction onTrade(sym, p, q, buyerIsMaker, mk, qt){\n  const c = state[sym]; if (!c) return;\n  const sel = (c.grp === 'tradfi' || cfg.mkt === 'fut') ? 'fut' : 'spot'; mk = mk || sel;\n  if (mk === sel) c.price = p;\n  const v = p*q;\n  if (v < c.th*MIN_STORE) return;\n  const side = buyerIsMaker ? 'sell' : 'buy';   // người chủ động khớp lệnh quyết định hướng\n  const now = Date.now();\n  qt = qt === 'c' ? 'c' : 't';\n  c.ev.push({t:now, side, usd:v, price:p, mk, q:qt}); evDirty = true;\n  feed.unshift({id:++uid, t:now, s:sym, side, usd:v, price:p, mk, q:qt});\n  if (feed.length > 400) feed.pop();\n  if (v >= c.th*cfg.mult){\n    c.flashAt = performance.now(); c.flashSide = side;\n    alertWhale(c, side, v, mk);\n  }\n}\n\n/* ===== Nhận biết mua/bán ===== */\nfunction signal(buy, sell, n){\n  const tot = buy + sell;\n  if (!tot) return {cls:'', label:'Chưa có lệnh lớn'};\n  const share = buy/tot, strong = n >= 3;\n  if (share >= .8 && strong) return {cls:'buy strong', label:'Cá voi mua mạnh'};\n  if (share >= .6) return {cls:'buy', label:'Cá voi đang mua'};\n  if (share <= .2 && strong) return {cls:'sell strong', label:'Cá voi bán mạnh'};\n  if (share <= .4) return {cls:'sell', label:'Cá voi đang bán'};\n  return {cls:'even', label:'Cân bằng'};\n}\n\n/* ===== Dựng giao diện ===== */\nconst list = $('coinList');\nfunction buildRow(c){\n  const st = state[c.s];\n  const li = document.createElement('li');\n  li.className = 'item'; li.hidden = c.grp !== cfg.grp;\n  const row = document.createElement('div');\n  row.className = 'row'; row.tabIndex = 0; row.setAttribute('role','button'); row.dataset.s = c.s;\n  row.innerHTML =\n    '<div class=\"id\"><b>'+c.s+'<\/b><span>'+c.n+'<\/span><\/div>'+\n    '<div class=\"px\">–<\/div>'+\n    '<div class=\"sig\"><span class=\"badge\">Chưa có lệnh lớn<\/span><\/div>'+\n    '<div class=\"bar\" aria-hidden=\"true\"><i class=\"s\"><\/i><i class=\"b\"><\/i><\/div>'+\n    '<div class=\"nums\"><span class=\"net\">–<\/span><small><\/small><\/div>'+\n    '<div class=\"liqline\"><\/div>';\n  const liq = document.createElement('div');\n  liq.className = 'liq'; liq.hidden = true;\n  const toggle = () => { filterCoin = (filterCoin === c.s) ? null : c.s; lastSeenId = uid; onSelect(); render(); };\n  row.addEventListener('click', toggle);\n  row.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); } });\n  li.appendChild(row); li.appendChild(liq);\n  st.li = li; st.row = row; st.liq = liq;\n  list.appendChild(li);\n}\nCOINS.forEach(buildRow);\n\nfunction render(){\n  if (filterCoin && (!state[filterCoin] || state[filterCoin].grp !== cfg.grp)){ filterCoin = null; onSelect(); }\n  evalSignals();\n  const now = Date.now(), cut = now - cfg.win*60000, hard = now - MAX_WIN*60000;\n  let tB = 0, tS = 0, tN = 0, buying = 0, selling = 0, gL = 0, gS = 0, gN = 0;\n\n  for (const c of COINS){\n    const st = state[c.s];\n    const vis = st.grp === cfg.grp; st.li.hidden = !vis;\n    while (st.ev.length && st.ev[0].t < hard) st.ev.shift();\n    if (st.ev.length > 20000) st.ev.splice(0, st.ev.length - 20000);\n    const dayCut = now - 86400000;\n    while (st.liqs.length && st.liqs[0].t < dayCut) st.liqs.shift();\n    if (!vis) continue;\n    const n  COINS.filter(c => c.grp !== 'tradfi').forEach(c => quotesFor(state[c.s], 'spot').forEach(q => streams.push(c.s.toLowerCase() + q.toLowerCase() + '@aggTrade')));\n  wsSig = streams.join();\n  if (!streams.length) return;\n  let opened = false;\n  try { ws = new WebSocket(HOSTS[hostIdx] + '/stream?streams=' + streams.join('/')); }\n  catch(_){ return scheduleRetry(); }\n  const mine = ws;\n  ws.onopen = () => { opened = true; fails = 0; live = true; lastMsg = Date.now(); setStatus('live', 'Trực tiếp từ Binance'); setBanner(); };\n  ws.onmessage = ev => {\n    lastMsg = Date.now();\n    let m; try { m = JSON.parse(ev.data); } catch(_){ return; }\n    const d = m.data; if (!d || d.e !== 'aggTrade') return;\n    onTrade(d.s.slice(0,-4), +d.p, +d.q, d.m, 'spot', d.s.endsWith('USDC') ? 'c' : 't');\n  };\n  ws.onerror = () => { try { mine.close(); } catch(_){} };\n  ws.onclose = () => {\n    if (mine !== ws || demo) return;\n    live = false;\n    if (!opened){ fails++; hostIdx = (hostIdx + 1) % HOSTS.length; }\n    setStatus('retry', 'Mất kết nối, đang thử lại…'); setBanner(); scheduleRetry();\n  };\n}\nfunction reconnectSpot(){\n  if (demo) return;\n  const old = ws; ws = null; live = false; clearTimeout(retryTimer);\n  try { if (old) old.close(); } catch(_){}\n  connect();\n}\nfunction scheduleRetry(){\n  clearTimeout(retryTimer);\n  retryTimer = setTimeout(connect, Math.min(30000, 1500 * Math.pow(2, Math.min(fails, 5))));\n}\nsetInterval(()=>{  // không nhận dữ liệu quá 30 giây thì kết nối lại\n  if (live && !demo && Date.now() - lastMsg > 30000){ try { ws.close(); } catch(_){} }\n}, 5000);\n\n/* ===== Dữ liệu giả lập (chỉ để xem giao diện) ===== */\nconst DEMO_BASE = {BTC:98000,ETH:3400,BNB:640,SOL:170,XRP:2.3,DOGE:.32,ADA:.85,TRX:.24,AVAX:38,LINK:18,TON:5.6,SHIB:.000022,SUI:3.6,XLM:.42,BCH:480,HBAR:.27,DOT:7.5,LTC:105,UNI:12,NEAR:5.4};\nlet demoTimer = null; const bias = {};\nfunction startDemo(){\n  demo = true; live = false; clearTimeout(retryTimer);\n  try { if (ws) ws.close(); } catch(_){}\n  try { if (fws) fws.close(); } catch(_){}\n  futLive = false; clearTimeout(futRetry); setFut('connecting', 'Futures: giả lập');\n  if (!COINS.some(c => c.grp === 'tradfi')) addDemoTradFi();\n  if (!COINS.some(c => c.grp === 'gain')) addDemoAlt();\n  COINS.forEach(c => { if (!DEMO_BASE[c.s]) DEMO_BASE[c.s] = 20 + Math.random() * 480; bias[c.s] = (Math.random() - .5) * .7; });\n  updateHint();\n  setStatus('connecting', 'Dữ liệu giả lập'); setBanner();\n  demoTimer = setInterval(()=>{\n    const c = COINS[Math.floor(Math.random()*COINS.length)];\n    bias[c.s] = Math.max(-.4, Math.min(.4, bias[c.s] + (Math.random() - .5) * .1));\n    const v = c.th * .05 * Math.exp(Math.random() * 4);\n    const p = DEMO_BASE[c.s] * (1 + (Math.random() - .5) * .004);\n    onTrade(c.s, p, v / p, Math.random() >= .5 + bias[c.s]);\n    state[c.s].funding = {rate: clamp(bias[c.s] * -.0006 + (Math.random()-.5)*.0003, -.001, .001), at: Date.now()};\n    const oh = state[c.s].oiHist, prevOi = oh.length ? oh[oh.length-1].v : 1e7;\n    oh.push({t:Date.now(), v: Math.max(1e5, prevOi * (1 + (Math.random()-.48)*.02)), p});\n    if (oh.length > 12) oh.shift();\n    if (Math.random() < .3){\n      const lp = DEMO_BASE[c.s] * (1 + (Math.random() - .5) * .008);\n      onLiq(c.s, Math.random() < .5 - bias[c.s] ? 'long' : 'short', c.th * .02 * Math.exp(Math.random() * 3.5), lp, Date.now());\n    }\n  }, 350);\n}\nfunction stopDemo(){\n  demo = false; clearInterval(demoTimer); fails = 0; futFails = 0; removeDemoCoins(); updateHint(); setBanner(); connect(); connectFut(); loadTradFi(); loadGainersLosers(true);\n}\n\n/* ===== Vùng thanh khoản ===== */\nconst REST = ['https://api.binance.com', 'https://data-api.binance.vision'];\n/* '24h' dùng riêng làm nền tham chiếu vùng thanh khoản cố định cho mọi coin (không gắn với bộ lọc khung thời gian). */\nconst PROF = {'24h':{interval:'15m', limit:96, label:'24 giờ'}};\nconst TF_SPEC = {M5:{interval:'5m', limit:200, label:'M5'}, M15:{interval:'15m', limit:200, label:'M15'}, M30:{interval:'30m', limit:200, label:'M30'},\n  H1:{interval:'1h', limit:200, label:'H1'}, H2:{interval:'2h', limit:200, label:'H2'}, H4:{interval:'4h', limit:200, label:'H4'},\n  H6:{interval:'6h', limit:200, label:'H6'}, H8:{interval:'8h', limit:200, label:'H8'}, H12:{interval:'12h', limit:200, label:'H12'},\n  D:{interval:'1d', limit:200, label:'D'}, '3D':{interval:'3d', limit:200, label:'3D'}, W:{interval:'1w', limit:200, label:'W'}, M:{interval:'1M', limit:200, label:'M'}};\nconst TF_ORDER = ['M5','M15','M30','H1','H2','H4','H6','H8','H12','D','3D','W','M'];\nconst TF_COMPACT = new Set(['M5','M15','M30','H1','H4','D']);\nconst INTERVAL_MS = {'5m':300000,'15m':900000,'30m':1800000,'1h':3600000,'2h':7200000,'4h':14400000,'6h':21600000,'8h':28800000,'12h':43200000,'1d':86400000,'3d':259200000,'1w':604800000,'1M':2592000000};\nconst NB = 96, SWING_K = 4;\nlet restIdx = 0, liqToken = 0;\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\n\nconst FREST = ['https://fapi.binance.com', 'https://fapi1.binance.com', 'https://fapi2.binance.com', 'https://fapi3.binance.com'];\n\n/* ----- Chỉ báo kỹ thuật cơ bản (tính từ nến 15 phút của hồ sơ 24 giờ) ----- */\nfunction emaSeries(vals, period){\n  const k = 2 / (period + 1); let e = vals[0]; const out = [e];\n  for (let i = 1; i < vals.length; i++){ e = vals[i] * k + e * (1 - k); out.push(e); }\n  return out;\n}\nfunction rsiCalc(vals, period){\n  if (vals.length < period + 1) return null;\n  let gain = 0, loss = 0;\n  for (let i = 1; i <= period; i++){ const d = vals[i] - vals[i-1]; if (d >= 0) gain += d; else loss -= d; }\n  gain /= period; loss /= period;\n  for (let i = period + 1; i < vals.length; i++){\n    const d = vals[i] - vals[i-1], g = d > 0 ? d : 0, l = d < 0 ? -d : 0;\n    gain = (gain * (period - 1) + g) / period; loss = (loss * (period - 1) + l) / period;\n  }\n  if (loss === 0) return 100;\n  return 100 - 100 / (1 + gain / loss);\n}\nfunction macdCalc(vals){\n  if (vals.length < 30) return null;\n  const e12 = emaSeries(vals, 12), e26 = emaSeries(vals, 26);\n  const line = vals.map((_, i) => e12[i] - e26[i]);\n  const sig = emaSeries(line, 9);\n  const i = line.length - 1;\n  return {hist: line[i] - sig[i], histPrev: i > 0 ? line[i-1] - sig[i-1] : line[i] - sig[i]};\n}\nfunction bollCalc(vals, period, mult){\n  if (vals.length < period) return null;\n  const win = vals.slice(-period), mean = win.reduce((a,b) => a+b, 0) / period;\n  const sd = Math.sqrt(win.reduce((a,b) => a + (b-mean)*(b-mean), 0) / period);\n  if (!(sd > 0)) return {pctB:.5, sd:0};\n  const last = vals[vals.length-1];\n  return {pctB: (last - (mean - mult*sd)) / (2*mult*sd), sd};\n}\n/* SuperTrend (ATR 10, hệ số 3) */\nfunction superTrendCalc(cs, period, mult){\n  period = period || 10; mult = mult || 3;\n  if (cs.length < period + 3) return null;\n  const tr = [];\n  for (let i = 1; i < cs.length; i++){ const pc = cs[i-1].c; tr.push(Math.max(cs[i].h - cs[i].l, Math.abs(cs[i].h - pc), Math.abs(cs[i].l - pc))); }\n  let atr = tr.slice(0, period).reduce((a,b) => a+b, 0) / period;\n  const atrArr = [atr];\n  for (let i = period; i < tr.length; i++){ atr = (atr*(period-1) + tr[i]) / period; atrArr.push(atr); }\n  let upper, lower, trend, level, flipK = -1;\n  const offset = period;\n  for (let k = 0; k < atrArr.length; k++){\n    const i = offset + k, hl2 = (cs[i].h + cs[i].l) / 2;\n    const bu = hl2 + mult*atrArr[k], bl = hl2 - mult*atrArr[k];\n    if (k === 0){ upper = bu; lower = bl; trend = cs[i].c <= upper ? -1 : 1; }\n    else {\n      const pc = cs[i-1].c;\n      upper = (bu < upper || pc > upper) ? bu : upper;\n      lower = (bl > lower || pc < lower) ? bl : lower;\n      const prevTrend = trend;\n      if (trend === 1 && cs[i].c < lower){ trend = -1; flipK = k; }\n      else if (trend === -1 && cs[i].c > upper){ trend = 1; flipK = k; }\n      level = trend === 1 ? lower : upper;\n      if (k === atrArr.length - 1) return {trend, level, flipped: prevTrend !== trend, age: k - flipK};\n    }\n    level = trend === 1 ? lower : upper;\n  }\n  return {trend, level, flipped: false, age: 99};\n}\n/* Parabolic SAR (bước 0,02, tối đa 0,2) */\nfunction psarCalc(cs, step, maxStep){\n  step = step || .02; maxStep = maxStep || .2;\n  if (cs.length < 6) return null;\n  let bull = cs[1].c >= cs[0].c, af = step, ep = bull ? cs[0].h : cs[0].l, sar = bull ? cs[0].l : cs[0].h;\n  for (let i = 1; i < cs.length; i++){\n    sar = sar + af*(ep - sar);\n    if (bull){\n      sar = Math.min(sar, cs[i-1].l, i >= 2 ? cs[i-2].l : cs[i-1].l);\n      if (cs[i].l < sar){ bull = false; sar = ep; ep = cs[i].l; af = step; }\n      else if (cs[i].h > ep){ ep = cs[i].h; af = Math.min(maxStep, af + step); }\n    } else {\n      sar = Math.max(sar, cs[i-1].h, i >= 2 ? cs[i-2].h : cs[i-1].h);\n      if (cs[i].h > sar){ bull = true; sar = ep; ep = cs[i].h; af = step; }\n      else if (cs[i].l < ep){ ep = cs[i].l; af = Math.min(maxStep, af + step); }\n    }\n  }\n  return {bull, sar};\n}\n/* Ichimoku Cloud (Tenkan 9, Kijun 26, Senkou B 52) */\nfunction ichimokuCalc(cs){\n  if (cs.length < 52) return null;\n  const hi = n => { let m = -Infinity; for (let i = cs.length-n; i < cs.length; i++) m = Math.max(m, cs[i].h); return m; };\n  const lo = n => { let m = Infinity; for (let i = cs.length-n; i < cs.length; i++) m = Math.min(m, cs[i].l); return m; };\n  const tenkan = (hi(9)+lo(9))/2, kijun = (hi(26)+lo(26))/2, spanA = (tenkan+kijun)/2, spanB = (hi(52)+lo(52))/2;\n  return {tenkan, kijun, spanA, spanB, cloudTop: Math.max(spanA, spanB), cloudBot: Math.min(spanA, spanB), px: cs[cs.length-1].c};\n}\n/* SMC/ICT rút gọn: cấu trúc BOS/CHoCH qua đỉnh-đáy xoay chiều, và khoảng trống giá (FVG) gần nhất chưa lấp */\nfunction smcCalc(cs){\n  if (cs.length < 20) return null;\n  const n = cs.length, K = 3, highs = [], lows = [];\n  for (let i = K; i < n - K; i++){\n    let isH = true, isL = true;\n    for (let d = 1; d <= K; d++){ if (cs[i-d].h >= cs[i].h || cs[i+d].h > cs[i].h) isH = false; if (cs[i-d].l <= cs[i].l || cs[i+d].l < cs[i].l) isL = false; }\n    if (isH) highs.push({i, p: cs[i].h}); if (isL) lows.push({i, p: cs[i].l});\n  }\n  const lastSH = highs.length ? highs[highs.length-1] : null, lastSL = lows.length ? lows[lows.length-1] : null;\n  const px = cs[n-1].c;\n  let trendUp = null;\n  if (highs.length >= 2 && lows.length >= 2){\n    if (highs[highs.length-1].p > highs[highs.length-2].p && lows[lows.length-1].p > lows[lows.length-2].p) trendUp = true;\n    else if (highs[highs.length-1].p < highs[highs.length-2].p && lows[lows.length-1].p < lows[lows.length-2].p) trendUp = false;\n  }\n  let sig = 0, note = 'Giá đang nằm giữa đỉnh và đáy gần nhất, cấu trúc chưa rõ ràng.';\n  if (lastSH && px > lastSH.p){\n    sig = trendUp === false ? .7 : 1;\n    note = trendUp === false ? 'Giá phá lên trên đỉnh gần nhất trong lúc cấu trúc đang giảm (CHoCH tăng, có thể đảo chiều).' : 'Giá phá lên trên đỉnh gần nhất, tiếp diễn cấu trúc tăng (BOS tăng).';\n  } else if (lastSL && px < lastSL.p){\n    sig = trendUp === true ? -.7 : -1;\n    note = trendUp === true ? 'Giá phá xuống dưới đáy gần nhất trong lúc cấu trúc đang tăng (CHoCH giảm, có thể đảo chiều).' : 'Giá phá xuống dưới đáy gần nhất, tiếp diễn cấu trúc giảm (BOS giảm).';\n  }\n  let fvg = null;\n  for (let i = n - 2; i >= Math.max(2, n - 40); i--){\n    const c1 = cs[i-2], c3 = cs[i];\n    if (c1.h < c3.l && !cs.slice(i+1).some(c => c.l <= c1.h)){ fvg = {type:'bull', lo:c1.h, hi:c3.l}; break; }\n    if (c1.l > c3.h && !cs.slice(i+1).some(c => c.h >= c1.l)){ fvg = {type:'bear', lo:c3.h, hi:c1.l}; break; }\n  }\n  return {sig, note, lastSH, lastSL, fvg, trendUp};\n}\n/* ===== v6: bằng chứng đảo chiều/tiếp diễn sớm và chống nhiễu =====\n   Chỉ dùng nến ĐÃ ĐÓNG (bỏ nến đang chạy) nên cấu trúc không nhấp nháy theo từng giây. Gồm: CHoCH/BOS có thân nến mạnh,\n   quét thanh khoản rồi đóng ngược lại, phân kỳ RSI, EMA9/21, SuperTrend nến đóng, và việc nhịp hồi có giữ được cấu  CHoCH nếu ngược cấu trúc trước đó, BOS nếu thuận */\n  const PH = ph.filter(x => x.i <= n - 4), PL = pl.filter(x => x.i <= n - 4), sh = PH[PH.length-1], sl = PL[PL.length-1];\n  let up = null;\n  if (PH.length >= 2 && PL.length >= 2){ const h1 = PH[PH.length-2].p, l1 = PL[PL.length-2].p; if (sh.p > h1 && sl.p > l1) up = true; else if (sh.p < h1 && sl.p < l1) up = false; }\n  let brk = null;\n  for (let j = n - 3; j < n && !brk; j++){\n    const x = c[j], s = Math.abs(x.c - c[j-1].c) >= .7*atr ? 1 : .6;\n    if (sh && x.c > sh.p + .05*atr && cl.slice(sh.i + 1, j).every(v => v <= sh.p)) brk = {dir:1, kind: up === false ? 'CHoCH' : 'BOS', lvl: sh.p, s, ago: n-1-j};\n    else if (sl && x.c < sl.p - .05*atr && cl.slice(sl.i + 1, j).every(v => v >= sl.p)) brk = {dir:-1, kind: up === true ? 'CHoCH' : 'BOS', lvl: sl.p, s, ago: n-1-j};\n  }\n  /* quét thanh khoản: bóng nến chọc qua đỉnh/đáy cũ rồi đóng quay lại bên trong (bẫy giá) */\n  let sweep = null;\n  for (let j = n - 2; j < n && !sweep; j++){\n    const x = c[j], rg = Math.max(1e-12, x.h - x.l), hs = ph.filter(q => q.i <= j-3 && q.i >= j-40).pop(), ls = pl.filter(q => q.i <= j-3 && q.i >= j-40).pop();\n    if (hs && x.h > hs.p + .1*atr && x.c < hs.p && (x.h - x.c) / rg >= .5) sweep = {dir:-1, lvl: hs.p, ago: n-1-j};\n    else if (ls && x.l < ls.p - .1*atr && x.c > ls.p && (x.c - x.l) / rg >= .5) sweep = {dir:1, lvl: ls.p, ago: n-1-j};\n  }\n  const e9 = emaSeries(cl, 9), e21 = emaSeries(cl, 21), e50 = emaSeries(cl, 50)[n-1], sg = i => e9[i] > e21[i] ? 1 : -1;\n  const cross = (sg(n-1) !== sg(n-4) && Math.abs(e9[n-1] - e21[n-1]) > .05*atr) ? {dir: sg(n-1)} : null;\n  const stc = superTrendCalc(c), lo5 = Math.min.apply(null, c.slice(-5).map(x => x.l)), hi5 = Math.max.apply(null, c.slice(-5).map(x => x.h));\n  return {n, atr, div, brk, sweep, cross, stc: stc ? {trend: stc.trend, age: stc.age} : null,\n    bullHold: (sl ? lo5 > sl.p - .1*atr : true) && cl[n-1] > e50, bearHold: (sh ? hi5 < sh.p + .1*atr : true) && cl[n-1] < e50};\n}\n/* Mỗi nhóm host có trạng thái riêng: lần thành công gần nhất, số lỗi liên tiếp, thời điểm được gọi lại.\n   Binance trả 429/418 (vượt giới hạn) KHÔNG kèm header CORS nên trình duyệt chỉ báo \"Failed to fetch\".\n   Nếu nhóm host vừa chạy được mà đột nhiên lỗi hàng loạt thì đó là bị giới hạn tốc độ: nghỉ một lúc, không gọi dồn sang host khác. */\nconst grpState = new Map();\nfunction gsOf(hosts){ let g = grpState.get(hosts); if (!g){ g = {idx:0, ok:0, fails:0, pause:0, bans:0}; grpState.set(hosts, g); } return g; }\nfunction netPause(){ let m = 0; grpState.forEach(g => { if (g.pause > m) m = g.pause; }); return m; }\nfunction tripBreaker(g, sec){ g.bans++; g.pause = Date.now() + Math.min(300, sec || 45 * Math.min(g.bans, 6)) * 1000; }\nasync function getJSON(path, hosts, timeoutMs){\n  hosts = hosts || REST;\n  const g = gsOf(hosts);\n  if (g.pause > Date.now()) throw new Error('Binance đang giới hạn tốc độ, app nghỉ ' + Math.ceil((g.pause - Date.now())/1000) + ' giây rồi tự thử lại');\n  let err;\n  for (let i = 0; i < hosts.length; i++){\n    const idx = (g.idx + i) % hosts.length;\n    try {\n      const ac = new AbortController(), to = setTimeout(() => ac.abort(), timeoutMs || 8000);\n      let r; try { r = await fetch(hosts[idx] + path, {signal: ac.signal}); } finally { clearTimeout(to); }\n      if (r.status === 429 || r.status === 418){\n        const ra = +r.headers.get('Retry-After'); tripBreaker(g, ra > 0 ? ra + 5 : (r.status === 418 ? 120 : 60));\n        throw new Error('HTTP ' + r.status + ' (vượt giới hạn tốc độ Binance)');\n      }\n      if (!r.ok) throw new Error('HTTP ' + r.status);\n      const j = await r.json(); g.idx = idx; g.ok = Date.now(); g.fails = 0; g.bans = Math.max(0, g.bans - 1); if (hosts === REST) restIdx = idx; return j;\n    } catch(e){\n      err = e;\n      if (g.pause > Date.now()) break;\n      if (e && e.name !== 'AbortError' && !/^HTTP/.test(e.message || '') ){\n        /* lỗi mạng/CORS: nếu nhóm này vừa chạy được thì nhiều khả năng bị giới hạn tốc độ */\n        if (Date.now() - g.ok < 120000){ g.fails++; if (g.fails >= 3){ tripBreaker(g); g.fails = 0; } break; }\n      }\n    }\n  }\n  if (err && err.message === 'Failed to fetch') err = new Error('Failed to fetch (mạng lỗi hoặc Binance đang giới hạn tốc độ, app tự thử lại)');\n  throw err;\n}\n\n/* Chia khối lượng từng nến vào các mức giá, tìm vùng dày và các đỉnh/đáy chưa bị quét */\nfunction computeProfile(rows){\n  const cs = rows.map(r => ({t:+r[0], h:+r[2], l:+r[3], c:+r[4], q:+r[7], bq:+r[10]})).filter(x => x.h > 0 && x.l > 0);\n  if (cs.length < 10) throw new Error('thiếu dữ liệu');\n  let lo = Infinity, hi = -Infinity;\n  for (const x of cs){ if (x.l < lo) lo = x.l; if (x.h > hi) hi = x.h; }\n  if (!(hi > lo)) hi = lo * 1.001;\n  const step = (hi - lo) / NB;\n  const bins = [];\n  for (let i = 0; i < NB; i++) bins.push({lo: lo + i*step, hi: lo + (i+1)*step, tot: 0, buy: 0});\n  for (const x of cs){\n    const a = Math.min(NB-1, Math.floor((x.l - lo)/step));\n    const b = Math.max(a, Math.min(NB-1, Math.floor((x.h - lo)/step)));\n    const n = b - a + 1;\n    for (let i = a; i <= b; i++){ bins[i].tot += x.q/n; bins[i].buy += Math.min(x.bq, x.q)/n; }\n  }\n  let total = 0, poc = 0;\n  bins.forEach((b,i) => { total += b.tot; if (b.tot > bins[poc].tot) poc = i; });\n  if (!(total > 0)) throw new Error('không có khối lượng');\n  const mean = total / NB, cand = [];\n  for (let i = 0; i < NB; i++){\n    const v = bins[i].tot; let peak = v >= mean*1.3;\n    for (let d = -2; d <= 2 && peak; d++){ if (d && bins[i+d] && bins[i+d].tot > v) peak = false; }\n    if (peak) cand.push(i);\n  }\n  cand.sort((a,b) => bins[b].tot - bins[a].tot);\n  const picked = [];\n  for (const i of cand){ if (picked.length >= 6) break; if (picked.every(j => Math.abs(j-i) >= 4)) picked.push(i); }\n  const owner = new Array(NB).fill(-1);\n  picked.forEach((i,k) => { owner[i] = k; });\n  const zones = picked.map((i,k) => {\n    const thr = bins[i].tot * .6; let a = i, b = i;\n    while (a > 0 && owner[a-1] === -1 && bins[a-1].tot >= thr){ a--; owner[a] = k; }\n    while (b < NB-1 && owner[b+1] === -1 && bins[b+1].tot >= thr){ b++; owner[b] = k; }\n    let vol = 0, buy = 0;\n    for (let j = a; j <= b; j++){ vol += bins[j].tot; buy += bins[j].buy; }\n    return {lo: bins[a].lo, hi: bins[b].hi, vol, share: vol/total, buyShare: vol ? buy/vol : .5};\n  });\n  // đỉnh/đáy chưa bị quét\n  const sh = [], sl = [], K = SWING_K;\n  for (let i = K; i < cs.length - K; i++){\n    let isH = true, isL = true;\n    for (let d = 1; d <= K; d++){\n      if (cs[i-d].h >= cs[i].h || cs[i+d].h > cs[i].h) isH = false;\n      if (cs[i-d].l <= cs[i].l || cs[i+d].l < cs[i].l) isL = false;\n    }\n    if (isH){ let sw = false; for (let j = i+1; j < cs.length; j++) if (cs[j].h > cs[i].h){ sw = true; break; } if (!sw) sh.push({p:cs[i].h}); }\n    if (isL){ let sw = false; for (let j = i+1; j < cs.length; j++) if (cs[j].l < cs[i].l){ sw = true; break; } if (!sw) sl.push({p:cs[i].l}); }\n  }\n  // ATR 14 nến gần nhất và biến động 8 nến gần nhất (2 giờ với nến 15 phút)\n  let trSum = 0, trN = 0;\n  for (let i = Math.max(1, cs.length - 14); i < cs.length; i++){\n    const pc = cs[i-1].c;\n    trSum += Math.max(cs[i].h - cs[i].l, Math.abs(cs[i].h - pc), Math.abs(cs[i].l - pc)); trN++;\n  }\n  const atr = trN ? trSum / trN : (hi - lo) / 20;\n  const ret = cs.length > 9 ? cs[cs.length-1].c / cs[cs.length-9].c - 1 : 0;\n  // chỉ báo nâng cao, dùng chuỗi giá đóng nến của khoảng dữ liệu này\n  const closes = cs.map(x => x.c);\n  const slopeAt = n => cs.length > n ? cs[cs.length-1].c / cs[cs.length-1-n].c - 1 : 0;\n  return {bins, lo, hi, step, total, poc, zones, sh, sl, atr, ret, last: cs[cs.length-1].c, fetchedAt: Date.now(),\n    er: (() => { const n = Math.min(32, closes.length - 1); if (n < 5) return null; let path = 0; for (let i = closes.length - n; i < closes.length; i++) path += Math.abs(closes[i] - closes[i-1]); return path > 0 ? Math.abs(closes[closes.length-1] - closes[closes.length-1-n]) / path : 0; })(),\n    rsi: rsiCalc(closes, 14), macd: macdCalc(closes), boll: bollCalc(closes, 20, 2),\n    ema20: emaSeries(closes, 20).pop(), ema50: emaSeries(closes, 50).pop(),\n    emaSlope: (() => { const e = emaSeries(closes, 20), n = Math.min(6, e.length - 1); return n > 0 ? (e[e.length-1] - e[e.length-1-n]) / e[e.length-1-n] : 0; })(),\n    slope2h: slopeAt(8), slope8h: slopeAt(32), slope24h: slopeAt(Math.min(cs.length - 1, 96)),\n    supertrend: superTrendCalc(cs), psar: psarCalc(cs), ichimoku: ichimokuCalc(cs), smc: smcCalc(cs), rv6: (() => { try { return revCalc(cs); } catch(_){ return null; } })(),\n    flow: (() => { const n = cs.length, tk = k => { let q = 0, b = 0; for (let i = Math.max(0, n - k); i < n; i++){ q += cs[i].q; b += Math.min(cs[i].bq, cs[i].q); } return {q, b, r: q ? b / q : .5, d: 2*b - q}; };\n      return {t8: tk(8), t32: tk(32), ser: cs.slice(-48).map(x => 2*Math.min(x.bq, x.q) - x.q), pxChg32: n > 32 ? cs[n-1].c / cs[n-33].c - 1 : 0}; })()};\n}\n\n/* Hàng đợi tải nến: tối đa 4 lượt song song, khung đang xem được ưu tiên; lỗi thì lùi dần, không dồn dập gọi lại */\nconst qHi = [], qLo = []; let qAct = 0;\nconst Q_GAP = 300; let qLast = 0, qTimer = null;\nfunction qPump(){\n  if (qTimer || qAct >= 3 || document.hidden || !(qHi.length || qLo.length)) return;\n  const now = Date.now(), wait = Math.max(0, netPause() - now, qLast + Q_GAP - now);\n  if (wait > 0){ qTimer = setTimeout(() => { qTimer = null; qPump(); }, wait + 20); return; }\n  const j = (qHi.length ? qHi : qLo).shift(); qAct++; qLast = Date.now();\n  j.fn().then(j.res, j.rej).finally(() => { qAct--; qPump(); });\n  qPump();\n}\nfunction qRun(id, fn, hi){ return new Promise((res, rej) => { (hi ? qHi : qLo).push({id, fn, res, rej}); qPump(); }); }\nfunction qPromote(id){ const i = qLo.findIndex(j => j.id === id); if (i >= 0) qHi.push(qLo.splice(i, 1)[0]); }\nfunction mergeKlines(a, b){\n  const mb = new Map(b.map(r => [r[0], r]));\n  return a.map(r => { const x = mb.get(r[0]); if (!x) return r;\n    return [r[0], r[1], Math.max(+r[2], +x[2]), Math.min(+r[3], +x[3]), r[4], (+r[5]) + (+x[5]), r[6], (+r[7]) + (+x[7]), (+r[8]) + (+x[8]), (+r[9]) + (+x[9]), (+r[10]) + (+x[10])]; });\n}\nasync function klinesFor(st, sym, spec){\n  const fut = useFut(st), qs = quotesFor(st, fut ? 'fut' : 'spot');\n  if (!qs.length) throw new Error(fut && st.hasFut === false ? sym + ' chưa niêm yết Futures' : 'chưa có cặp ' + sym + 'USDC');\n  const one = q => fut ? getJSON('/fapi/v1/klines?symbol=' + fsymQ(st, q) + '&interval=' + spec.interval + '&limit=' + spec.limit, FREST)\n                       : getJSON('/api/v3/klines?symbol=' + sym + q + '&interval=' + spec.interval + '&limit=' + spec.limit);\n  if (qs.length === 1) return one(qs[0]);\n  const rs = await Promise.allSettled(qs.map(one)), ok = rs.filter(r => r.status === 'fulfilled');\n  if (!ok.length) throw rs[0].reason;\n  return ok.length === 1 ? ok[0].value : mergeKlines(ok[0].value, ok[1].value);\n}\nfunction mergeBooks(js){\n  const info = js.map(j => {\n    const b = j.bids.map(x => [+x[0], +x[1]]), a = j.asks.map(x => [+x[0], +x[1]]); if (!b.length || !a.length) return null;\n    const mid = (b[0][0] + a[0][0]) / 2;\n    return {b, a, mid, cov: Math.min((mid - b[b.length-1][0]) / mid, (a[a.length-1][0] - mid) / mid)};\n  }).filter(Boolean);\n  if (!info.length) throw new Error('sổ lệnh trống');\n  const bids = [], asks = [];\n  info.forEach(x => { x.b.forEach(l => { if ((x.mid - l[0]) / x.mid <= x.cov) bids.push(l); }); x.a.forEach(l => { if ((l[0] - x.mid) / x.mid <= x.cov) asks.push(l); }); });\n  bids.sort((p, q) => q[0] - p[0]); asks.sort((p, q) => p[0] - q[0]);\n  return {bids, asks};\n}\nasync function bookFor(st, sym){\n  const fut = useFut(st), qs = quotesFor(st, fut ? 'fut' : 'spot');\n  if (!qs.length) throw new Error(fut && st.hasFut === false ? sym + ' chưa niêm yết Futures' : 'chưa có cặp ' + sym + 'USDC');\n  const one = q => fut ? getJSON('/fapi/v1/depth?symbol=' + fsymQ(st, q) + '&limit=1000', FREST) : getJSON('/api/v3/depth?symbol=' + sym + q + '&limit=1000');\n  if (qs.length === 1) return one(qs[0]);\n  const rs = await Promise.allSettled(qs.map(one)), ok = rs.filter(r => r.status === 'fulfilled').map(r => r.value);\n  if (!ok.length) throw rs[0].reason;\n  return ok.length === 1 ? ok[0] : mergeBooks(ok);\n}\n/* Lưu nến đã tải vào IndexedDB: mở lại app (kể cả khi Chrome đã đóng tab ngầm) là có dữ liệu ngay, rồi làm mới dần ở nền */\nconst KC = new Map(); let kcDB = null;\nconst kcReady = Promise.race([(async () => {\n  try {\n    kcDB = await new Promise((res, rej) => { const q = indexedDB.open('rcv_klines', 1); q.onupgradeneeded = () => q.result.createObjectStore('k'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });\n    await new Promise(res => { const tx = kcDB.transaction('k', 'readonly'), c = tx.objectStore('k').openCursor();\n      c.onsuccess = () => { const r = c.result; if (r){ KC.set(r.key, r.value); r.continue(); } };\n      tx.oncomplete = tx.onerror = tx.onabort = () => res(); });\n  } catch(_){ kcDB = null; }\n})(), new Promise(r => setTimeout(r, 2500))]);\nconst kcKey = (st, sym, key) => (useFut(st) ? 'f:' : 's:') + sym + ':' + key;\nfunction kcPut(k, rows){ try { if (kcDB) kcDB.transaction('k', 'readwrite').objectStore('k').put({t: Date.now(), rows}, k); } catch(_){} }\nasync function ensureProfile(sym, key, force, hi){\n  await kcReady;\n  const st = state[sym], bucket = TF_SPEC[key] ? 'tfProf' : 'prof', store = st[bucket], spec = PROF[key] || TF_SPEC[key];\n  let cur = store[key];\n  if (!cur && !demo){\n    const c = KC.get(kcKey(st, sym, key));\n    if (c && c.rows && Date.now() - c.t < 7*86400000){\n      try { cur = store[key] = computeProfile(scaleRows(c.rows, st)); cur.fetchedAt = c.t; if (st.price == null && cur.last > 0) st.price = cur.last; } catch(_){ cur = undefined; }\n    }\n  }\n  const ttl0 = Math.max(300000, Math.min(3600000, (INTERVAL_MS[spec.interval] || 900000) / 3)), ttl = (hi && !demo) ? Math.max(60000, Math.min(ttl0, (INTERVAL_MS[spec.interval] || 900000) / 8)) : ttl0;   /* coin và khung đang xem nạp lại nhanh hơn để tín hiệu sớm hơn */\n  if (!force && cur && Date.now() - cur.fetchedAt < ttl) return;\n  const jid = sym + ':' + key;\n  if (st.loading[key]){ if (hi) qPromote(jid); return; }\n  st.pf = st.pf || {};\n  if (!force && st.pf[key] && Date.now() < st.pf[key].until) return;\n  const my = {}; st.loading[key] = my; let tk = liqToken;\n  try {\n    const rows = demo ? fakeKlines(sym, spec)\n      : await qRun(jid, () => { tk = liqToken; return klinesFor(st, sym, spec); }, hi);   /* lấy token lúc thật sự chạy, không phải lúc xếp hàng */\n    if (tk !== liqToken) return;\n    store[key] = computeProfile(scaleRows(rows, st)); st.profErr[key] = null; delete st.pf[key];\n    if (!demo) kcPut(kcKey(st, sym, key), rows);\n    if (st.price == null && store[key].last > 0) st.price = store[key].last;\n  } catch(e){\n    if (tk === liqToken){ st.profErr[key] = (e && e.message) ? e.message : 'lỗi mạng'; const n = ((st.pf[key] && st.pf[key].n) || 0) + 1; st.pf[key] = {n, until: Date.now() + Math.min(60000, 4000 * Math.pow(2, n - 1))}; }\n  } finally {\n    if (st.loading[key] === my) st.loading[key] = false;\n  }\n}\n\n/* Sổ lệnh sát giá: chỉ so sánh trong phạm vi cả hai bên đều có dữ liệu */\nfunction analyzeBook(j, st){\n  const bids = j.bids.map(x => [+x[0], +x[1]]), asks = j.asks.map(x => [+x[0], +x[1]]);\n  if (!bids.length || !asks.length) throw new Error('sổ lệnh trống');\n  const mid = (bids[0][0] + asks[0][0]) / 2;\n  const cov = Math.min((mid - bids[bids.length-1][0]) / mid, (asks[asks.length-1][0] - mid) / mid);\n  const inB = bids.filter(x => (mid - x[0]) / mid <= cov), inA = asks.filter(x => (x[0] - mid) / mid <= cov);\n  const sum = a => a.reduce((s,x) => s + x[0]*x[1], 0);\n  const walls = a => a.map(x => ({p:x[0], usd:x[0]*x[1], d:x[0]/mid - 1})).filter(w => w.usd >= st.th*.4).sort((x,y) => y.usd - x.usd).slice(0,3);\n  return {mid, cov, bidUsd:sum(inB), askUsd:sum(inA), wallsB:walls(inB), wallsA:walls(inA), at:Date.now()};\n}\nasync function fetchBook(sym){\n  const st = state[sym]; if (st.bookLoading) return;\n  const bk = {}; st.bookLoading = bk; const tk = liqToken;\n  try {\n    const j = demo ? fakeBook(sym) : await bookFor(st, sym);\n    if (tk !== liqToken) return;\n    st.book = analyzeBook(scaleBook(j, st), st); st.bookErr = null;\n  } catch(e){\n    if (tk === liqToken) st.bookErr = (e && e.message) ? e.message : 'lỗi mạng';\n  } finally {\n    if (st.bookLoading === bk) st.bookLoading = false;\n  }\n}\nasync function refreshBook(sym){ await fetchBook(sym); if (filterCoin === sym) updateLiq(sym); }\n\nfunction zonesNear(p, px){\n  let dn = null, up = null, inz = null;\n  for (const z of p.zones){\n    if (px >= z.lo && px <= z.hi) inz = z;\n    else if (z.hi < px){ if (!dn || z.hi > dn.hi) dn = z; }\n    else if (z.lo > px){ if (!up || z.lo < up.lo) up = z; }\n  }\n  return {dn, up, inz};\n}\nfunction liqLine(st){\n  const p = st.prof['24h'];\n  if (!p) return st.profErr['24h'] ? '' : '<span>Đang tải vùng thanh khoản…<\/span>';\n  const px = st.price != null ? st.price : p.last, z = zonesNear(p, px);\n  let h = '';\n  if (z.dn) h += '<span class=\"lb\">Vùng mua gần nhất <b>' + pf(z.dn.lo) + ' – ' + pf(z.dn.hi) + '<\/b> (' + pct(z.dn.hi/px - 1) + ')<\/span>';\n  if (z.inz) h += '<span>Giá đang nằm trong vùng thanh khoản <b>' + pf(z.inz.lo) + ' – ' + pf(z.inz.hi) + '<\/b><\/span>';\n  if (z.up) h += '<span class=\"ls\">Vùng bán gần nhất <b>' + pf(z.up.lo) + ' – ' + pf(z.up.hi) + '<\/b> (' + pct(z.up.lo/px - 1) + ')<\/span>';\n  return h;\n}\n\n/* ----- Khung chi tiết của coin đang chọn ----- */\nfunction onSelect(){\n  COINS.forEach(c => {\n    const st = state[c.s], on = c.s === filterCoin;\n    st.liq.hidden = !on; if (!on) st.liq.innerHTML = '';\n  });\n  if (!filterCoin) return;\n  const sym = filterCoin, st = state[sym];\n
