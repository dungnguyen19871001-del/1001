y ').replace(/chiếm (?=\\d)/g,'accounts for ').replace(/(\\d) nến/g,'$1 candles').replace(/ qua(?![\\p{L}])/gu,' window').replace(/ trong (?=[A-Z0-9])/g,' in ').replace(/^(\\s*)Tại (?=\\d)/,'$1At ').replace(/ lúc (?=\\d)/g,' · ').replace(/(\\d+) lệnh/g,'$1 orders').replace(/(\\d+)% mua\\b/g,'$1% buy');cache.set(s,o);return o;}\nfunction skip(n){var p=n.nodeType===3?n.parentNode:n;return !p||!p.closest||p.closest('[data-noi18n],script,style');}\nfunction doText(n){if(skip(n))return;var r=store.get(n);\n if(lang==='en'){if(r&&n.nodeValue===r.out)return;var o=n.nodeValue,out=tr(o);\n  if(out!==o){store.set(n,{orig:o,out:out});n.nodeValue=out;}else if(r)store.delete(n);}\n else if(r){if(n.nodeValue===r.out)n.nodeValue=r.orig;store.delete(n);}}\nvar AT=['aria-label','title','placeholder'];\nfunction doAttr(el,a){if(skip(el))return;var m=astore.get(el);if(!m){m={};astore.set(el,m);}var r=m[a],v=el.getAttribute(a);if(v===null)return;\n if(lang==='en'){if(r&&v===r.out)return;var out=tr(v);if(out!==v){m[a]={orig:v,out:out};el.setAttribute(a,out);}else delete m[a];}\n else if(r){if(v===r.out)el.setAttribute(a,r.orig);delete m[a];}}\nfunction walk(root){\n if(root.nodeType===3){doText(root);return;}if(root.nodeType!==1)return;\n var w=document.createTreeWalker(root,4),n;while((n=w.nextNode()))doText(n);\n var els=[root].concat([].slice.call(root.querySelectorAll('[aria-label],[title],[placeholder]')));\n els.forEach(function(e){AT.forEach(function(a){if(e.hasAttribute&&e.hasAttribute(a))doAttr(e,a);});});}\nvar mo=new MutationObserver(function(ms){ms.forEach(function(m){\n if(m.type==='characterData')doText(m.target);\n else if(m.type==='attributes')doAttr(m.target,m.attributeName);\n else m.addedNodes.forEach(walk);});});\nvar GUIDE_EN=\"<summary>Guide: how does the app detect whales, liquidity zones and liquidations?</summary>\\n<h4>Detecting whale buying or selling</h4>\\n<ul>\\n<li>Whales are large trades. The app watches every trade of the coin/USDT and coin/USDC pairs on {X}, merged into one (Spot and Futures are counted separately). Any trade above that coin's threshold (for example BTC from $300K, SOL from $100K) counts as a whale trade.</li>\\n<li>An aggressive buy (hitting a resting sell order) counts as <b>buy</b>. An aggressive sell (hitting a resting buy order) counts as <b>sell</b>.</li>\\n<li>Within the timeframe you choose, the app adds up the whales' total buying and total selling and checks which side is larger:\\n<ul>\\n<li>60% or more: shows \\\"Whales are buying\\\" or \\\"Whales are selling\\\".</li>\\n<li>80% or more with at least 3 orders: shows \\\"buying heavily\\\" or \\\"selling heavily\\\".</li>\\n<li>Everything else: shows \\\"Balanced\\\".</li>\\n</ul></li>\\n<li>To change the threshold, use the \\\"Large-order threshold\\\" button (Sensitive, Standard, Large, Very large) or edit the <code>th</code> number of each coin in the <code>COINS</code> array at the top of the script.</li>\\n</ul>\\n<h4>Liquidity zones (tap a coin to view)</h4>\\n<ul>\\n<li>Liquidity zones are price levels with a lot of trading. The app splits 24-hour or 7-day trading volume by price level to find them.</li>\\n<li>Zones below the current price are buy zones and usually act as support. Zones above the current price are sell zones and usually act as resistance.</li>\\n<li><b>POC</b> is the most traded price in the selected period.</li>\\n<li><b>Top or bottom not swept</b> is an old level that price has not crossed. Many stop-loss orders sit behind these levels, so price is often pulled back to them.</li>\\n<li><b>Order book near price</b> covers the 1000 nearest price levels in the {X} order book and shows the \\\"walls\\\" of resting buy and sell orders. For BTC and ETH this range is very narrow (under 0.1% around price), so it only reflects support and resistance right now.</li>\\n</ul>\\n<h4>Futures liquidations</h4>\\n<ul>\\n<li>A liquidation is when the exchange is forced to close a leveraged position because the account no longer has enough margin. The app gets this data from {X} USDⓈ-M Futures.</li>\\n<li><b>Longs liquidated</b> (red): forced selling, usually when price falls fast.</li>\\n<li><b>Shorts liquidated</b> (green): forced buying, usually when price rises fast.</li>\\n<li>The liquidation map adds up the liquidated amounts by price level, showing which areas price has swept. These are liquidations that already happened, not a forecast of upcoming liquidation levels.</li>\\n<li>{X} sends at most one liquidation per second per coin, so the real total may be larger than shown. The app only records while the page is open and keeps the last 24 hours in this browser.</li>\\n</ul>\\n<h4>Long / Short signals</h4>\\n<ul>\\n<li>The app scores from -1 (leaning Short) to +1 (leaning Long), combining 16 factors and indicators: whale flow (14.4%), position vs liquidity zone (9.9%), SuperTrend (8.1%), SMC/ICT (8.1%), Ichimoku Cloud (7.2%), RSI + MACD momentum (7.2%), futures funding rate (7.2%), short/medium/long multi-timeframe within the selected timeframe (5.4%), EMA20/EMA50 trend (5.4%), Parabolic SAR (4.5%), Open Interest change (4.5%), futures liquidations (4.5%), Bollinger Bands (3.6%), 2 onchain factors from Arkham (3.6% and 3.6%), order book near price (2.7%). Any factor without data (for example the coin was not opened to load the order book, or Arkham is not configured) is dropped and the remaining weights are rescaled.</li>\\n<li><b>Advanced scoring:</b> weights change automatically with the market state (in a trending market the trend group is favored; in a sideways market momentum and liquidity zones are favored), the score is reduced when volume dries up, and adjusted up or down by the higher-timeframe trend. A signal is only issued when agreeing factors hold at least 50% of the weight, no opposing group holds more than 18% of the weight, and RSI is not extreme.</li>\\n<li><b>Analysis timeframe</b> (chosen in the \\\"Signals\\\" layer when opening a coin): M5, M15, M30, H1, H4, D, W — from 5-minute to monthly candles. Changing it recalculates all indicators, liquidity zones and Entry/SL/TP for that timeframe (the larger the timeframe, the wider SL/TP, since measured price movement is larger). The app loads candles of the selected timeframe for all 20 coins in the background, without opening each coin.</li>\\n<li><b>SuperTrend</b> is a line that follows price based on ATR: price above the line is an uptrend, below is a downtrend. A line that just flipped sides is a new signal and scores higher.</li>\\n<li><b>Parabolic SAR</b> is a series of dots that follow price, used to detect trend and dynamic stop points: dots below price mean an uptrend, dots above price mean a downtrend.</li>\\n<li><b>Ichimoku Cloud</b> uses the cloud (Senkou Span A/B) to identify general support/resistance: price above the cloud leans up, below leans down, inside the cloud means the trend is unclear. The app also uses the nearest cloud edge as a potential SL/TP level.</li>\\n<li><b>SMC/ICT</b> (Smart Money Concepts): the app finds the latest swing highs/lows to detect <b>BOS</b> (Break of Structure, price breaks an old level in the trend direction) and <b>CHoCH</b> (Change of Character, price breaks an old level against the trend, an early reversal signal). It also finds the nearest <b>FVG</b> (Fair Value Gap, an unfilled price gap between 3 consecutive candles) and uses it as a potential SL/TP level.</li>\\n<li><b>RSI(14)</b> measures recent gains vs losses: above 50 leans up, below 50 leans down. <b>MACD</b> measures the gap between the 12 and 26-candle moving averages relative to its signal line, showing whether momentum is strengthening or weakening. The app merges these two indicators into a single \\\"momentum\\\" score.</li>\\n<li><b>EMA20/EMA50</b> are two exponential moving averages. EMA20 above EMA50 and sloping up usually shows an uptrend is dominant, and vice versa.</li>\\n<li><b>Bollinger Bands</b> measure where price sits within the volatility range of the latest 20 candles (%B). Price moving above or below the bands signals strong movement in one direction.</li>\\n<li><b>Multi-timeframe (within the selected timeframe)</b> compares price movement over the latest 8, 32 and 96 candles. When all three lengths point the same way, the app gives a higher score because the trend agrees across several lengths.</li>\\n<li><b>Funding rate</b> is the fee leveraged positions pay each other every 8 hours on futures contracts. High positive funding means Longs are overcrowded and pay Shorts (risk of forced selling); high negative funding means Shorts are overcrowded. The app uses this indicator contrarian (extreme funding often reverses).</li>\\n<li><b>Open Interest (OI)</b> is the total number of open positions on futures. Price rising with OI rising means new money is genuinely entering Longs, which is more reliable than price rising with OI falling (usually just shorts closing).</li>\\n<li>On each timeframe, the app signals Long when the score is +0.22 or higher and Short when it is -0.22 or lower, and the agreeing factors must come from at least 2 of 4 different indicator groups (trend, price structure, momentum, cash flow) rather than piling into one group. If an important factor strongly opposes, the app stays in the Waiting state instead of forcing a signal.</li>\\n<li><b>One signal per timeframe (M5, M15, M30, H1, H4, D, W):</b> timeframes do not need to agree with each other. Each timeframe's signal is a combined score from technical indicators, liquidity zones, volume, liquidations, whale flow and the order book. The app logs a signal when that timeframe has a valid trade plan, confidence Medium or higher, and a direction that stays stable for a few minutes.</li>\\n<li><b>Reset signal log:</b> press the \\\"Reset signal log\\\" button at the top of the list while viewing the \\\"Signals\\\" tab to erase all history and start scanning from scratch at any time.</li>\\n<li><b>About win rate:</b> this is a rule set combining many indicators that many traders trust (SuperTrend, Ichimoku, SMC/ICT, RSI/MACD, EMA, funding rate, open interest...), filtered strictly across 5 timeframes to reduce noise. Although designed to be selective, no formula (including this one) can guarantee a specific win rate in advance, because markets keep changing and the app has not been validated by backtesting on long-term historical data. The real win rate must be tracked by you through the \\\"win/loss\\\" figures shown in the signal log over time.</li>\\n<li><b>Entry, SL, TP</b> are computed from recent volatility (ATR) and liquidity zones, including the Ichimoku cloud edge and price gaps (FVG): SL is placed beyond the nearest support/resistance zone, TP just before the liquidity zones ahead (or by R multiples if no suitable zone exists). If price is not far from a support/resistance zone, the app suggests a limit order there instead of entering immediately.</li>\\n<li><b>Position size</b> = the risk level you choose (0.5%, 1% or 2% of capital) divided by the distance from entry to SL. For example, 1% risk with SL 0.5% from entry gives a position equal to 200% of capital (about 2x leverage).</li>\\n<li>The <b>Signal log</b> (\\\"Signals\\\" tab) records every signal. Each trade has 2 buttons, <b>✓ Follow</b> / <b>✗ Skip</b>, so you choose whether to follow that signal — win/loss and profit/loss are only counted on trades you marked ✓ Follow; unmarked trades or ✗ are excluded from the stats. Limit orders that are not filled are cancelled and <b>not counted as a loss</b>. Open trades have <b>no time limit</b>: they only close when SL is hit or when you press <b>Close trade</b>. When price hits TP1, the app moves SL up (long) or down (short) to a small profit so there is no chance of a loss; at TP2 it moves SL to TP1, at TP3 to TP2 — each step locks in more profit while you decide whether to close or ride on to later TPs. The app also converts results into USDT profit/loss with an assumed capital of 13,000 USDT (position size by the chosen % risk), deducting trading fees (0.1%/0.1% spot, 0.02%/0.05% futures, base tier without BNB discount) and estimated slippage for trades filled at market (market entries, SL hits, auto-closes) — limit orders and TPs are treated as filled at the exact price. These are still estimates, not real trading results.</li>\\n<li>No technical rule set, even one that combines many reputable indicators and requires agreement across several timeframes, can guarantee a specific win rate in advance. This is still a simple rule set, <b>has not been validated by backtesting on real data</b>, and is not investment advice. The true win rate can only be known by tracking your own signal log over time. Because signals are now rarer and need data from 4 timeframes, the app needs about 5 minutes to gather data before it can log the first signal, and each coin waits at least 2 hours between two signals.</li>\\n</ul>\\n<h4>Arkham onchain</h4>\\n<ul>\\n<li><b>Get an API key:</b> Arkham issues API access on a request basis, not instant self-signup. Go to intel.arkm.com/api (or arkm.com/api, press \\\"Start free trial\\\") to request access. Once approved, log in to intel.arkm.com and go to Settings → API Keys to create a key.</li>\\n<li>Large transfers in the last 24 hours are fetched from Arkham's API for each coin. Coins moved <b>out of</b> exchange (CEX) wallets are usually seen as accumulation (leaning Long). Coins moved <b>into</b> exchange wallets are usually seen as preparing to sell (leaning Short).</li>\\n<li>For the funds and market makers on your list, the app calculates whether they are receiving more or sending out coins. The default list is only a suggestion; you should edit it according to the display names on arkm.com.</li>\\n<li>Each coin needs 3 calls and Arkham limits this query type to 1 call per second, so scanning all 20 coins takes about 1 minute. Each data row consumes part of your API plan's quota (datapoints), so the app only fetches when you press the button.</li>\\n<li>Arkham does not cover every blockchain (some coins such as XRP and ADA may have no data). The TradFi group has no onchain data.</li>\\n<li><b>Why is a \\\"proxy\\\" needed?</b> Browsers (including on phones) block web pages from calling most third-party APIs directly for security reasons (CORS). The app needs an intermediate point that receives the browser's request, attaches the API key, and then calls Arkham on your behalf.</li>\\n<li><b>On a phone, no computer needed:</b> Cloudflare offers a \\\"Workers\\\" service that runs that intermediate code for free, created entirely in the browser (dash.cloudflare.com), with no app or command line to install. Open the <code>arkham-worker.js</code> file that comes with the app to see the exact steps and the code to paste. After creating it, you get an address like <code>https://...workers.dev</code>; paste it into the \\\"Proxy address\\\" field in the app and it works.</li>\\n<li><b>On a computer:</b> run the <code>arkham-proxy.py</code> file that comes with the app, then use the address <code>http://localhost:8787</code>.</li>\\n</ul>\\n<h4>News</h4>\\n<ul>\\n<li>The \\\"News\\\" tab gathers headlines from the last 24 hours into 4 groups: <b>Crypto</b>, <b>Gold</b>, <b>Macro</b> (Fed, interest rates, inflation, USD) and <b>World</b> (US, Russia, China, wars, tariffs, sanctions). News is aggregated from Google News and refreshes every few minutes. The red number on the tab is the count of new items since you last looked.</li>\\n<li>The app only shows the headline, publisher name and posting time. Tap an item to read the original article on the publisher's site. Choose the VI or EN button to change the news language.</li>\\n<li>When you tap a coin (the \\\"Filtering\\\" chip), the News tab only keeps items mentioning that coin. Tap ✕ to see everything again.</li>\\n<li>News is only for quick context, is not a buy/sell recommendation, and is not included in the Long/Short signal score.</li>\\n</ul>\\n<h4>Spot and Futures markets</h4>\\n<ul>\\n<li>The app always watches trades of both markets at the same time. In the list, each trade is labeled <b>Buy Spot</b>, <b>Sell Spot</b>, <b>Buy Futures</b> or <b>Sell Futures</b> (Futures have an outline), and you can filter with the All, Spot, Futures buttons. Each coin row shows two separate lines for Spot and Futures.</li>\\n<li>Buy or sell here means the aggressive side of the trade (taker). On futures, a buy may be opening a Long or closing a Short, and a sell may be opening a Short or closing a Long, because the exchange does not say whether a trade opens or closes.</li>\\n<li>The \\\"Market\\\" button (Spot or Futures) chooses the market used for labels on coin rows, candles, volume, order book and liquidity zones.</li>\\n<li>Choose <b>Spot</b> (Crypto group): the app shows Spot buy/sell, volume, the <b>Cash flow</b> layer and a separate <b>Signals</b> tab for Spot. The \\\"Liquidations\\\" tab/layer stays hidden, and futures-only factors (funding, Open Interest, liquidations) are automatically excluded from the Spot signal score.</li>\\n<li><b>Spot cash flow</b> (the \\\"Cash flow\\\" layer when opening a coin): combines Spot whale orders over 15 minutes, 1 hour, 4 hours and 24 hours; aggressive (taker) buy ratio and CVD on candles of the selected timeframe, with detection of divergence between price and CVD; and the order book near price. The result is merged into one score from -1 to +1, shown as an \\\"Inflow / Outflow\\\" chip on each coin row.</li>\\n<li><b>Spot signals</b>: use the same indicators and filtering rules as Futures, plus 2 Spot-specific factors (aggressive buy/sell pressure and CVD). Because Spot cannot be shorted, the app only logs <b>BUY</b> trades (Entry, SL, TP1-3, maximum position size 100% of capital, no leverage, fees 0.1%/0.1%). When the score leans Sell, the app only shows a \\\"Leaning SELL\\\" chip so you avoid new buys or consider taking some profit, and does not log a trade. The signal log is separated by the selected market.</li>\\n<li><b>USDT and USDC combined</b> (Crypto group, applies to both Spot and Futures): coin/USDT and coin/USDC data are summed into one — whale orders, candles and volume, CVD, order book, liquidations and Open Interest (funding is the average of the two pairs). There is no longer a button to pick each pair. A coin without a USDC pair automatically uses USDT. The signal log is only split by Spot / Futures; old signals created from the USDT or USDC pair are shown together. Whale orders and liquidations of the USDC pair are only recorded from when the app has USDC data. TradFi only has the USDT pair.</li>\\n<li>Choose <b>Futures</b> (or the TradFi group, which only has futures): full buy/sell, volume, Liquidations, liquidity, Signals, funding and Open Interest — Spot lines are no longer mixed in, and each coin row only shows the selected market.</li>\\n<li><b>Timeframe</b> uses one shared collapse/expand style everywhere a time choice is needed — whale orders, liquidations, and the volume/signal analysis timeframe in each coin panel: by default it is collapsed to 6 levels M5, M15, M30, H1, H4, D; press the \\\"More\\\" button next to the filter to expand all 13 levels M5, M15, M30, H1, H2, H4, H6, H8, H12, D, 3D, W, M (month). The former \\\"Volume data range\\\" (24 hours/7 days) has been merged into this analysis timeframe for simplicity — whichever timeframe you pick, the Volume chart shows that timeframe's data. The app stores whale order history for up to 30 days in the browser so long timeframes (D, 3D, W, M) have data even after reopening the app.</li>\\n</ul>\\n<h4>TradFi group</h4>\\n<ul>\\n<li>TradFi are perpetual contracts (futures with no expiry) on {X} Futures that track the price of stocks, ETFs, gold, silver, oil... You do not own real stocks or commodities.</li>\\n<li>The app automatically fetches the list of TradFi contracts trading on {X} and picks the 20 contracts with the highest 24-hour volume. The large-order threshold is calculated from that volume ($25K to $500K), so the more active a contract, the higher its threshold.</li>\\n<li>Trades, liquidity zones, order book and liquidations for this group all come from {X} Futures. Contract prices follow the underlying market's sessions, so outside trading hours there may be very few orders.</li>\\n</ul>\\n<h4>Top Altcoin gainers / losers</h4>\\n<ul>\\n<li>The app fetches the 24h %change of all .../USDT pairs trading on {X} Spot, excluding BTC, ETH, stablecoins and leveraged tokens, and only keeps coins with 24h volume of at least 3 million USD to avoid fake %change from very thin liquidity.</li>\\n<li>The <b>Top gainers</b> group is the 20 altcoins with the highest 24h %change; the <b>Top losers</b> group is the 20 lowest (most negative). The large-order threshold is calculated from each coin's 24h volume ($10K to $400K).</li>\\n<li>The list is re-ranked every 3 minutes. Coins that drop out of the Top 20 are removed from the list and new coins entering the Top 20 are added; coins that remain keep their existing whale order and liquidation history.</li>\\n<li>Some altcoins are Spot-only and not listed on {X} Futures, so they will have no Liquidations, Funding, Open Interest or price data when switching to Futures mode.</li>\\n</ul>\\n<h4>Alert sound</h4>\\n<ul>\\n<li><b>Large orders</b>: sounds when a whale order exceeds the current threshold, or a whale-sized liquidation occurs. <b>Very large</b>: only sounds when an order is 3 times the threshold.</li>\\n<li>Two rising tones mean a whale <b>buy</b>, two falling tones mean a whale <b>sell</b>, and three low tones mean a <b>liquidation</b>. Each sound also shows a small notification at the bottom of the screen.</li>\\n<li>Browsers only allow sound after you tap the page, so tap to choose an alert level (the app plays a test sound right away). If you hear nothing, check the volume and your device's silent switch.</li>\\n</ul>\\n<h4>Note</h4>\\n<p>Data only comes from the {X} exchange, not from onchain wallets. Whales can split orders, so some cash flow will not be detected. These are reference tools, not investment advice.</p>\";\nvar EXN={binance:'Binance',okx:'OKX',bybit:'Bybit',hyperliquid:'Hyperliquid'}[window.__BX_EX]||'Binance';\nfunction findGuide(){var ds=document.querySelectorAll('details');for(var i=0;i<ds.length;i++){var s=ds[i].querySelector('summary');if(s&&/^\\s*(Hướng dẫn|Guide)/.test(s.textContent))return ds[i];}return null;}\nfunction guideSwap(){var d=findGuide();if(!d)return;\n if(lang==='en'){if(!d.__viGuide)d.__viGuide=d.innerHTML;d.setAttribute('data-noi18n','1');d.innerHTML=GUIDE_EN.split('{X}').join(EXN);}\n else if(d.__viGuide){d.innerHTML=d.__viGuide;d.__viGuide=null;d.removeAttribute('data-noi18n');}}\nfunction refreshAll(){guideSwap();walk(document.body);renderBtn();tick();}\n/* ---- Nút ngôn ngữ + đồng hồ giờ Việt Nam ---- */\nvar btn=document.createElement('button');btn.type='button';btn.id='langBtn';btn.className='theme-btn';btn.setAttribute('data-noi18n','1');\nbtn.style.cssText='width:auto;min-width:40px;padding:0 8px!important;font-weight:700;font-size:12px;letter-spacing:.04em';\nvar clk=document.createElement('span');clk.id='vnClock';clk.className='toggle';clk.setAttribute('data-noi18n','1');\nclk.style.cssText='cursor:default;font-variant-numeric:tabular-nums;white-space:nowrap';\nvar fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Ho_Chi_Minh',hour12:false,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});\nfunction tick(){var p={};fmt.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});\n var h=p.hour==='24'?'00':p.hour;\n clk.textContent=(lang==='en'?'VN time ':'Giờ VN ')+h+':'+p.minute+':'+p.second+' · '+p.day+'/'+p.month;\n clk.title=lang==='en'?'Vietnam time (UTC+7)':'Giờ Việt Nam (UTC+7)';}\nfunction renderBtn(){btn.textContent=lang==='en'?'EN':'VI';btn.title=lang==='en'?'Switch to Vietnamese':'Chuyển sang tiếng Anh';btn. ưu tiên lệnh chờ tại vùng hoặc chờ nến khung '+r.tf+' đóng xác nhận. Giá chạm SL là kịch bản sai.':'Lệnh thuận xu hướng: giá chạm SL là kịch bản sai.';\n    h+=lvl.outerHTML+planNote+'<p class=\"note\">'+tailTx+'<\/p>';\n  } else if(reason && r.desc.replace(/\\s+/g,' ').indexOf(reason.replace(/\\s+/g,' ').slice(0,28))<0){\n    h+='<p class=\"note\">Chưa có lệnh: '+reason+'<\/p>';\n  }\n  h+=logNote;\n  /* 6. điểm gốc của app (tham khảo) */\n  if(facs){ var sm=facs.querySelector('summary'); if(sm) sm.textContent='Yếu tố của điểm gốc'; facs.classList.add('rvorig'); h+=facs.outerHTML; }\n  return h+'<\/div>'+tail+'<p class=\"rv-disc\">Quy tắc heuristic, chưa backtest, không phải lời khuyên đầu tư.<\/p>';\n}\nfunction rvChip(r){\n  var cls='sgchip soft', t='';\n  if(r.phase==='cont'){ cls+=' '+(r.T>0?'long':'short'); t='Tiếp diễn '+(r.T>0?'▲':'▼'); }\n  else if(r.phase==='rev'){ cls+=' '+(r.dirN>0?'long':'short'); t='Đảo chiều '+(r.dirN>0?'▲':'▼'); }\n  else if(r.phase==='new'){ cls+=' '+(r.dirN>0?'long':'short'); t='Xu hướng mới '+(r.dirN>0?'▲':'▼'); }\n  else if(r.phase==='warn'){ t='Cảnh báo đảo chiều'; }\n  else return '';\n  return '<span class=\"'+cls+'\" title=\"'+r.label+'\">'+t+'<\/span>';\n}\nwindow.sigHTML=function(st){\n  var h=oSH(st), f=st.sf;\n  if(!f||!f.rv) return h;\n  try{ return rvCard(st,f,h); }catch(e){ return h; }\n};\nwindow.sigChip=function(st){\n  var b=oSC(st), f=st.sf;\n  if(!f||!f.rv||!srcOn()) return b;\n  try{ return b+rvChip(f.rv); }catch(e){ return b; }\n};\n\n/* ---- Ghi loại kịch bản (tiếp diễn/đảo chiều) và nguồn tín hiệu vào sổ tín hiệu ---- */\nif(typeof issueSignal==='function'){\n  var oIS=issueSignal;\n  window.issueSignal=function(st,tf,f){\n    oIS(st,tf,f);\n    try{\n      if(srcOn()&&f&&f.rv&&sigLog.length){\n        var g=sigLog[sigLog.length-1];\n        if(g&&g.s===st.s&&g.tf===tf&&Date.now()-g.t<2000&&!g.rvk){ g.rvk=f.rv.phase; g.rvs=srcKey(); }\n      }\n    }catch(e){}\n  };\n}\nif(typeof renderSigFeed==='function'){\n {}\n  try{ render(); }catch(_){}\n});\n\n/* ---- Hướng dẫn ở chân trang ---- */\ntry{\n  var det=document.querySelector('footer details');\n  if(det){\n    var hs=det.querySelectorAll('h4'), last=null;\n    for(var i=0;i<hs.length;i++){ if(/^\\s*Lưu ý/.test(hs[i].textContent)) last=hs[i]; }\n    var g='<h4>Tín hiệu: chỉ báo kỹ thuật và dòng tiền thông minh<\/h4><ul>'+\n      '<li>Thẻ tín hiệu có hai danh sách, mỗi danh sách có công tắc <b>bật/tắt riêng<\/b>: chọn một trong hai hoặc cả hai. Tắt cả hai thì app dùng lại quy tắc gốc.<\/li>'+\n      '<li><b>1 · Chỉ báo kỹ thuật<\/b> là tín hiệu gốc, dùng để nhận biết xu hướng tiếp diễn hay đảo chiều: SuperTrend, EMA20/50, Ichimoku, Parabolic SAR, đa khung, RSI và MACD, SMC/ICT (BOS, CHoCH, FVG), Bollinger. Mỗi chỉ báo có điểm từ −1 đến +1 (dương là nghiêng Mua/Long).<\/li>'+\n      '<li><b>2 · Dòng tiền thông minh<\/b> gồm khối lượng (giá so với POC và vùng giá trị, khối lượng nở hay cạn), thanh khoản (lực mua/bán tại vùng, khoảng trống tới hỗ trợ/kháng cự, đỉnh đáy chưa bị quét), và theo thị trường: <b>Spot<\/b> dùng mua/bán chủ động, CVD và phân kỳ, cá voi, sổ lệnh; <b>Futures<\/b> dùng thanh lý (trọng số lớn nhất), cá voi, CVD, Open Interest, funding và <b>kết hợp thêm Spot<\/b> (nến Spot, cá voi Spot, so sánh Spot với Futures: cùng chiều là xác nhận, lệch nhau là nhịp do đòn bẩy, tin cậy bị hạ). Mỗi lệnh thanh lý 4 giờ qua được chấm theo giá hiện tại và giảm một nửa trọng số sau mỗi 30 phút.<\/li>'+\n      '<li><b>Điểm tổng<\/b> là 40% chỉ báo kỹ thuật cộng 60% dòng tiền thông minh khi bật cả hai; bật một nguồn thì chỉ dùng nguồn đó. Xu hướng hiện có (SuperTrend, EMA, Ichimoku, SAR, đa khung) từ ±0,2 trở lên mới tính là có xu hướng, và vẫn được tham chiếu khi tắt chỉ báo kỹ thuật.<\/li>'+\n      '<li><b>Tiếp diễn<\/b> khi điểm xác nhận (nhân chiều xu hướng) từ +0,18 trở lên. <b>Đảo chiều<\/b> khi từ −0,22 trở xuống và có ít nhất 1 dấu hiệu (CHoCH, SuperTrend đổi chiều, MACD đảo dấu, vượt Bollinger, RSI cực đoan, giá áp sát vùng cản, phân kỳ CVD, quay qua POC, thanh lý ngược chiều, khối lượng cạn). <b>Cảnh báo<\/b> khi từ −0,12 trở xuống nhưng chưa đủ dấu hiệu. <b>Xu hướng mới<\/b> khi chưa có xu hướng nhưng điểm xác nhận từ ±0,3.<\/li>'+\n      '<li>Mỗi thẻ có đủ <b>điểm số<\/b>, <b>cảnh báo<\/b> (dấu hiệu đảo chiều, hai nguồn lệch nhau, khối lượng cạn, thanh lý lớn, yếu tố ngược chiều mạnh), <b>lời khuyên<\/b> (cỡ lệnh, cách quản lý lệnh) và <b>tín hiệu lệnh<\/b> (vào lệnh, vào nhẹ, chờ nến xác nhận hoặc đứng ngoài) cùng Entry, SL, TP1 đến TP3. Độ tin cậy bị hạ một bậc khi hai nguồn ngược chiều nhau.<\/li>'+\n      '<li><b>Dòng vốn thị trường<\/b> là nguồn tín hiệu thứ ba trong thẻ tín hiệu, có công tắc bật/tắt riêng và chiếm 20% điểm tổng khi bật (hai nguồn còn lại chia 80% theo tỷ lệ 40/60). App dựng lại các đồ thị TOTAL, TOTAL2, TOTAL3, BTC.D, USDT.D, USDC.D từ giá các coin lớn và vốn hóa CoinMarketCap (dự phòng CoinGecko), cùng BTCUSDT, BTCUSDT.P, BTCUSDC, BTCUSDC.P, BTCFDUSD từ nến Binance, rồi phân tích từng đồ thị bằng nến đã đóng (xu hướng, CHoCH/BOS, quét thanh khoản, phân kỳ RSI). Kết quả cho ra khẩu vị rủi ro (vốn vào hay rút khỏi thị trường) và luân chuyển BTC sang altcoin. Dòng vốn ngược chiều làm hạ độ tin cậy, dòng vốn vừa đổi chiều cùng hướng đảo chiều thì cộng thêm bằng chứng sớm. Không áp dụng cho vàng, chứng khoán và stablecoin.<\/li>'+\n      '<li>Lệnh đảo chiều là lệnh ngược xu hướng cũ nên rủi ro cao hơn: ưu tiên lệnh chờ tại vùng hoặc chờ nến đóng xác nhận, và giảm cỡ lệnh. Spot chỉ có lệnh MUA; khi điểm nghiêng Bán app chỉ báo tránh mua hoặc chốt bớt. Quy tắc này chưa backtest, không phải lời khuyên đầu tư.<\/li><\/ul>';\n    if(last) last.insertAdjacentHTML('beforebegin',g); else det.insertAdjacentHTML('beforeend',g);\n  }\n}catch(e){}\n}catch(err){ try{ console.warn('rv module',err); }catch(_){} }\n})();\n<\/script>";
var RVSUB="/* ===== Quy tắc dịch câu động (có số liệu): chạy TRƯỚC bảng thay chuỗi, nên câu được dịch trọn vẹn, không bị dịch dở ===== */\nvar RULES=[];\nfunction mkRe(t){ return new RegExp(t.replace(/[.*+?^$()|[\\]\\\\]/g,'\\\\$&').replace(/\\{N\\}/g,'([−+\\\\-]?\\\\$?\\\\d[\\\\d.,]*[KMB%x]?)').replace(/\\{W\\}/g,'(.+?)'),'g'); }\nfunction R(t,rep){ RULES.push([mkRe(t),rep]); }\nvar DIR={'Mua':'Buy','Bán':'Sell','Long':'Long','Short':'Short','tăng':'up','giảm':'down','TĂNG':'UP','GIẢM':'DOWN'};\nvar CFM={'chỉ báo kỹ thuật cùng dòng tiền thông minh':'technical indicators and smart money','động lượng và cấu trúc giá (RSI/MACD, SMC, Bollinger)':'momentum and price structure (RSI/MACD, SMC, Bollinger)','khối lượng, thanh lý và thanh khoản':'volume, liquidations and liquidity','khối lượng, dòng tiền Spot và thanh khoản':'volume, Spot cash flow and liquidity'};\nfunction cf(x){ return CFM[x]||x; }\nfunction dr(x){ return DIR[x]||x; }\n/* --- Banner lệnh lớn --- */\nvar NOUN={'coin':['coin','coins'],'hợp đồng':['contract','contracts']};\nfunction nn(n,w){ var x=NOUN[w]; return x?(n==='1'?x[0]:x[1]):w; }\nRULES.push([/(Spot|Futures|Spot và Futures): (Mua nhiều hơn bán|Bán nhiều hơn mua) ([^\\s]+) trong (\\S+) qua, qua (\\d+) lệnh lớn\\. (\\d+) (.+?) đang được mua, (\\d+) (.+?) đang bị bán\\./g,function(m,a,b,c,d,e,f,g,h,i){ return a+': '+(b[0]==='M'?'More buying than selling ':'More selling than buying ')+c+' in the '+d+' window, across '+e+' large order'+(e==='1'?'':'s')+'. '+f+' '+nn(f,g)+' being bought, '+h+' '+nn(h,i)+' being sold.'; }]);\nRULES.push([/Tổng (\\S+) qua (\\d+) lệnh trong (\\S+) qua(?:, nhiều nhất ở (\\S+) \\(([^)]+)\\))?\\./g,function(m,a,b,c,d,e){ return 'Total '+a+' across '+b+' orders in the '+c+' window'+(d?', most in '+d+' ('+e+').':'.'); }]);\nR('Thử chọn ngưỡng “Nhạy” để thấy nhiều lệnh hơn.','Try the “Sensitive” threshold to see more orders.');\nR('Chưa thấy tường lệnh lớn','No large order-book walls seen');\nR('Đang hiển thị dữ liệu giả lập để xem thử giao diện. Đây không phải thị trường thật.','Showing simulated data to preview the interface. This is not the real market.');\nR('Danh sách TradFi giả lập để xem thử giao diện. ','Simulated TradFi list to preview the interface. ');\nR('TradFi là hợp đồng perpetual theo giá cổ phiếu, ETF, vàng, bạc, dầu… trên Binance Futures, không phải cổ phiếu thật. Danh sách là {N} hợp đồng có khối lượng 24 giờ lớn nhất, ngưỡng lệnh lớn tự tính theo khối lượng đó. Ngoài giờ giao dịch của thị trường gốc, lệnh có thể rất ít.','TradFi are perpetual contracts that track stocks, ETFs, gold, silver, oil… on Binance Futures, not real shares. The list is the $1 contracts with the largest 24-hour volume, and the large-order threshold is set automatically from that volume. Outside the underlying market\\'s trading hours there may be very few orders.');\nR('Tuỳ chọn: thêm dữ liệu ví sàn, quỹ và market maker. Cần API key Arkham và một proxy miễn phí (Cloudflare Worker), xem hướng dẫn ở cuối trang.','Optional: add exchange-wallet, fund and market-maker data. Needs an Arkham API key and a free proxy (Cloudflare Worker), see the guide at the bottom of the page.');\nR('Quỹ và market maker cần theo dõi (mỗi dòng một tên Arkham, lấy từ địa chỉ trang entity trên intel.arkm.com)','Funds and market makers to track (one Arkham name per line, taken from the entity page address on intel.arkm.com)');\nR('Biểu đồ nhúng không đăng nhập được tài khoản TradingView. Trên TradingView, mở layout đã lưu của bạn, sao chép link trên thanh địa chỉ rồi dán vào đây. Link chỉ lưu trong trình duyệt này.','The embedded chart cannot sign in to your TradingView account. On TradingView, open your saved layout, copy the link from the address bar and paste it here. The link is stored only in this browser.');\nR('Dán link layout, ví dụ tradingview.com/chart/AbCdEfGh/','Paste layout link, e.g. tradingview.com/chart/AbCdEfGh/');\nR('Biểu đồ vùng thanh khoản ','Liquidity zone chart ');\nRULES.push([/Bản đồ thanh lý ([A-Z0-9]{2,12})\\b/g,'Liquidation map $1']);\nR('Dòng tiền mua bán chủ động và CVD','Aggressive buy/sell flow and CVD');\nR('Lớp hiển thị','Display layer');\nRULES.push([/Cập nhật (\\d+:\\d+) · Nguồn: Google News, tổng hợp từ nhiều báo\\. Bấm vào tin để đọc bài gốc\\./g,'Updated $1 · Source: Google News, aggregated from many outlets. Tap a story to read the original.']);\n/* --- Trạng thái tín hiệu theo khung --- */\nRULES.push([/Khung (\\S+) đang nghiêng (Mua|Bán|Long|Short)\\. Đang thu thập dữ liệu, app sẽ tự ghi tín hiệu sau khoảng (\\d+) phút\\./g,function(m,a,b,c){ return 'The '+a+' timeframe leans '+dr(b)+'. Collecting data; the app will log the signal automatically in about '+c+' min.'; }]);\nR('Đang thu thập dữ liệu ở các khung M5 đến W, tín hiệu đầu tiên có thể xuất hiện sau khoảng {N} phút.','Collecting data on timeframes M5 to W; the first signal may appear in about $1 min.');\n/* --- Ghi chú các yếu tố --- */\nR('Giá trên POC {N}, đã vượt vùng giá trị (cao nhất {N}), thị trường chấp nhận giá cao hơn.','Price is above POC $1, has moved above the value area (high $2), the market is accepting higher prices.');\nR('Giá dưới POC {N}, đã thủng vùng giá trị (thấp nhất {N}), thị trường chấp nhận giá thấp hơn.','Price is below POC $1, has dropped below the value area (low $2), the market is accepting lower prices.');\nR('Giá trên POC {N}, vẫn trong vùng giá trị {N} – {N}.','Price is above POC $1, still inside the value area $2 – $3.');\nR('Giá dưới POC {N}, vẫn trong vùng giá trị {N} – {N}.','Price is below POC $1, still inside the value area $2 – $3.');\nR('Khối lượng 8 nến gần nhất bằng {N} lần trung bình 32 nến, giá {N}','Volume over the last 8 candles is $1x the 32-candle average, price $2');\nR(' (chưa thành nhịp rõ).',' (no clear move yet).');\nR(', khối lượng nở ra nên nhịp này có lực.',', expanding volume gives this move strength.');\nR(', khối lượng cạn nên nhịp này thiếu lực.',', drying volume means this move lacks strength.');\nR('Tại vùng','At vùng');\nR('vùng hỗ trợ {N} – {N} có {N} là lực mua','support zone $1 – $2 is $3 buying pressure');\nR('vùng kháng cự {N} – {N} có {N} là lực mua','resistance zone $1 – $2 is $3 buying pressure');\nR('vùng đang đứng {N} – {N} có {N} là lực mua','current zone $1 – $2 is $3 buying pressure');\nR('Dưới 50% nghĩa là bên bán áp đảo ở vùng đó.','Below 50% means sellers dominate that zone.');\nR('Đỉnh chưa bị quét {N} (cách {N} ATR)','Unswept high $1 ($2 ATR away)');\nR('Không có đỉnh chưa quét phía trên','No unswept high above');\nR('đáy chưa bị quét {N} (cách {N} ATR)','unswept low $1 ($2 ATR away)');\nR('không có đáy chưa quét phía dưới','no unswept low below');\nR('Giá thường bị kéo về mốc gần hơn để quét lệnh dừng lỗ.','Price is often pulled to the nearer level to sweep stop-losses.');\nR('Mua chủ động chiếm {N} khối lượng 8 nến gần nhất và {N} trong 32 nến.','Aggressive buying is $1 of volume over the last 8 candles and $2 over 32 candles.');\nR('Mua chủ động chiếm {N} khối lượng 8 nến và {N} trong 32 nến.','Aggressive buying is $1 of volume over 8 candles and $2 over 32 candles.');\nR('Trên 50% là bên mua đang chủ động hơn.','Above 50% means buyers are more aggressive.');\nR('Trên 50% là bên mua chủ động hơn.','Above 50% means buyers are more aggressive.');\nR('CVD 32 nến {N} (mua chủ động nhiều hơn bán).','CVD over 32 candles $1 (aggressive buying exceeds selling).');\nR('CVD 32 nến {N} (bán chủ động nhiều hơn mua).','CVD over 32 candles $1 (aggressive selling exceeds buying).');\nR('Phân kỳ tăng trên Spot: giá giảm nhưng lực mua chủ động vẫn dương.','Bullish divergence on Spot: price falls but aggressive buying is still positive.');\nR('Phân kỳ giảm trên Spot: giá tăng nhưng lực bán chủ động vẫn chiếm ưu thế.','Bearish divergence on Spot: price rises but aggressive selling still dominates.');\nR('Phân kỳ tăng: giá giảm nhưng lực mua chủ động vẫn dương.','Bullish divergence: price falls but aggressive buying is still positive.');\nR('Phân kỳ giảm: giá tăng nhưng lực bán chủ động vẫn chiếm ưu thế.','Bearish divergence: price rises but aggressive selling still dominates.');\nR('Cá voi Futures (từ {N}), mua trừ bán: 15 phút {N}, 1 giờ {N}, 4 giờ {N}, 24 giờ {N}.','Futures whales (from $1), net buying: 15 min $2, 1 h $3, 4 h $4, 24 h $5.');\nR('Cá voi Spot (từ {N}), mua trừ bán: 15 phút {N}, 1 giờ {N}, 4 giờ {N}, 24 giờ {N}.','Spot whales (from $1), net buying: 15 min $2, 1 h $3, 4 h $4, 24 h $5.');\nR('4 giờ qua: long bị thanh lý {N}, short bị thanh lý {N}, lệnh lớn nhất {N} ({W}) tại {N}.','Last 4 hours: longs liquidated $1, shorts liquidated $2, largest order $3 ($4) at $5.');\nR('4 giờ qua: long bị thanh lý {N}, short bị thanh lý {N}.','Last 4 hours: longs liquidated $1, shorts liquidated $2.');\nR('Thanh lý chưa nghiêng rõ về bên nào.','Liquidations do not clearly favor either side.');\nR('Thanh lý đang đẩy giá lên: short bị quét khi giá còn trên mức đó, hoặc long đã bị quét xong và giá hồi lại trên vùng thanh lý.','Liquidations are pushing price up: shorts were swept while price is still above that level, or longs were already swept and price rebounded above the liquidation zone.');\nR('Thanh lý đang đẩy giá xuống: long bị quét khi giá còn dưới mức đó, hoặc short đã bị quét xong và giá rớt lại dưới vùng thanh lý.','Liquidations are pushing price down: longs were swept while price is still below that level, or shorts were already swept and price fell back below the liquidation zone.');\nR('OI {N} trong {N} phút, giá {N}.','OI $1 over $2 min, price $3.');\nR('SuperTrend, EMA20/50, Ichimoku, SAR, đa khung. Dương là xu hướng tăng.','SuperTrend, EMA20/50, Ichimoku, SAR, multi-timeframe. Positive means an uptrend.');\nR('Giá phá lên trên đỉnh gần nhất trong lúc cấu trúc đang giảm (CHoCH tăng, có thể đảo chiều).','Price broke above the latest high while structure was bearish (bullish CHoCH, possible reversal).');\nR('Giá phá lên trên đỉnh gần nhất, tiếp diễn cấu trúc tăng (BOS tăng).','Price broke above the latest high, continuing bullish structure (bullish BOS).');\nR('Giá phá xuống dưới đáy gần nhất trong lúc cấu trúc đang tăng (CHoCH giảm, có thể đảo chiều).','Price broke below the latest low while structure was bullish (bearish CHoCH, possible reversal).');\nR('Giá phá xuống dưới đáy gần nhất, tiếp diễn cấu trúc giảm (BOS giảm).','Price broke below the latest low, continuing bearish structure (bearish BOS).');\nRULES.push([/ Có FVG (tăng|giảm) chưa lấp tại ({N}) – ({N})\\./g.source?new RegExp(' Có FVG (tăng|giảm) chưa lấp tại ([^\\\\s]+) – ([^\\\\s]+)\\\\.','g'):null,function(m,a,b,c){ return ' Unfilled '+(a==='tăng'?'bullish':'bearish')+' FVG at '+b+' – '+c+'.'; }]);\n/* --- Điểm số, cảnh báo, lời khuyên --- */\nRULES.push([/Xu hướng (tăng|giảm) \\(điểm xu hướng ([^)]+)\\) vẫn được (.+?) ủng hộ, điểm xác nhận theo chiều xu hướng ([^\\s(]+) \\(dương là ủng hộ tiếp diễn\\)\\./g,function(m,a,b,c,d){ return 'The '+dr(a)+'trend (trend score '+b+') is still supported by '+cf(c)+'; confirmation score along the trend direction '+d+' (positive supports continuation).'; }]);\nRULES.push([/Xu hướng (tăng|giảm) đang bị (.+?) phản đối \\(điểm xác nhận theo chiều xu hướng ([^)]+)\\) kèm (\\d+) dấu hiệu đảo chiều\\. Ưu tiên kịch bản (tăng|giảm)\\./g,function(m,a,b,c,d,e){ return 'The '+dr(a)+'trend is being opposed by '+cf(b)+' (confirmation score along the trend direction '+c+') with '+d+' reversal sign'+(d==='1'?'':'s')+'. The '+dr(e)+' scenario is preferred.'; }]);\nRULES.push([/Xu hướng (tăng|giảm) còn, nhưng (.+?) đang yếu đi \\(điểm xác nhận theo chiều xu hướng ([^)]+)\\) mà chưa có dấu hiệu đủ rõ để kết luận đảo chiều\\. Không nên vào thêm lệnh thuận xu hướng, chờ xác nhận\\./g,function(m,a,b,c){ return 'The '+dr(a)+'trend remains, but '+cf(b)+' are weakening (confirmation score along the trend direction '+c+') without clear enough signs to call a reversal. Do not add with-trend orders; wait for confirmation.'; }]);\nRULES.push([/Xu hướng hiện có chưa rõ \\(điểm ([^)]+)\\) nhưng (.+?) đang nghiêng (tăng|giảm) khá mạnh \\(điểm ([^)]+)\\)\\./g,function(m,a,b,c,d){ return 'The existing trend is unclear (score '+a+') but '+cf(b)+' lean '+dr(c)+' fairly strongly (score '+d+').'; }]);\nRULES.push([/Xu hướng hiện có chưa nghiêng rõ \\(điểm ([^)]+)\\) và (.+?) cũng chưa đủ mạnh để xác nhận một hướng mới \\(điểm ([^)]+)\\)\\./g,function(m,a,b,c){ return 'The existing trend does not lean clearly (score '+a+') and '+cf(b)+' are not strong enough to confirm a new direction (score '+c+').'; }]);\nRULES.push([/Xu hướng (tăng|giảm) còn nhưng (.+?) đang trung tính \\(điểm xác nhận theo chiều xu hướng ([^)]+)\\), chưa đủ cơ sở vào lệnh\\./g,function(m,a,b,c){ return 'The '+dr(a)+'trend remains but '+cf(b)+' are neutral (confirmation score along the trend direction '+c+'), not enough basis to enter.'; }]);\nRULES.push([/Các yếu tố xác nhận ủng hộ xu hướng (tăng|giảm) \\(điểm ([^)]+)\\) nhưng chỉ báo kỹ thuật chưa ủng hộ \\(điểm ([^)]+)\\), nên chưa ra lệnh\\./g,function(m,a,b,c){ return 'The confirming factors support the '+dr(a)+'trend (score '+b+') but technical indicators do not yet (score '+c+'), so no order yet.'; }]);\nR(' Giá đang hồi ngược chiều nhưng lực xác nhận chưa gãy, ưu tiên vào lại ở vùng thanh khoản gần nhất.',' Price is pulling back but confirmation has not broken; prefer re-entering at the nearest liquidity zone.');\nR(' Xu hướng tham chiếu lấy từ giá, không tính vào điểm.',' The reference trend is taken from price and is not counted in the score.');\nRULES.push([/Giá đã vượt dải Bollinger (trên|dưới), nhịp (tăng|giảm) dễ bị kéo về\\./g,function(m,a,b){ return 'Price is beyond the '+(a==='trên'?'upper':'lower')+' Bollinger band; the '+dr(b)+' move is likely to be pulled back.'; }]);\nRULES.push([/RSI ở vùng cực đoan \\((\\d+)\\), nhịp (tăng|giảm) dễ hụt hơi\\./g,function(m,a,b){ return 'RSI is in an extreme zone ('+a+'); the '+dr(b)+' move may run out of steam.'; }]);\nRULES.push([/Giá đang áp sát vùng (kháng cự|hỗ trợ) ([^\\s]+) – ([^\\s]+) \\(cách ([^\\s]+) ATR\\)\\./g,function(m,a,b,c,d){ return 'Price is close to the '+(a==='kháng cự'?'resistance':'support')+' zone '+b+' – '+c+' ('+d+' ATR away).'; }]);\nR('Cấu trúc giá bị phá ngược chiều xu hướng (CHoCH): ','Structure broke against the trend (CHoCH): ');\nR('SuperTrend vừa đổi chiều ngược xu hướng.','SuperTrend just flipped against the trend.');\nR('MACD đã đảo dấu ngược chiều xu hướng.','MACD has flipped sign against the trend.');\nR('Giá đã quay sang phía bên kia POC {N} so với chiều xu hướng.','Price has moved to the other side of POC $1 relative to the trend direction.');\nR('Thanh lý đang đi ngược chiều xu hướng.','Liquidations are running against the trend.');\nRULES.push([/Nhịp (tăng|giảm) gần nhất có khối lượng cạn \\(([^\\s]+) lần trung bình\\), thiếu lực để đi tiếp\\./g,function(m,a,b){ return 'The latest '+dr(a)+' move has drying volume ('+b+'x the average) and lacks the strength to continue.'; }]);\nR('Dòng tiền Spot đang đi ngược chiều xu hướng ({N}), nhịp Futures thiếu Spot xác nhận.','Spot cash flow is running against the trend ($1); the Futures move lacks Spot confirmation.');\nRULES.push([/Hai nguồn đang lệch nhau: chỉ báo kỹ thuật nghiêng (tăng|giảm) \\(([^)]+)\\)( \\(đang tắt\\))?, dòng tiền thông minh nghiêng (tăng|giảm) \\(([^)]+)\\)( \\(đang tắt\\))?\\./g,function(m,a,b,c,d,e,f){ return 'The two sources disagree: technical indicators lean '+dr(a)+' ('+b+')'+(c?' (off)':'')+', smart money leans '+dr(d)+' ('+e+')'+(f?' (off)':'')+'.'; }]);\nR(' Đây là đặc điểm của giai đoạn đảo chiều: chỉ báo kỹ thuật thường đổi chiều sau dòng tiền.',' This is typical of a reversal phase: technical indicators usually turn after cash flow.');\nR(' Độ tin cậy đã bị hạ một bậc.',' Confidence was lowered one notch.');\nRULES.push([/Khối lượng đang cạn \\(([^\\s]+) lần trung bình\\), dễ có nhịp quét giá giả, tín hiệu kém tin cậy\\./g,function(m,a){ return 'Volume is drying up ('+a+'x the average); false sweeps are likely and signals are less reliable.'; }]);\nR('Yếu tố ngược chiều mạnh: ','Strong opposing factor: ');\nR('Thanh lý lớn trong 4 giờ qua ({N}), biến động có thể rất mạnh, nên giảm đòn bẩy.','Large liquidations in the last 4 hours ($1); volatility can be very strong, so reduce leverage.');\nR('Spot không bán khống, điểm đang nghiêng Bán.','Spot cannot be shorted; the score leans Sell.');\nRULES.push([/Spot và Futures lệch nhau: Futures nghiêng (tăng|giảm) \\(([^)]+)\\), Spot nghiêng (tăng|giảm) \\(([^)]+)\\)\\. Nhịp do đòn bẩy dễ bị quét ngược, nên giảm đòn bẩy\\./g,function(m,a,b,c,d){ return 'Spot and Futures disagree: Futures leans '+dr(a)+' ('+b+'), Spot leans '+dr(c)+' ('+d+'). A leverage-driven move can be swept back; reduce leverage.'; }]);\nRULES.push([/Cỡ lệnh khuyến nghị: (\\S+) mức rủi ro đã chọn, tức khoảng (\\S+) vốn\\./g,function(m,a,b){ return 'Suggested size: '+a+' of your chosen risk, about '+b.replace(',','.')+' of capital.'; }]);\nR('Ưu tiên vào theo xu hướng, chờ nhịp hồi về vùng thanh khoản gần nhất thay vì đuổi giá.','Trade with the trend and wait for a pullback to the nearest liquidity zone instead of chasing price.');\nR(' Giá đang hồi ngược nhịp mà lực xác nhận chưa gãy, nên đặt lệnh chờ ở vùng gần nhất.',' Price is pulling back while confirmation has held; place a limit order at the nearest zone.');\nRULES.push([/Đây là lệnh ngược xu hướng cũ: chờ nến khung (\\S+) đóng xác nhận hoặc đặt lệnh chờ tại vùng, giảm cỡ lệnh\\. Giá chạm SL nghĩa là kịch bản đảo chiều sai, thoát ngay\\./g,'This order goes against the old trend: wait for a confirming $1 candle close or place a limit order at the zone, and reduce size. If price hits the SL the reversal scenario was wrong, exit immediately.']);\nR('Không mở thêm lệnh thuận xu hướng. Nếu đang giữ lệnh, cân nhắc chốt bớt 30 đến 50% hoặc dời SL lên hòa vốn.','Do not add with-trend orders. If you hold a position, consider taking 30 to 50% off or moving the SL to breakeven.');\nR('Xu hướng mới mới chỉ có tín hiệu dẫn trước, nên vào nhẹ và chỉ tăng cỡ lệnh khi SuperTrend và EMA cùng chiều.','The new trend only has leading signals so far: enter small and add size only when SuperTrend and EMA agree.');\nR('Dòng tiền đã ủng hộ nhưng chỉ báo kỹ thuật chưa theo: chờ chỉ báo kỹ thuật cùng chiều rồi mới vào.','Cash flow agrees but technical indicators do not yet follow: wait for them to turn the same way before entering.');\nR('Chưa có lợi thế rõ, nên đứng ngoài và chờ giá thoát vùng đi ngang cùng khối lượng nở ra.','No clear edge: stay out and wait for price to leave the range with expanding volume.');\nR('Quản lý lệnh: chốt khoảng 1/3 ở TP1 và dời SL về hòa vốn, chốt thêm ở TP2, phần còn lại gồng tới TP3 hoặc khi dấu hiệu đảo chiều xuất hiện.','Trade management: take about 1/3 at TP1 and move the SL to breakeven, take more at TP2, and hold the rest to TP3 or until reversal signs appear.');\nR('Nếu đang giữ coin Spot, chốt bớt hoặc dời SL lên, chờ điểm quay lại dương mới mua.','If you hold Spot coins, take some profit or raise your SL, and wait for the score to turn positive before buying.');\nR('Futures đang kéo giá mà Spot không theo: dễ là nhịp quét thanh khoản, chờ nến đóng xác nhận và nên giảm cỡ lệnh.','Futures is pushing price while Spot does not follow: likely a liquidity sweep, so wait for a candle close and reduce size.');\nRULES.push([/Spot cùng chiều (tăng|giảm) \\(([^)]+)\\): dòng tiền thật xác nhận cho lệnh Futures, tin cậy hơn\\./g,function(m,a,b){ return 'Spot is in the same direction ('+dr(a)+', '+b+'): real cash flow confirms the Futures order, so it is more reliable.'; }]);\nR('Mới dùng một nguồn: bật cả hai để đối chiếu chéo, độ tin cậy sẽ chắc hơn.','Only one source is on: turn on both to cross-check, and confidence will be firmer.');\nRULES.push([/Spot \\(([^)]+)\\) và Futures \\(([^)]+)\\) cùng nghiêng (Mua|Bán) chủ động, dòng tiền thật xác nhận cho đòn bẩy\\./g,function(m,a,b,c){ return 'Spot ('+a+') and Futures ('+b+') both lean aggressive '+dr(c)+', so real cash flow confirms the leverage.'; }]);\nRULES.push nd BTC-to-altcoin rotation. Capital flow against the chosen direction lowers confidence, and a fresh capital-flow turn in the reversal direction adds early evidence. It does not apply to gold, stocks or stablecoins.');\n\nR('Dòng vốn thị trường: dòng vốn vào/ra thị trường, luân chuyển giữa BTC, altcoin và stablecoin','Market capital flow: money entering or leaving the market and rotating between BTC, altcoins and stablecoins');\nR('Perp USDC mua chủ động mạnh hơn Spot USDC: dòng tiền đòn bẩy đi bằng USDC đang dẫn trước.','USDC Perp aggressive buying is stronger than USDC Spot: leveraged money using USDC is leading.');\nR('Nguồn vốn hóa: ','Market cap source: ');\nR('Cả ba nguồn đang tắt','All three sources are off');\nR('Bật ít nhất một nguồn bên dưới để xem điểm, cảnh báo, lời khuyên và tín hiệu lệnh. Khi cả ba đều tắt, app dùng quy tắc gốc.','Turn on at least one source below to see scores, warnings, advice and order signals. When all three are off, the app uses the original rules.');\nR('32% chỉ báo kỹ thuật, 48% dòng tiền thông minh và 20% dòng vốn thị trường.','32% technical indicators, 48% smart money and 20% market capital flow.');\nR('80% chỉ báo kỹ thuật và 20% dòng vốn thị trường.','80% technical indicators and 20% market capital flow.');\nR('80% dòng tiền thông minh và 20% dòng vốn thị trường.','80% smart money and 20% market capital flow.');\nR('Chỉ dùng dòng vốn thị trường.','Using market capital flow only.');\nR('Chưa có dữ liệu dòng vốn thị trường.','No market capital flow data yet.');\nR('Khẩu vị rủi ro, luân chuyển BTC sang altcoin và xu hướng các đồ thị TOTAL, BTC.D, USDT.D.','Risk appetite, BTC-to-altcoin rotation and the trend of the TOTAL, BTC.D and USDT.D charts.');\nR(' Chưa có dữ liệu, tạm không tính.',' No data yet, not counted for now.');\nR('Không áp dụng cho nhóm này','Not applicable to this group');\nObject.assign(EX,{'Dòng vốn thị trường':'Market capital flow','Kỹ thuật + dòng vốn':'Technical + capital flow','Dòng tiền + dòng vốn':'Smar var RVGEN="<h4>Signals: technical indicators and smart money<\/h4><ul><li>The signal card has two lists, each with its <b>own on/off switch<\/b>: pick either one or both. With both off, the app falls back to the original rules.<\/li><li><b>1 · Technical indicators<\/b> are the base signal that tells whether the trend continues or reverses: SuperTrend, EMA20/50, Ichimoku, Parabolic SAR, multi-timeframe, RSI and MACD, SMC/ICT (BOS, CHoCH, FVG), Bollinger. Each scores from -1 to +1 (positive leans Buy/Long).<\/li><li><b>2 · Smart money<\/b> covers volume (price vs POC and value area, volume expanding or drying up), liquidity (buy/sell pressure at zones, room to support/resistance, unswept highs/lows), and by market: <b>Spot<\/b> uses aggressive buy/sell, CVD and divergence, whales and the order book; <b>Futures<\/b> uses liquidations (largest weight), whales, CVD, Open Interest and funding, <b>plus Spot<\/b> (Spot candles, Spot whales, Spot vs Futures: same direction confirms, a mismatch means a leverage-driven move and lowers confidence). Each liquidation from the last 4 hours is scored against the current price and halves in weight every 30 minutes.<\/li><li><b>Total score<\/b> = 40% technical + 60% smart money when both are on; with one on, only that source counts. The existing trend (SuperTrend, EMA, Ichimoku, SAR, multi-timeframe) counts from +/-0.2 and stays as a reference even if technical indicators are off.<\/li><li><b>Continuation<\/b>: confirmation score (times trend direction) from +0.18. <b>Reversal<\/b>: from -0.22 with at least one sign (CHoCH, SuperTrend flip, MACD sign flip, Bollinger breakout, extreme RSI, price at opposing zone, CVD divergence, price across POC, opposing liquidations, drying volume). <b>Warning<\/b>: from -0.12 without enough signs. <b>New trend<\/b>: no trend yet but confirmation from +/-0.3.<\/li><li>Each card shows <b>scores<\/b>, <b>warnings<\/b> (reversal signs, sources disagreeing, drying volume, large liquidations, strong opposing factors), <b>advice<\/b> (size, trade management) and the <b>order signal<\/b> (enter, enter small, wait for a confirming candle, or stay out) with Entry, SL and TP1 to TP3. Confidence drops one notch when the two sources disagree.<\/li><li>Reversal orders trade against the old trend and are riskier: prefer a limit order at the zone or wait for a candle close, and size down. Spot only has BUY orders. Not backtested, not investment advice.<\/li><li data-ex=hyperliquid><b>Hyperliquid only:<\/b> there is no public exchange-wide liquidation feed, so the Liquidations tab has no data and the liquidation factor is skipped (the other factors re-weight automatically). Candles carry no taker split, so aggressive buy/sell and CVD are estimated from candle shape at half weight. Funding is paid hourly and is multiplied by 8 to match other exchanges. kPEPE, kSHIB, kBONK… (priced per 1000 coins) are converted to 1 coin. Spot lists only a few coins, so the app opens in Futures mode. TradFi contracts come from HIP-3 markets deployed by third parties. The TradingView chart uses Binance reference prices.<\/li><\/ul><h4>Economic calendar (US)<\/h4><ul><li>The “Economic Calendar” tab lists US (USD) economic events in your device time zone: release time, impact level (High, Medium, Low), <b>Forecast<\/b> (what economists expect), <b>Previous<\/b> (last period's figure) and <b>Actual<\/b> (the figure just released).<\/li><li>When an actual figure is available, the app compares it with the forecast (or the previous figure if no forecast exists) and shows the typical impact on <b>USD, XAU (gold) and BTC<\/b>: ▲ means up, ▼ means down, two arrows mean a large gap. For example, CPI or NFP above forecast usually lifts USD while gold and BTC come under pressure; an unemployment rate above forecast does the opposite. For events not yet released, the app shows two scenarios (above or below forecast).<\/li><li>The free source only provides forecast and previous figures. To get actual figures mond|trade balance|capacity utilization|inventories|personal (spending|income)|leading index|manufacturing index/i,'growth']\n];\nfunction kindOf(t){for(var i=0;i<RL.length;i++)if(RL[i][0].test(t))return RL[i][1];return '';}\n/* d = +1 nếu số liệu cao hơn dự kiến khiến USD mạnh lên. */\nvar SG={infl:1,jobs:1,jobsweak:-1,rate:1,growth:1};\nfunction parseNum(s){\n  if(s==null)return null;s=String(s).replace(/[\\s,$€£]/g,'');\n  var m=s.match(/^[<>≤≥]?(-?\\d+(?:\\.\\d+)?)([KMBT%]?)/i);if(!m)return null;\n  var v=parseFloat(m[1]),u=m[2].toUpperCase(),mul={K:1e3,M:1e6,B:1e9,T:1e12}[u]||1;\n  return {v:v*mul,pct:u==='%'};\n}\nfunction assess(e){\n  var k=kindOf(e.title);if(!k)return null;\n  if(k==='speech')return {kind:k};\n  var ac=parseNum(acOf(e));if(!ac)return {kind:k,pending:true};\n  var base=parseNum(e.fc),ref='fc';if(!base){base=parseNum(e.pv);ref='pv';}\n  if(!base)return {kind:k,noRef:true};\n  var diff=Math.round((ac.v-base.v)*1e6)/1e6,sc=Math.max(Math.abs(base.v),1e-9);\n  var inl=ac.pct?Math.abs(diff)<0.0499:Math.abs(diff)/sc<0.005;\n  if(inl)return {kind:k,inline:true,ref:ref};\n  var strong=ac.pct?Math.abs(diff)>=0.1999:Math.abs(diff)/sc>=0.1;\n  var up=diff>0,d=(up?1:-1)*SG[k],kk=strong?2:1;\n  return {kind:k,up:up,d:d,k:kk,ref:ref,usd:d*kk,xau:-d*kk,btc:k==='growth'?0:-d*kk};\n}\nfunction arrow(v){return v>=2?'▲▲':v===1?'▲':v<=-2?'▼▼':v===-1?'▼':'◆';}\nfunction chip(n,v){return '<span class=\"ic '+(v>0?'up':v<0?'dn':'fl')+'\">'+n+' '+arrow(v)+'<\/span>';}\nfunction chips(u,x,b){return chip('USD',u)+chip('XAU',x)+chip('BTC',b);}\nvar EXPL={\n infl:[T('Lạm phát/giá cao hơn dự kiến: kỳ vọng Fed giữ lãi suất cao lâu hơn, lợi suất Mỹ tăng. USD mạnh lên, vàng và BTC chịu áp lực.','Inflation/prices above forecast: markets expect the Fed to keep rates high for longer and US yields rise. USD firms, gold and BTC come under pressure.'),\n       T('Lạm phát/giá thấp hơn dự kiến: kỳ vọng cắt lãi suất tăng, lợi suất giảm. USD yếu đi, vàng và BTC được hỗ trợ.','Inflation/prices below forecast: rate-cut expectations rise and yields fall. USD weakens, gold and BTC are supported.')],\n jobs:[T('Việc làm mạnh hơn dự kiến: thị trường lao động còn vững nên Fed ít vội cắt lãi suất. USD mạnh lên, vàng và BTC chịu áp lực.','Jobs stronger than forecast: a resilient labor market gives the Fed less reason to cut. USD firms, gold and BTC come under pressure.'),\n       T('Việc làm yếu hơn dự kiến: kỳ vọng cắt lãi suất tăng. USD yếu đi, vàng và BTC được hỗ trợ (nếu yếu quá mức, nỗi lo suy thoái có thể làm BTC giảm).','Jobs weaker than forecast: rate-cut expectations rise. USD weakens, gold and BTC are supported (if very weak, recession fears can hit BTC).')],\n jobsweak:[T('Thất nghiệp/đơn trợ cấp cao hơn dự kiến: thị trường lao động yếu đi, kỳ vọng cắt lãi suất tăng. USD yếu đi, vàng và BTC được hỗ trợ.','Unemployment/claims above forecast: the labor market softens and rate-cut expectations rise. USD weakens, gold and BTC are supported.'),\n       T('Thất nghiệp/đơn trợ cấp thấp hơn dự kiến: thị trường lao động vững, Fed ít vội cắt lãi suất. USD mạnh lên, vàng và BTC chịu áp lực.','Unemployment/claims below forecast: the labor market is firm and the Fed has less reason to cut. USD firms, gold and BTC come under pressure.')],\n rate:[T('Lãi suất/định hướng diều hâu hơn dự kiến: USD mạnh lên, vàng và BTC chịu áp lực.','Rates/guidance more hawkish than forecast: USD firms, gold and BTC come under pressure.'),\n       T('Lãi suất/định hướng ôn hòa hơn dự kiến: USD yếu đi, vàng và BTC được hỗ trợ.','Rates/guidance more dovish than forecast: USD weakens, gold and BTC are supported.')],\n growth:[T('Tăng trưởng mạnh hơn dự kiến: lợi suất tăng nên USD mạnh lên, vàng chịu áp lực. BTC phản ứng không rõ (tâm lý ưa rủi ro đối trọng với lợi suất tăng).','Growth stronger than forecast: yields rise so USD firms and gold is pressured. BTC reaction is unclear (risk appetite vs higher yields).'),\n         T('Tăng trưởng yếu hơn dự kiến: lợi suất giảm nên USD ,day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(ms)),o={};p.forEach(function(x){o[x.type]=+x.value;});return Date.UTC(o.year,o.month-1,o.day,o.hour,o.minute,o.second)-ms;}\nfunction etUtc(y,m,d,h,mi){var g=Date.UTC(y,m-1,d,h,mi),o=tzOff(g,'America/New_York'),r=g-o;o=tzOff(r,'America/New_York');return g-o;}\nfunction fallback(){\n  var out=[],now=new Date(),b=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate())-86400000;\n  for(var k=0;k<24;k++){\n    var d=new Date(b+k*86400000),y=d.getUTCFullYear(),m=d.getUTCMonth()+1,dd=d.getUTCDate(),wd=d.getUTCDay(),ds=y+'-'+pad(m)+'-'+pad(dd);\n    if(wd===4)out.push({ts:etUtc(y,m,dd,8,30),title:'Unemployment Claims',imp:'med',fc:'',pv:'',ac:'',est:true});\n    if(wd===5&&dd<=7){out.push({ts:etUtc(y,m,dd,8,30),title:'Non-Farm Employment Change',imp:'high',fc:'',pv:'',ac:'',est:true});out.push({ts:etUtc(y,m,dd,8,30),title:'Unemployment Rate',imp:'high',fc:'',pv:'',ac:'',est:true});}\n    if(FOMC.indexOf(ds)>-1){\n      out.push({ts:etUtc(y,m,dd,14,0),title:'FOMC Statement',imp:'high',fc:'',pv:'',ac:'',est:true});\n      out.push({ts:etUtc(y,m,dd,14,0),title:'Federal Funds Rate',imp:'high',fc:'',pv:'',ac:'',est:true});\n      out.push({ts:etUtc(y,m,dd,14,30),title:'FOMC Press Conference',imp:'high',fc:'',pv:'',ac:'',est:true});\n    }\n  }\n  out.sort(function(a,b){return a.ts-b.ts;});return out;\n}\nfunction readCache(){try{var c=JSON.parse(localStorage.getItem(CK)||'null');if(c&&Array.isArray(c.ev)&&c.ev.length&&Date.now()-c.ts<7*86400000)return c;}catch(_){}return null;}\nfunction dedupe(all){var seen={};all=all.filter(function(x){var k=x.ts+x.title;if(seen[k])return false;seen[k]=1;return true;});all.sort(function(a,b){return a.ts-b.ts;});return all;}\nasync function fetchAll(){\n  if(S.api){\n    try{\n      var j=await tget(S.api.replace(/\\/+$/,'')+'/eco');\n      var a=norm(Array.isArray(j)?j:(j&&j.items)||[]);\n      if(a.length)return {ev:dedupe(a),from:'api'};\n
