oin('') + '<\/div><button class=\"chip winmore\" data-moretoggle=\"1\">Thêm ▾<\/button><\/div>' +\n    '<button class=\"chip\" data-close>Thu gọn<\/button><\/div><\/div>' +\n    '<div class=\"liq-body\"><div><div class=\"liq-chart\"><\/div><p class=\"note liq-note\"><\/p><\/div>' +\n    '<div><div class=\"liq-zones\"><\/div><div class=\"liq-book\"><\/div><\/div><\/div>';\n  const layerSeg = st.liq.querySelector('.layer-seg');\n  if (layerSeg) layerSeg.addEventListener('click', e => {\n    const b = e.target.closest('button'); if (!b) return;\n    cfg.layer = b.dataset.layer; syncSegs(); updateLiq(sym);\n  });\n  const winSegEl = st.liq.querySelector('.win-seg');\n  if (winSegEl) winSegEl.addEventListener('click', e => {\n    const b = e.target.closest('button'); if (!b) return;\n    cfg.lwin = Number(b.dataset.lw); render();\n  });\n  st.liq.querySelector('.tf-seg').addEventListener('click', e => {\n    const b = e.target.closest('button'); if (!b) return;\n    cfg.tf = b.dataset.tf;\n    document.querySelectorAll('.tf-seg button').forEach(x => x.setAttribute('aria-pressed', x.dataset.tf === cfg.tf ? 'true' : 'false'));\n    ensureProfile(sym, cfg.tf, true, true).then(() => { if (filterCoin === sym) updateLiq(sym); }); updateLiq(sym);\n  });\n  st.liq.querySelector('[data-close]').addEventListener('click', () => { filterCoin = null; onSelect(); render(); });\n  if (!st.liq.dataset.arkBound){\n    st.liq.dataset.arkBound = '1';\n    st.liq.addEventListener('click', e => {\n      const b = e.target.closest('[data-ark]'); if (!b) return;\n      const cur = filterCoin;\n      if (b.dataset.ark === 'fetch'){ fetchArk(cur).then(() => { if (filterCoin === cur){ updateLiq(cur); render(); } }); updateLiq(cur); }\n      if (b.dataset.ark === 'open'){ const box = $('arkBox'); box.open = true; const mo = box.closest('details.more'); if (mo) mo.open = true; box.scrollIntoView({block:'center'}); }\n    });\n  }\n}\nfunction updateLiq(sym){\n  const st = state[sym], chart = memoH(st.liq.querySelector('.liq-chart'));\n  if (!chart) return;\n  st.liq.dataset.layer = cfg.layer;\n  const zones = memoH(st.liq.querySelector('.liq-zones')), note = st.liq.querySelector('.liq-note');\n  if (cfg.layer === 'sig'){\n    const tf = cfg.tf, p = st.tfProf[tf], act = sigLog.find(x => x.s === sym && sigMk(x) && (x.tf || 'H1') === tf && x.status !== 'closed');\n    const view = act ? act : (st.sf && st.sf.plan && st.sf.plan.ok ? st.sf.plan : null);\n    chart.innerHTML = p ? chartSVG(st, p, view) : '<p class=\"empty\">' + (st.profErr[tf] ? 'Không tải được dữ liệu nến khung ' + TF_SPEC[tf].label + ' (' + st.profErr[tf] + ').' : 'Đang tải dữ liệu nến khung ' + TF_SPEC[tf].label + ' để tính tín hiệu…') + '<\/p>';\n    zones.innerHTML = sigHTML(st);\n    note.textContent = 'Khung phân tích: ' + TF_SPEC[tf].label + '. Nền màu là vùng thanh khoản của khung này.' + (view ? ' Đường ngang: vàng là giá vào lệnh, đỏ là SL, xanh là các mức TP.' : '');\n  } else if (cfg.layer === 'flow'){\n    const tf = cfg.tf, p = st.tfProf[tf];\n    chart.innerHTML = p && p.flow ? flowChartSVG(p) : '<p class=\"empty\">' + (st.profErr[tf] ? 'Không tải được dữ liệu nến khung ' + TF_SPEC[tf].label + ' (' + st.profErr[tf] + ').' : 'Đang tải dữ liệu nến khung ' + TF_SPEC[tf].label + ' để phân tích dòng tiền…') + '<\/p>';\n    zones.innerHTML = flowHTML(st);\n    note.textContent = p && p.flow ? 'Cột xanh/đỏ: chênh lệch mua chủ động trừ bán chủ động (USD) của từng nến khung ' + TF_SPEC[tf].label + ', 48 nến gần nhất. Đường vàng là dòng tiền tích lũy (CVD): đi lên nghĩa là lực mua chủ động đang chiếm ưu thế.' : '';\n  } else if (cfg.layer === 'liq'){\n    const d = liqBins(st);\n    chart.innerHTML = liqChartSVG(st, d);\n    zones.innerHTML = liqSideHTML(st, d);\n    note.textContent = d ? 'Thanh ngang là tiền bị thanh lý ở từng mức giá trong ' + LWIN_LABEL[cfg.lwin] + ' qua. Đỏ bên trái: long bị thanh lý (lệnh bán cưỡng bức). Xanh bên phải: short bị thanh lý (lệnh mua cưỡng bức). Nền màu là vùng thanh khoản từ khối lượng 24 giờ.' : '';\n  } else {\n    const tf = cfg.tf, p = st.tfProf[tf];\n    if (!p){\n      const msg = st.profErr[tf] ? 'Không tải được dữ liệu khối lượng (' + st.profErr[tf] + '). App sẽ thử lại sau ít phút.' : 'Đang tải dữ liệu khối lượng khung ' + TF_SPEC[tf].label + '…';\n      chart.innerHTML = '<p class=\"empty\">' + msg + '<\/p>'; zones.innerHTML = ''; note.textContent = '';\n    } else {\n      chart.innerHTML = chartSVG(st, p);\n      zones.innerHTML = zonesHTML(st, p);\n      note.textContent =\n        'Thanh ngang là khối lượng giao dịch khung ' + TF_SPEC[tf].label + ' qua ở từng mức giá (đỏ: bán chủ động, xanh: mua chủ động). ' +\n        'Nền màu đánh dấu vùng thanh khoản. Bong bóng bên phải là lệnh cá voi trong ' + WIN_LABEL[cfg.win] + ' qua: cột trái là mua, cột phải là bán.';\n    }\n  }\n  memoH(st.liq.querySelector('.liq-book')).innerHTML = bookHTML(st);\n}\nconst NARROW = () => !!(window.matchMedia && matchMedia('(max-width:720px)').matches);\n/* Nhãn giá hiện tại dạng thẻ có nền, không bị các thanh khối lượng che */\nfunction pricePill(x, y, txt){\n  const w = txt.length * 6.6 + 12, yy = Math.max(2, y - 9);\n  return '<rect class=\"pill\" x=\"' + x + '\" y=\"' + yy.toFixed(1) + '\" width=\"' + w.toFixed(0) + '\" height=\"17\" rx=\"4\"/>' +\n         '<text class=\"lbl pl-t\" x=\"' + (x + 6) + '\" y=\"' + (yy + 12.5).toFixed(1) + '\">' + txt + '<\/text>';\n}\n/* Lề trái theo độ dài nhãn giá (coin giá nhỏ có nhãn dài, không bị cắt) và số lẻ đủ để phân biệt các mốc */\nfunction axFmt(lo, hi){\n  const st = (hi - lo) / 4, mid = (hi + lo) / 2;\n  if (!(mid > 0)) return pf;\n  const base = mid >= 1000 ? 0 : mid >= 1 ? 2 : mid >= .01 ? 4 : Math.min(10, 2 - Math.floor(Math.log10(mid)));\n  const need = st > 0 ? Math.min(10, Math.ceil(-Math.log10(st)) + 1) : base;\n  return need <= base ? pf : (v => v.toFixed(need));\n}\nfunction axLeft(labels, nr){\n  const fs = nr ? 12 : 11, w = Math.max.apply(null, labels.map(t => String(t).length)) * fs * .64 + 12;\n  return Math.max(nr ? 44 : 64, Math.ceil(w));\n}\n/* Chỉ ghi lại DOM khi nội dung đổi: bớt vẽ lại SVG mỗi nhịp 0,7 giây, nhẹ hơn trên điện thoại */\nfunction memoH(el){ return el ? { set innerHTML(h){ if (el.__h !== h){ el.__h = h; el.innerHTML = h; } } } : el; }\nfunction chartSVG(st, p, plan){\n  const nr = NARROW();\n  const W = nr ? 360 : 640, H = nr ? 290 : 320, R = nr ? 34 : 64, T = 10, B = 10, ch = H - T - B;\n  const px = st.price != null ? st.price : p.last;\n  let lo = p.lo, hi = p.hi;\n  if (plan){\n    const lv = [plan.entry, plan.sl].concat(plan.tps);\n    lo = Math.min(lo, Math.min.apply(null, lv)); hi = Math.max(hi, Math.max.apply(null, lv));\n    const pad = (hi - lo) * .03; lo -= pad; hi += pad;\n  }\n  const fmt = axFmt(lo, hi), L = axLeft([fmt(hi), fmt(lo)], nr), cw = W - L - R;\n  const y = v => T + (hi - Math.min(hi, Math.max(lo, v))) / (hi - lo) * ch;\n  const max = Math.max.apply(null, p.bins.map(b => b.tot)) || 1;\n  let s = '<svg class=\"' + (nr ? 'nr' : '') + '\" viewBox=\"0 0 ' + W + ' ' + H + '\" role=\"img\" aria-label=\"Biểu đồ vùng thanh khoản ' + st.s + '\">';\n  for (let i = 0; i <= 4; i++){\n    const v = hi - (hi - lo) * i / 4, yy = y(v);\n    s += '<line class=\"grid-l\" x1=\"' + L + '\" x2=\"' + (W - 4) + '\" y1=\"' + yy.toFixed(1) + '\" y2=\"' + yy.toFixed(1) + '\"/>' +\n         '<text x=\"' + (L - 5) + '\" y=\"' + (yy + 4).toFixed(1) + '\" text-anchor=\"end\">' + fmt(v) + '<\/text>';\n  }\n  for (const z of p.zones){\n    const y1 = y(z.hi), y2 = y(z.lo), cls = (px >= z.lo && px <= z.hi) ? 'zone-in' : (z.hi < px ? 'zone-sup' : 'zone-res');\n    s += '<rect class=\"' + cls + '\" x=\"' + L + '\" y=\"' + y1.toFixed(1) + '\" width=\"' + (W - 4 - L) + '\" height=\"' + Math.max(2, y2 - y1).toFixed(1) + '\"/>';\n  }\n  p.bins.forEach(b => {\n    const yy = y(b.hi), hh = Math.max(.8, y(b.lo) - yy - .35).toFixed(2), w = b.tot / max * cw, bw = b.buy / max * cw, sw = Math.max(0, w - bw);\n    s += '<rect class=\"bin-s\" x=\"' + L + '\" y=\"' + (yy + .18).toFixed(2) + '\" width=\"' + sw.toFixed(1) + '\" height=\"' + hh + '\"/>' +\n         '<rect class=\"bin-b\" x=\"' + (L + sw).toFixed(1) + '\" y=\"' + (yy + .18).toFixed(2) + '\" width=\"' + bw.toFixed(1) + '\" height=\"' + hh + '\"/>';\n  });\n  const pb = p.bins[p.poc], py = y((pb.lo + pb.hi) / 2);\n  s += '<line class=\"poc-l\" x1=\"' + L + '\" x2=\"' + (W - 4) + '\" y1=\"' + py.toFixed(1) + '\" y2=\"' + py.toFixed(1) + '\"/>' +\n       '<text class=\"poc\" x=\"' + (W - 2) + '\" y=\"' + (py - 3).toFixed(1) + '\">POC<\/text>';\n  // lệnh cá voi theo giá: cột chấm riêng ở mép phải\n  const now = Date.now(), cut = now - cfg.win * 60000, lim = st.th * cfg.mult, agg = {};\n  for (const e of st.ev){\n    if (e.t < cut || e.usd < lim || (e.mk || 'spot') !== (useFut(st) ? 'fut' : 'spot') || !qOk(e, st) || e.price == null || e.price < p.lo || e.price > p.hi) continue;\n    const j = Math.min(NB - 1, Math.floor((e.price - p.lo) / p.step)), a = agg[j] || (agg[j] = {b:0, s:0});\n    if (e.side === 'buy') a.b += e.usd; else a.s += e.usd;\n  }\n  const dx1 = L + cw + (nr ? 9 : 14), dx2 = L + cw + (nr ? 25 : 34), rmax = nr ? 6 : 9;\n  Object.keys(agg).forEach(j => {\n    const b = p.bins[j], cy = y((b.lo + b.hi) / 2), a = agg[j];\n    const rad = v => Math.max(3, Math.min(rmax, 2.5 + Math.sqrt(v / st.th) * 2.2)).toFixed(1);\n    if (a.b) s += '<circle class=\"dot-b\" cx=\"' + dx1 + '\" cy=\"' + cy.toFixed(1) + '\" r=\"' + rad(a.b) + '\"/>';\n    if (a.s) s += '<circle class=\"dot-s\" cx=\"' + dx2 + '\" cy=\"' + cy.toFixed(1) + '\" r=\"' + rad(a.s) + '\"/>';\n  });\n  if (plan){\n    /* nhãn Vào/SL/TP: đẩy giãn cách tối thiểu để không chồng lên nhau */\n    const items = [{v:plan.entry, k:'e', t:'Vào'}, {v:plan.sl, k:'sl', t:'SL'}].concat(plan.tps.map((t, i) => ({v:t, k:'tp', t:'TP' + (i + 1)})));\n    items.forEach(it => { it.y = y(it.v); it.ty = it.y - 4; });\n    const srt = items.slice().sort((a, b) => a.ty - b.ty), gap = nr ? 14 : 13;\n    for (let i = 1; i < srt.length; i++) if (srt[i].ty - srt[i - 1].ty < gap) srt[i].ty = srt[i - 1].ty + gap;\n    for (const it of items){\n      s += '<line class=\"pl pl-' + it.k + '\" x1=\"' + L + '\" x2=\"' + (W - 4) + '\" y1=\"' + it.y.toFixed(1) + '\" y2=\"' + it.y.toFixed(1) + '\"/>' +\n           '<text class=\"pt pt-' + it.k + '\" x=\"' + (L + cw - 4) + '\" y=\"' + it.ty.toFixed(1) + '\">' + it.t + ' ' + pf(it.v) + '<\/text>';\n    }\n  }\n  const gy = y(px);\n  s += '<line class=\"px-l\" x1=\"' + L + '\" x2=\"' + (W - 4) + '\" y1=\"' + gy.toFixed(1) + '\" y2=\"' + gy.toFixed(1) + '\"/>' +\n       pricePill(L + 4, gy, 'Giá ' + fmt(px)) + '<\/svg>';\n  return s;\n}\nfunction zonesHTML(st, p){\n  const px = st.price != null ? st.price : p.last, up = [], dn = [];\n  let inz = null;\n  for (const z of p.zones){\n    const sub = 'chiếm ' + (z.share * 100).toFixed(1) + '% khối lượng, ' + Math.round(z.buyShare * 100) + '% là lực mua';\n    const t = pf(z.lo) + ' – ' + pf(z.hi);\n    if (px >= z.lo && px <= z.hi){ inz = {t, sub}; continue; }\n    if (z.lo > px) up.push({at:z.lo, d:z.lo / px - 1, t, sub});\n    else dn.push({at:z.hi, d:z.hi / px - 1, t, sub});\n  }\n  const sh = p.sh.filter(x => x.p > px).sort((a,b) => a.p - b.p)[0];\n  if (sh) up.push({at:sh.p, d:sh.p / px - 1, t:'Đỉnh chưa bị quét ' + pf(sh.p), sub:'Lệnh dừng lỗ thường nằm phía trên mốc này'});\n  const sl = p.sl.filter(x => x.p < px).sort((a,b) => b.p - a.p)[0];\n  if (sl) dn.push({at:sl.p, d:sl.p / px - 1, t:'Đáy chưa bị quét ' + pf(sl.p), sub:'Lệnh dừng lỗ thường nằm phía dưới mốc này'});\n  up.sort((a,b) => a.at - b.at); dn.sort((a,b) => b.at - a.at);\n  const li = a => a.length\n    ? a.slice(0, 4).map(x => '<li><div><b>' + x.t + '<\/b><small>' + x.sub + '<\/small><\/div><span class=\"d\">' + pct(x.d) + '<\/span><\/li>').join('')\n    : '<li><span class=\"none\">Không có vùng nổi bật trong khoảng dữ liệu này<\/span><\/li>';\n  const pb = p.bins[p.poc];\n  return (inz ? '<p class=\"inz\">Giá đang nằm trong vùng thanh khoản <b>' + inz.t + '<\/b>, ' + inz.sub + '.<\/p>' : '') +\n    '<h5>Phía trên giá: thanh khoản bán, kháng cự<\/h5><ul class=\"zl up\">' + li(up) + '<\/ul>' +\n    '<h5>Phía dưới giá: thanh khoản mua, hỗ trợ<\/h5><ul class=\"zl dn\">' + li(dn) + '<\/ul>' +\n    '<p class=\"note\">Giá được giao dịch nhiều nhất (POC): ' + pf((pb.lo + pb.hi) / 2) + ', chiếm ' + (pb.tot / p.total * 100).toFixed(1) + '% khối lượng.<\/p>';\n}\nfunction bookHTML(st){\n  if (!st.book) return '<h5>Sổ lệnh sát giá<\/h5><p class=\"empty\">' + (st.bookErr ? 'Không tải được sổ lệnh (' + st.bookErr + ').' : 'Đang tải sổ lệnh…') + '<\/p>';\n  const b = st.book, tot = b.bidUsd + b.askUsd, bp = tot ? b.bidUsd / tot * 100 : 50;\n  const verdict = bp >= 58 ? 'Lệnh chờ mua dày hơn, giá có lực đỡ ở gần.' : bp <= 42 ? 'Lệnh chờ bán dày hơn, giá gặp lực cản ở gần.' : 'Lệnh chờ mua và bán khá cân bằng.';\n  const wl = (a, cls) => a.length ? '<ul class=\"zl ' + cls + '\">' + a.map(w => '<li><b>' + pf(w.p) + '<\/b><span class=\"d\">' + usd(w.usd) + ' (' + pct(w.d) + ')<\/span><\/li>').join('') + '<\/ul>'\n    : '<ul class=\"zl\"><li><span class=\"none\">Chưa thấy tường lệnh lớn<\/span><\/li><\/ul>';\n  return '<h5>Sổ lệnh sát giá (trong ±' + (b.cov * 100).toFixed(2) + '%)<\/h5>' +\n    '<div class=\"bookbar\" aria-hidden=\"true\"><i class=\"s\" style=\"width:' + (100 - bp).toFixed(1) + '%\"><\/i><i class=\"b\" style=\"width:' + bp.toFixed(1) + '%\"><\/i><\/div>' +\n    '<div class=\"legend\"><span class=\"ls\">Bán <b>' + usd(b.askUsd) + '<\/b><\/span><span class=\"lb\">Mua <b>' + usd(b.bidUsd) + '<\/b><\/span><\/div>' +\n    '<p class=\"note\" style=\"margin:6px 0 10px\">' + verdict + ' Cập nhật lúc ' + clock(b.at) + '.<\/p>' +\n    '<h5>Tường lệnh mua<\/h5>' + wl(b.wallsB, 'dn') + '<h5>Tường lệnh bán<\/h5>' + wl(b.wallsA, 'up');\n}\n\n/* ----- Lịch tải dữ liệu ----- */\nfunction ordCoins(){ const g = cfg.grp; return COINS.filter(c => c.grp === g).concat(COINS.filter(c => c.grp !== g)); }\nasync function startLiquidity(){\n  const tk = ++liqToken;\n  for (const c of ordCoins()){\n    if (tk !== liqToken) return;\n    if (!state[c.s]) continue;\n    await ensureProfile(c.s, '24h', false, true);\n    if (!demo) await sleep(300);\n  }\n}\nasync function liqMaintenance(){\n  if (document.hidden) return;\n  const tk = liqToken;\n  for (const c of ordCoins()){\n    if (tk !== liqToken) return;\n    if (!state[c.s]) continue;\n    const p = state[c.s].prof['24h'];\n    if (!p || Date.now() - p.fetchedAt > 600000){ await ensureProfile(c.s, '24h', true, true); if (!demo) await sleep(300); }\n  }\n  if (filterCoin && state[filterCoin]){\n    const p = state[filterCoin].tfProf[cfg.tf];\n    if (!p || Date.now() - p.fetchedAt > 300000) ensureProfile(filterCoin, cfg.tf, true);\n  }\n}\nsetInterval(() => { if (filterCoin && !document.hidden) refreshBook(filterCoin); }, 10000);\nsetInterval(liqMaintenance, 60000);\n\n/* ----- Funding rate: một lượt gọi lấy funding của toàn bộ hợp đồng trên Binance Futures ----- */\nfunction pickFunding(st){\n  const fq = st.fq; if (!fq) return st.funding;\n  const m = qcur(st), v = (m === 'usdt' ? [fq.t] : m === 'usdc' ? [fq.c] : [fq.t, fq.c]).filter(Boolean);\n  if (!v.length) return null;\n  return {rate: v.reduce((a, x) => a + x.rate, 0) / v.length, at: Math.min.apply(null, v.map(x => x.at))};\n}\nasync function fetchFundingAll(){\n  if (demo) return;\n  try {\n    const rows = await getJSON('/fapi/v1/premiumIndex', FREST);\n    const now = Date.now();\n    rows.forEach(r => { const s = FUT_REV[r.symbol]; if (!s || !state[s]) return; const st = state[s]; st.fq = st.fq || {}; st.fq[r.symbol.endsWith('USDC') ? 'c' : 't'] = {rate: +r.lastFundingRate || 0, at: now}; st.funding = pickFunding(st); });\n  } catch(_){}\n}\nsetInterval(fetchFundingAll, 5*60000);\n\n/* ----- Open interest: quét từng coin, cách nhau 300ms, lưu lịch sử ngắn để tính biến động ----- */\nasync function pollOI(){\n  if (demo || document.hidden) return;\n  const tk = liqToken;\n  for (const c of ordCoins()){\n    if (tk !== liqToken) return;\n    const st = state[c.s]; if (!st || st.hasFut === false) continue;\n    try {\n      const qs = c.grp === 'tradfi' ? ['USDT'] : quotesFor(st, 'fut');\n      let v = 0, okAll = qs.length > 0;\n      for (const q of qs){ try { const j = await getJSON('/fapi/v1/openInterest?symbol=' + fsymQ(st, q), FREST); v += +j.openInterest || 0; } catch(_){ okAll = false; } }\n      if (okAll && v > 0 && st.price != null){ st.oiHist.push({t:Date.now(), v, p: st.price}); if (st.oiHist.length > 12) st.oiHist.shift(); }\n    } catch(_){}\n    await sleep(300);\n  }\n}\nsetInterval(pollOI, 5*60000);\n\n/* ----- Dữ liệu giả lập cho chế độ xem thử ----- */\nfunction fakeKlines(sym, spec){\n  const base = DEMO_BASE[sym], ms = INTERVAL_MS[spec.interval] || 900000, n = spec.limit, now = Date.now(), th = state[sym].th;\n  const volFrac = clamp(.005 * Math.sqrt(ms / 900000), .003, .05);\n  const bump = Math.floor(Math.random() * n), rows = [];\n  let p = base * (1 + (Math.random() - .5) * volFrac * 4);\n  for (let i = 0; i < n; i++){\n    const o = p, c = o * (1 + (Math.random() - .5) * volFrac * 2);\n    const h = Math.max(o, c) * (1 + Math.random() * volFrac * .5), l = Math.min(o, c) * (1 - Math.random() * volFrac * .5);\n    const q = th * (5 + Math.random() * 25) * (1 + 3 * Math.exp(-Math.pow((i - bump) / 5, 2)));\n    rows.push([now - (n - i) * ms, o, h, l, c, 0, 0, q, 0, 0, q * (.35 + Math.random() * .3), 0]);\n    p = c;\n  }\n  const f = base / rows[n-1][4];\n  rows.forEach(r => { r[1] *= f; r[2] *= f; r[3] *= f; r[4] *= f; });\n  return rows;\n}\nfunction fakeBook(sym){\n  const st = state[sym], mid = st.price != null ? st.price : DEMO_BASE[sym], tick = mid * .00001;\n  const wb = Math.floor(Math.random() * 900), wa = Math.floor(Math.random() * 900), bids = [], asks = [];\n  for (let i = 0; i < 1000; i++){\n    const ub = st.th * (.005 + Math.random() * .03) * (i === wb ? 30 : 1), ua = st.th * (.005 + Math.random() * .03) * (i === wa ? 30 : 1);\n    const pb = mid - (i + .5) * tick, pa = mid + (i + .5) * tick;\n    bids.push([pb, ub / pb]); asks.push([pa, ua / pa]);\n  }\n  return {bids, asks};\n}\n\n/* ===== Thanh lý futures (Binance USDⓈ-M, luồng forceOrder) ===== */\nconst FUT_BASE = 'wss://fstream.binance.com/market/stream?streams=';\nconst FUT_MULT = {SHIB:1000};                      // Binance futures niêm yết 1000SHIB\nconst FUT_REV = {};\nCOINS.forEach(c => { FUT_REV[(FUT_MULT[c.s] || '') + c.s + 'USDT'] = c.s; FUT_REV[(FUT_MULT[c.s] || '') + c.s + 'USDC'] = c.s; });\nfunction futStreams(){\n  const a = [];\n  COINS.forEach(c => {\n    if (c.grp === 'tradfi'){ const f = c.fsym.toLowerCase(); a.push(f + '@aggTrade', f + '@forceOrder'); }\n    else quotesFor(state[c.s], 'fut').forEach(q => { const f = fsymQ(state[c.s], q).toLowerCase(); a.push(f + '@forceOrder', f + '@aggTrade'); });\n  });\n  return a;\n}\nconst LWIN_LABEL = WIN_LABEL;\nconst LIQ_KEY = 'radar-liq-v1';\nconst liqFeed = [];\nconst pendingLiq = {};\nlet liqUid = 0, lastLiqSeen = 0, liqDirty = false, fws = null, futLive = false, futFails = 0, futRetry = null;\n\nfunction setFut(kind, text){ const el = $('futStatus'); el.className = 'status ' + kind; el.title = text; $('futStatusText').textContent = kind === 'live' ? 'Futures' : kind === 'retry' ? 'Futures mất kết nối' : 'Futures…'; }\n\n/* S = SELL nghĩa là lệnh bán cưỡng bức: một vị thế long bị thanh lý. S = BUY: một vị thế short bị thanh lý. */\nfunction onLiq(sym, side, v, p, t, qt){\n  const st = state[sym]; if (!st) return; qt = qt === 'c' ? 'c' : 't';\n  st.liqs.push({t, side, usd:v, price:p, q:qt});\n  if (st.liqs.length > 4000) st.liqs.shift();\n  liqFeed.unshift({id:++liqUid, t, s:sym, side, usd:v, price:p, q:qt});\n  if (liqFeed.length > 300) liqFeed.pop();\n  liqDirty = true;\n  if (cfg.sound !== 'off' && v >= st.th*(cfg.sound === 'huge' ? 3 : 1))\n    notify('liq', '💥 ' + sym + (side === 'long' ? ': long' : ': short') + ' bị thanh lý ' + usd(v));\n}\nfunction connectFut(){\n  if (demo) return;\n  clearTimeout(futRetry);\n  setFut('connecting', 'Futures: đang kết nối…');\n  let opened = false;\n  const streamsF = futStreams(); fwsSig = streamsF.join();\n  if (!streamsF.length){ setFut('connecting', 'Futures: đang tải danh sách'); return; }\n  try { fws = new WebSocket(FUT_BASE + streamsF.join('/')); }\n  catch(_){ return scheduleFut(); }\n  const mine = fws;\n  fws.onopen = () => { opened = true; futFails = 0; futLive = true; lastFut = Date.now(); setFut('live', 'Futures: trực tiếp'); };\n  fws.onmessage = ev => {\n    lastFut = Date.now();\n    let m; try { m = JSON.parse(ev.data); } catch(_){ return; }\n    const d = m.data; if (!d) return;\n    if (d.e === 'aggTrade'){ const k = TF_REV[d.s] || FUT_REV[d.s]; if (k){ const m = TF_REV[d.s] ? 1 : (FUT_MULT[k] || 1); onTrade(k, +d.p / m, +d.q * m, d.m, 'fut', d.s.endsWith('USDC') ? 'c' : 't'); } return; }\n    if (d.e !== 'forceOrder' || !d.o) return;\n    const o = d.o, sym = FUT_REV[o.s]; if (!sym) return;\n    const z = +o.z || +o.q, ap = +o.ap || +o.p;\n    if (!(z > 0 && ap > 0)) return;\n    onLiq(sym, o.S === 'SELL' ? 'long' : 'short', ap*z, ap / (FUT_MULT[sym] || 1), Date.now(), o.s.endsWith('USDC') ? 'c' : 't');\n  };\n  fws.onerror = () => { try { mine.close(); } catch(_){} };\n  fws.onclose = () => {\n    if (mine !== fws || demo) return;\n    futLive = false; if (!opened && !futPlanned) futFails++;\n    if (futPlanned){ futPlanned = false; setFut('connecting', 'Futures: đang cập nhật danh sách…'); }\n    else setFut('retry', 'Futures: mất kết nối, đang thử lại…');\n    scheduleFut();\n  };\n}\nfunction scheduleFut(){\n  clearTimeout(futRetry);\n  futRetry = setTimeout(connectFut, Math.min(30000, 1500 * Math.pow(2, Math.min(futFails, 5))));\n}\n\n/* Lưu 24 giờ gần nhất trong trình duyệt để mở lại trang không mất bản đồ */\nfunction saveLiq(){\n  if (demo) return;\n  try {\n    const o = {};\n    COINS.forEach(c => { const a = state[c.s].liqs; if (a.length) o[c.s] = a.map(e => [e.t, e.side === 'long' ? 0 : 1, Math.round(e.usd), e.price, e.q === 'c' ? 1 : 0]); });\n    for (const s in pendingLiq) if (!o[s] && pendingLiq[s].length) o[s] = pendingLiq[s];\n    localStorage.setItem(LIQ_KEY, JSON.stringify({v:1, saved:Date.now(), ev:o}));\n  } catch(_){}\n}\nfunction loadLiq(){\n  try {\n    const raw = localStorage.getItem(LIQ_KEY); if (!raw) return;\n    const j = JSON.parse(raw), cut = Date.now() - 86400000, all = [];\n    for (const s in j.ev){\n      const st = state[s];\n      if (!st){ pendingLiq[s] = j.ev[s].filter(r => r[0] >= cut); continue; }\n      st.liqs = j.ev[s].filter(r => r[0] >= cut).map(r => ({t:r[0], side:r[1] === 0 ? 'long' : 'short', usd:r[2], price:r[3], q: r[4] === 1 ? 'c' : 't'}));\n      st.liqs.forEach(e => all.push({t:e.t, s, side:e.side, usd:e.usd, price:e.price, q:e.q}));\n    }\n    all.sort((a,b) => b.t - a.t);\n    liqFeed.length = 0;\n    all.slice(0, 300).forEach(e => liqFeed.push({id:++liqUid, ...e}));\n    lastLiqSeen = liqUid;\n  } catch(_){}\n}\nsetInterval(() => { if (liqDirty){ liqDirty = false; saveLiq(); } }, 20000);\nwindow.addEventListener('pagehide', saveLiq);\ndocument.addEventListener('visibilitychange', () => { if (document.hidden) saveLiq(); });\n\n/* Lưu lệnh cá voi tới 30 ngày để các khung D/W/M có dữ liệu thật khi mở lại app, không phải chờ gom mới từ đầu */\nconst FEED_KEY = 'radar-feed-v2';\nfunction saveFeed(){\n  if (demo) return;\n  try {\n    const o = {};\n    COINS.forEach(c => { const a = state[c.s].ev; if (a.length) o[c.s] = a.map(e => [e.t, e.side === 'buy' ? 1 : 0, Math.round(e.usd), e.price, e.mk === 'fut' ? 1 : 0, e.q === 'c' ? 1 : 0]); });\n    localStorage.setItem(FEED_KEY, JSON.stringify({v:1, saved:Date.now(), ev:o}));\n  } catch(_){}\n}\nfunction loadFeed(){\n  try {\n    const raw = localStorage.getItem(FEED_KEY); if (!raw) return;\n    const j = JSON.parse(raw), cut = Date.now() - MAX_WIN*60000;\n    for (const s in j.ev){\n      const st = state[s]; if (!st) continue;\n      st.ev = j.ev[s].filter(r => r[0] >= cut).map(r => ({t:r[0], side: r[1] === 1 ? 'buy' : 'sell', usd:r[2], price:r[3], mk: r[4] === 1 ? 'fut' : 'spot', q: r[5] === 1 ? 'c' : 't'}));\n    }\n  } catch(_){}\n}\nsetInterval(() => { if (evDirty){ evDirty = false; saveFeed(); } }, 20000);\nwindow.addEventListener('pagehide', saveFeed);\ndocument.addEventListener('visibilitychange', () => { if (document.hidden) saveFeed(); });\n\n/* ----- Tổng hợp ----- */\nfunction liqAgg(st, cut){\n  let l = 0, s = 0, nl = 0, ns = 0;\n  for (let i = st.liqs.length - 1; i >= 0; i--){\n    const e = st.liqs[i]; if (e.t < cut) break;\n    if (!qOk(e, st)) continue;\n    if (e.side === 'long'){ l += e.usd; nl++; } else { s += e.usd; ns++; }\n  }\n  return {long:l, short:s, nl, ns, n:nl + ns};\n}\nfunction liqSpan(la){\n  if (!la || !la.n) return '';\n  return '<span>Thanh lý ' + LWIN_LABEL[cfg.lwin] + ': <b class=\"cl\">long ' + usd(la.long) + '<\/b> <b class=\"cs\">short ' + usd(la.short) + '<\/b><\/span>';\n}\nfunction liqReady(){ return futLive || demo; }\nfunction renderLiqSummary(gL, gS, gN){\n  const v = $('liqVerdict'), sub = $('liqSub'), tot = gL + gS, wl = LWIN_LABEL[cfg.lwin];\n  $('llgS').textContent = usd(gL); $('llgB').textContent = usd(gS);\n  $('lbalS').style.width = tot ? (gL/tot*100) + '%' : '0';\n  $('lbalB').style.width = tot ? (gS/tot*100) + '%' : '0';\n  if (!tot){\n    v.className = 'lv';\n    v.textContent = liqReady() ? 'Chưa có lệnh thanh lý nào trong ' + wl + ' qua' : 'Chưa nhận được dữ liệu thanh lý futures';\n    sub.textContent = liqReady() ? 'Bản đồ thanh lý sẽ hiện khi có người bị thanh lý.' : 'Đang thử kết nối tới Binance Futures. Phần còn lại của app vẫn chạy bình thường. Binance Futures bị chặn ở một số quốc gia.';\n    return;\n  }\n  const share = gL / tot;\n  if (share >= .65){ v.className = 'lv sell'; v.textContent = 'Phe long đang bị quét nhiều hơn'; }\n  else if (share <= .35){ v.className = 'lv buy'; v.textContent = 'Phe short đang bị quét nhiều hơn'; }\n  else { v.className = 'lv'; v.textContent = 'Thanh lý hai phía khá cân bằng'; }\n  let top = null;\n  COINS.forEach(c => { const la = state[c.s].la; if (c.grp === cfg.grp && la && la.n && (!top || la.long + la.short > top.v)) top = {s:c.s, v:la.long + la.short}; });\n  sub.textContent = 'Tổng ' + usd(tot) + ' qua ' + gN + ' lệnh trong ' + wl + ' qua' + (top ? ', nhiều nhất ở ' + top.s + ' (' + usd(top.v) + ').' : '.');\n}\nfunction renderLiqFeed(){\n  const fe = $('feed'), items = [];\n  for (const f of liqFeed){\n    const fs_ = state[f.s];\n    if (!fs_ || fs_.grp !== cfg.grp || f.usd < fs_.lmin || !qOk(f, fs_)) continue;\n    if (filterCoin && f.s !== filterCoin) continue;\n    items.push(f); if (items.length >= 40) break;\n  }\n  if (!items.length){\n    fe.innerHTML = '<li class=\"empty\">' + (liqReady() ? 'Chưa có lệnh thanh lý đủ lớn. Lệnh sẽ hiện ở đây khi có người bị thanh lý.' : 'Chưa kết nối được luồng thanh lý futures.') + '<\/li>';\n    return;\n  }\n  fe.innerHTML = items.map(f => {\n    const big = f.usd >= state[f.s].th ? ' 💥' : '';\n    return '<li class=\"f ' + (f.side === 'long' ? 'sell' : 'buy') + (f.id > lastLiqSeen ? ' new' : '') + '\">' +\n      '<span class=\"tag\">' + (f.side === 'long' ? 'Long' : 'Short') + '<\/span>' +\n      '<span class=\"fc\"><b>' + f.s + '<\/b><em>' + price(f.price) + '<\/em><\/span>' +\n      '<span class=\"fu\">' + usd(f.usd) + big + '<\/span>' +\n      '<time>' + clock(f.t) + '<\/time><\/li>';\n  }).join('');\n  lastLiqSeen = liqUid;\n}\nfunction syncSegs(){\n  document.querySelectorAll('[data-lw]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.lw) === cfg.lwin)));\n  document.querySelectorAll('[data-layer]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.layer === cfg.layer)));\n  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === cfg.tab)));\n}\ndocument.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {\n  cfg.tab = b.dataset.t; lastSeenId = uid; lastLiqSeen = liqUid; if (cfg.tab === 'news') onNewsOpen(); else updateNewsBadge(); render();\n}));\n\n/* ----- Bản đồ thanh lý của từng coin ----- */\nfunction liqBins(st){\n  const cut = Date.now() - cfg.lwin*60000, ev = st.liqs.filter(e => e.t >= cut && qOk(e, st));\n  if (!ev.length) return null;\n  const px = st.price != null ? st.price : ev[ev.length-1].price;\n  let lo = px, hi = px, long = 0, short = 0, big = ev[0];\n  for (const e of ev){\n    if (e.price < lo) lo = e.price; if (e.price > hi) hi = e.price;\n    if (e.side === 'long') long += e.usd; else short += e.usd;\n    if (e.usd > big.usd) big = e;\n  }\n  const pad = Math.max((hi - lo) * .05, px * .002); lo -= pad; hi += pad;\n  const n = 80, step = (hi - lo) / n, bins = [];\n  for (let i = 0; i < n; i++) bins.push({lo: lo + i*step, hi: lo + (i+1)*step, long:0, short:0});\n  for (const e of ev){ const j = Math.min(n-1, Math.max(0, Math.floor((e.price - lo) / step))); bins[j][e.side] += e.usd; }\n  return {ev, px, lo, hi, step, n, bins, long, short, big, count: ev.length};\n}\nfunction liqEmptyMsg(st){\n  if (demo) return 'Đang chờ lệnh thanh lý giả lập…';\n  if (!futLive) return 'Chưa kết nối được luồng thanh lý futures của Binance. Luồng này bị chặn ở một số quốc gia. Phần còn lại của app vẫn chạy bình thường.';\n  return 'Chưa ghi nhận lệnh thanh lý nào của ' + st.s + ' trong ' + LWIN_LABEL[cfg.lwin] + ' qua. Bản đồ sẽ hiện khi có lệnh thanh lý.';\n}\nfunction liqChartSVG(st, d){\n  if (!d) return '<p class=\"empty\">' + liqEmptyMsg(st) + '<\/p>';\n  const nr = NARROW(), W = nr ? 360 : 640, H = nr ? 290 : 320, R = nr ? 6 : 16, T = 10, B = 10, ch = H - T - B, bh = ch / d.n, fmt = axFmt(d.lo, d.hi), L = axLeft([fmt(d.hi), fmt(d.lo)], nr), cw = W - L - R, mid = L + cw / 2;\n  const y = v => T + (d.hi - Math.min(d.hi, Math.max(d.lo, v))) / (d.hi - d.lo) * ch;\n  let max = 0; d.bins.forEach(b => { max = Math.max(max, b.long, b.short); }); max = max || 1;\n  let s = '<svg class=\"' + (nr ? 'nr' : '') + '\" viewBox=\"0 0 ' + W + ' ' + H + '\" role=\"img\" aria-label=\"Bản đồ thanh lý ' + st.s + '\">';\n  for (let i = 0; i <= 4; i++){\n    const v = d.hi - (d.hi - d.lo) * i / 4, yy = y(v);\n    s += '<line class=\"grid-l\" x1=\"' + L + '\" x2=\"' + (W - 8) + '\" y1=\"' + yy.toFixed(1) + '\" y2=\"' + yy.toFixed(1) + '\"/>' +\n         '<text x=\"' + (L - 8) + '\" y=\"' + (yy + 4).toFixed(1) + '\" text-anchor=\"end\">' + fmt(v) + '<\/text>';\n  }\n  const p = st.prof['24h'];\n  if (p) for (const z of p.zones){\n    if (z.hi <= d.lo || z.lo >= d.hi) continue;\n    const y1 = y(z.hi), y2 = y(z.lo), cls = (d.px >= z.lo && d.px <= z.hi) ? 'zone-in' : (z.hi < d.px ? 'zone-sup' : 'zone-res');\n    s += '<rect class=\"' + cls + '\" x=\"' + L + '\" y=\"' + y1.toFixed(1) + '\" width=\"' + (W - 8 - L) + '\" height=\"' + Math.max(2, y2 - y1).toFixed(1) + '\"/>';\n  }\n  d.bins.forEach(b => {\n    const yy = y(b.hi), wl = b.long > 0 ? Math.max(2.5, b.long / max * (cw / 2)) : 0, ws = b.short > 0 ? Math.max(2.5, b.short / max * (cw / 2)) : 0, hh = Math.max(.8, bh - .35).toFixed(2);\n    if (wl > 0) s += '<rect class=\"bin-s\" x=\"' + (mid - wl).toFixed(1) + '\" y=\"' + (yy + .18).toFixed(2) + '\" width=\"' + wl.toFixed(1) + '\" height=\"' + hh + '\"/>';\n    if (ws > 0) s += '<rect class=\"bin-b\" x=\"' + mid.toFixed(1) + '\" y=\"' + (yy + .18).toFixed(2) + '\" width=\"' + ws.toFixed(1) + '\" height=\"' + hh + '\"/>';\n  });\n  s += '<line class=\"grid-l\" x1=\"' + mid + '\" x2=\"' + mid + '\" y1=\"' + T + '\" y2=\"' + (T + ch) + '\"/>' +\n       '<text x=\"' + (mid - 6) + '\" y=\"' + (T + 12) + '\" text-anchor=\"end\" style=\"fill:var(--sell);font-weight:700\">Long bị thanh lý<\/text>' +\n       '<text x=\"' + (mid + 6) + '\" y=\"' + (T + 12) + '\" style=\"fill:var(--buy);font-weight:700\">Short bị thanh lý<\/text>';\n  const gy = y(d.px);\n  s += '<line class=\"px-l\" x1=\"' + L + '\" x2=\"' + (W - 4) + '\" y1=\"' + gy.toFixed(1) + '\" y2=\"' + gy.toFixed(1) + '\"/>' + pricePill(L + 4, gy, 'Giá ' + fmt(d.px)) + '<\/svg>';\n  return s;\n}\nfunction liqSideHTML(st, d){\n  if (!d) return '';\n  const tot = d.long + d.short, share = tot ? d.long / tot : .5, wl = LWIN_LABEL[cfg.lwin];\n  let nl = 0, ns = 0; d.ev.forEach(e => { if (e.side === 'long') nl++; else ns++; });\n  const verdict = share >= .65 ? 'Phe long bị thanh lý nhiều hơn, thường xảy ra khi giá giảm nhanh.'\n    : share <= .35 ? 'Phe short bị thanh lý nhiều hơn, thường xảy ra khi giá tăng nhanh (short squeeze).'\n    : 'Thanh lý hai phía khá cân bằng.';\n  const order = d.bins.map((b,i) => ({i, t:b.long + b.short})).filter(x => x.t > 0).sort((a,b) => b.t - a.t);\n  const picked = [];\n  for (const x of order){ if (picked.length >= 4) break; if (picked.every(q => Math.abs(q.i - x.i) >= 2)) picked.push(x); }\n  const items = picked.map(x => {\n    const b = d.bins[x.i], mid = (b.lo + b.hi) / 2, dom = b.long >= b.short ? 'l' : 's';\n    return '<li><div><b>' + pf(b.lo) + ' – ' + pf(b.hi) + '<\/b><small>Long ' + usd(b.long) + ', short ' + usd(b.short) + '<\/small><\/div>' +\n      '<span class=\"d c-' + dom + '\">' + pct(mid / d.px - 1) + '<\/span><\/li>';\n  }).join('');\n  const big = d.big;\n  return '<h5>Tổng thanh lý trong ' + wl + ' qua<\/h5>' +\n    '<div class=\"bookbar\" aria-hidden=\"true\"><i class=\"s\" style=\"width:' + (share * 100).toFixed(1) + '%\"><\/i><i class=\"b\" style=\"width:' + ((1 - share) * 100).toFixed(1) + '%\"><\/i><\/div>' +\n    '<div class=\"legend\"><span class=\"ls\">Long <b>' + usd(d.long) + '<\/b> (' + nl + ' lệnh)<\/span><span class=\"lb\">Short <b>' + usd(d.short) + '<\/b> (' + ns + ' lệnh)<\/span><\/div>' +\n    '<p class=\"note\" style=\"margin:6px 0 14px\">' + verdict + '<\/p>' +\n    '<h5>Cụm thanh lý lớn nhất<\/h5><ul class=\"zl\">' + items + '<\/ul>' +\n    '<h5>Lệnh thanh lý lớn nhất<\/h5><ul class=\"zl\"><li><di  = c.s; FUT_REV[k + 'USDC'] = c.s; }\n  restoreLiq(c.s);\n}\nfunction reconnectFut(){\n  if (demo) return;\n  if (fws && fws.readyState === 1){ futPlanned = true; try { fws.close(); } catch(_){} }\n  else { clearTimeout(futRetry); connectFut(); }\n}\nfunction reconnectFutIfChanged(){ if (!demo && futStreams().join() !== fwsSig) reconnectFut(); }\nfunction reconnectSpotIfChanged(){\n  if (demo) return;\n  const s = []; COINS.filter(c => c.grp !== 'tradfi').forEach(c => quotesFor(state[c.s], 'spot').forEach(q => s.push(c.s.toLowerCase() + q.toLowerCase() + '@aggTrade')));\n  if (s.join() !== wsSig) reconnectSpot();\n}\n/* Tự tìm 20 hợp đồng TradFi có khối lượng 24 giờ lớn nhất trên Binance Futures */\nlet tfFails = 0;\nasync function loadTradFi(){\n  if (demo || tfLoaded || tfStatus === 'loading') return;\n  tfStatus = 'loading'; clearTimeout(tfTimer);\n  try {\n    /* exchangeInfo rất nặng nên cho timeout dài; ticker/24hr chạy song song và không làm hỏng nhau */\n    const [inf, tk] = await Promise.allSettled([getJSON('/fapi/v1/exchangeInfo', FREST, 30000), getJSON('/fapi/v1/ticker/24hr', FREST, 20000)]);\n    if (demo){ tfStatus = 'idle'; return; }\n    if (tk.status !== 'fulfilled' || !Array.isArray(tk.value)) throw (inf.status === 'rejected' ? inf.reason : tk.reason) || new Error('không tải được ticker');\n    const vol = {}; tk.value.forEach(t => { vol[t.symbol] = +t.quoteVolume || 0; });\n    let list = [];\n    if (inf.status === 'fulfilled' && inf.value && Array.isArray(inf.value.symbols)){\n      list = inf.value.symbols\n        .filter(x => x.contractType === 'TRADIFI_PERPETUAL' && (x.status || x.contractStatus) === 'TRADING' && x.quoteAsset === 'USDT')\n        .map(x => ({fsym:x.symbol, base:x.baseAsset, v:vol[x.symbol] || 0}));\n    }\n    /* Dự phòng: exchangeInfo lỗi thì lấy từ ticker theo danh sách mã TradFi đã biết */\n    if (!list.length){\n      list = Object.keys(vol).filter(sy => sy.endsWith('USDT') && TF_NAMES[sy.slice(0, -4)] && vol[sy] > 0)\n        .map(sy => ({fsym:sy, base:sy.slice(0, -4), v:vol[sy]}));\n    }\n    list = list.sort((a,b) => b.v - a.v).slice(0, 20);\n    if (!list.length) throw new Error('không thấy hợp đồng TradFi');\n    list.forEach(x => {\n      if (COINS.some(c => c.fsym === x.fsym)) return;\n      const key = state[x.base] ? x.base + '.TF' : x.base;\n      addCoin({s:key, n:TF_NAMES[x.base] || 'Hợp đồng TradFi', th:tfThreshold(x.v), grp:'tradfi', fsym:x.fsym});\n    });\n    tfLoaded = true; tfStatus = 'ok'; tfFails = 0;\n    updateHint(); reconnectFut(); startLiquidity(); render();\n  } catch(e){\n    tfStatus = 'err'; tfErr = (e && e.name === 'AbortError') ? 'hết thời gian chờ' : ((e && e.message) ? e.message : 'lỗi mạng');\n    tfFails++; updateHint();\n    tfTimer = setTimeout(() => { tfStatus = 'idle'; loadTradFi(); }, Math.min(60000, 8000 * tfFails));\n  }\n}\n/* Danh sách giả lập cho chế độ xem thử */\nconst DEMO_TF = [['XAU','Vàng',3350],['XAG','Bạc',39],['CL','Dầu WTI',64],['SNDK','SanDisk',180],['MU','Micron',130],['NVDA','Nvidia',175],['TSLA','Tesla',330],\n  ['SOXL','ETF bán dẫn 3x',45],['KORU','ETF Hàn Quốc 3x',60],['SKHYNIX','SK hynix',1250],['SPCX','SpaceX (pre-IPO)',120],['AAPL','Apple',230],['MSFT','Microsoft',510],\n  ['AMZN','Amazon',225],['GOOGL','Alphabet',235],['COIN','Coinbase',310],['MSTR','Strategy',330],['HOOD','Robinhood',105],['PLTR','Palantir',160],['QQQ','ETF Nasdaq 100',590]];\nfunction addDemoTradFi(){\n  DEMO_TF.forEach((x,i) => { addCoin({s:x[0], n:x[1], th:i < 3 ? 150000 : 60000, grp:'tradfi', fsym:x[0] + 'USDT', demo:true}); DEMO_BASE[x[0]] = x[2]; });\n}\nlet glStatus = 'idle', glErr = '', glTimer = null, glLoaded = false, futSymMap = null;\n\n/* Loại trừ stablecoin, coin gắn với tiền pháp định, và bản thân BTC/ETH (không tính là \"altcoin\") */\nconst STABLE_BASE = new Set(['USDC','FDUSD','TUSD','DAI','USDP','PYUSD','USDE','BUSD','UST','USTC','WBTC','WBETH','BTC','ETH',\n  'EUR','GBP','TRY','BRL','ARS','ZAR','RUB','UAH','NGN','JPY','AUD','CO e[base].grp !== 'lose') || STABLE_BASE.has(base) || /(UP|DOWN|BULL|BEAR)$/.test(base)) return false;\n      return (+t.quoteVolume || 0) >= MIN_VOL_USD;\n    }).map(t => ({base: t.symbol.slice(0, -4), chg: t.priceChangePercent != null ? (+t.priceChangePercent || 0) : (+t.openPrice > 0 ? (+t.lastPrice - +t.openPrice) / +t.openPrice * 100 : 0), vol: +t.quoteVolume || 0}));\n    if (cands.length < 5) throw new Error('không đủ dữ liệu altcoin');\n    cands.sort((a,b) => b.chg - a.chg);\n    const gainers = cands.slice(0, 20);\n    const losers = cands.slice(-20).sort((a,b) => a.chg - b.chg);\n    const changed = applyRanking(gainers, losers, futMap);\n    try { const fm = {}; gainers.concat(losers).forEach(x => { if (futMap[x.base]) fm[x.base] = futMap[x.base]; }); localStorage.setItem('rcv_alt_rank', JSON.stringify({t: Date.now(), gainers, losers, fm})); } catch(_){}\n    glLoaded = true; glStatus = 'ok';\n    updateHint();\n    if (changed){ reconnectSpotIfChanged(); reconnectFutIfChanged(); startLiquidity(); }\n    render();\n  } catch(e){\n    glStatus = 'err'; glErr = (e && e.message) ? e.message : 'lỗi mạng';\n    glTimer = setTimeout(() => { glStatus = 'idle'; loadGainersLosers(); }, 60000);\n  }\n}\n/* Xếp hạng lại định kỳ mỗi 3 phút để danh sách luôn theo sát %change 24h mới nhất */\nsetInterval(() => { if (!demo && !document.hidden) loadGainersLosers(true); }, 180000);\n\n/* Danh sách giả lập cho chế độ xem thử, dùng khi chưa tải xong dữ liệu thật */\nconst DEMO_ALT = [\n  ['PEPE','Pepe',0.0000095],['WIF','dogwifhat',1.8],['BONK','Bonk',0.000021],['FLOKI','Floki',0.00016],['JUP','Jupiter',0.75],\n  ['ONDO','Ondo',1.1],['RENDER','Render',5.2],['FET','Fetch.ai',1.05],['INJ','Injective',18],['TIA','Celestia',4.8],\n  ['ARB','Arbitrum',0.62],['OP','Optimism',1.4],['APT','Aptos',7.1],['SEI','Sei',0.35],['STX','Stacks',1.6],\n  ['RUNE','THORChain',3.2],['IMX','Immutable',1.2],['GALA','Gala',0.028],['SAND','The Sandbox',0.34],['MANA','Decentraland',0.32]\n];\nfunctio 1, Math.round((last.t-first.t)/60000)) + ' phút, giá ' + pct(pxChg) + '. ' + note;\n  }\n  // 11-12. onchain\n  const a = st.ark;\n  if (a && !a.unsupported && now - a.at < 3*3600000){\n    const ex = a.cexIn + a.cexOut, fd = a.fundIn + a.fundOut;\n    if (ex > 0){\n      F.exch = clamp((a.cexOut - a.cexIn) / ex * Math.min(1, ex / (st.th * 30)), -1, 1);\n      N.exch = 'Ví sàn 24 giờ: vào ' + usd(a.cexIn) + ', ra ' + usd(a.cexOut) + '. Rút ra nhiều nghiêng Long.';\n    }\n    if (fd > 0){\n      F.fund = clamp((a.fundIn - a.fundOut) / fd * Math.min(1, fd / (st.th * 10)), -1, 1);\n      N.fund = 'Quỹ/market maker 24 giờ: nhận ' + usd(a.fundIn) + ', chuyển đi ' + usd(a.fundOut) + '.';\n    }\n  }\n  // tổng hợp (v5): trọng số thích ứng theo trạng thái thị trường, xác nhận khối lượng, xu hướng khung lớn và đồng thuận có trọng số\n  const er = p.er != null ? p.er : .25, trending = er >= .32, ranging = er <= .16;\n  const gm = g => g === 'trend' ? (trending ? 1.25 : ranging ? .7 : 1) : (g === 'momentum' || g === 'struct') ? (ranging ? 1.2 : trending ? .9 : 1) : 1;\n  let sw = 0, ss = 0, al = 0, as = 0;\n  const WK = {};\n  Object.keys(F).forEach(k => {\n    const w = SW[k] * gm(FACTOR_GROUP(k)); WK[k] = w; sw += w; ss += w * F[k];\n    if (F[k] >= .2) al++; else if (F[k] <= -.2) as++;\n  });\n  let S = sw ? ss / sw : 0;\n  const volR = p.flow && p.flow.t32 && p.flow.t32.q > 0 ? (p.flow.t8.q / 8) / (p.flow.t32.q / 32) : 1;\n  S *= volR < .55 ? .85 : volR > 1.6 ? 1.08 : 1;\n  const HTF = {M5:'M15', M15:'H1', M30:'H1', H1:'H4', H2:'H4', H4:'D', H6:'D', H8:'D', H12:'D', D:'W', '3D':'W'}, hp = st.tfProf[HTF[tf]];\n  let htf = 0;\n  if (hp && hp.supertrend && hp.ema20 != null && hp.ema50 != null) htf = (hp.supertrend.trend + (hp.ema20 >= hp.ema50 ? 1 : -1)) / 2;\n  if (htf && S) S *= ((S > 0) === (htf > 0)) ? 1.08 : .8;\n  S = clamp(S, -1, 1);\n  let dir = null, agreeW = 0, reason = 'Điểm chưa đủ mạnh (cần từ ±0,24, ít nhất 2 yếu tố cùng chiều và đồng thuận có trọng số từ 50%).';\n  if (S >= .24 && al >= 2) dir = 'long'; else if (S <= -.24 && as >= 2) dir = 'short';\n  if (dir){\n    const sg = dir === 'long' ? 1 : -1;\n    let opp = 0;\n    Object.keys(F).forEach(k => { if (F[k]*sg >= .15) agreeW += WK[k]; if (F[k]*sg <= -.5) opp += WK[k]; });\n    agreeW = sw ? agreeW / sw : 0; opp = sw ? opp / sw : 0;\n    if (opp >= .18){ dir = null; reason = 'Nhóm yếu tố ngược chiều rất mạnh chiếm ' + Math.round(opp*100) + '% trọng số.'; }\n    else if (agreeW < .5){ dir = null; reason = 'Mức đồng thuận có trọng số mới đạt ' + Math.round(agreeW*100) + '%, chưa đủ 50%.'; }\n    else if (p.rsi != null && ((dir === 'long' && p.rsi >= 80) || (dir === 'short' && p.rsi <= 20))){ dir = null; reason = 'RSI đang ở vùng cực đoan (' + p.rsi.toFixed(0) + '), dễ đảo chiều, nên chờ giá hồi về.'; }\n  }\n  if (dir){\n    const sg = dir === 'long' ? 1 : -1;\n    const groupsHit = new Set(Object.keys(F).filter(k => F[k]*sg >= .2).map(FACTOR_GROUP));\n    if (groupsHit.size < 2){ dir = null; reason = 'Các yếu tố đồng thuận chỉ đến từ một nhóm chỉ báo, chưa đủ đa dạng để tin cậy.'; }\n  }\n  const aS = Math.abs(S), agree = dir === 'long' ? al : as, htfOk = !htf || ((S > 0) === (htf > 0));\n  const conf = aS >= .5 && agree >= 4 && agreeW >= .65 && htfOk ? 'Cao' : aS >= .35 && agreeW >= .5 ? 'Vừa' : 'Thấp';\n  let plan = null;\n  if (dir && spot && dir === 'short'){\n    reason = 'Spot không bán khống: điểm đang nghiêng Bán, nên tránh mua mới và cân nhắc chốt bớt nếu đang giữ coin.';\n  } else if (dir){\n    plan = buildPlan(dir, p, px, atr);\n    if (!plan.ok){ reason = plan.why; dir = null; }\n  }\n  return {F, N, S, dir, plan, conf, reason, atr, px, agree, sw, spot, agreeW, htf, volR, regime: trending ? 'trend' : ranging ? 'range' : 'mixed'};\n}\n\nfunction buildPlan(dir, p, px, A){\n  const L = dir === 'long', sg = L ? 1 : -1;\n  const supp = [], resi = [];\n  p.zones.forEach(z => { if (z.hi < px) supp.push({p:z.hi, edge:z.lo}); else if (z.lo > px) resi.push({p:z.lo, edge:z.hi}); });\n  p.sl.forEach(x => { if (x.p < px) supp.push({p:x.p, edge:x.p}); });\n  p.sh.forEach(x => { if (x.p > px) resi.push({p:x.p, edge:x.p}); });\n  if (p.ichimoku){\n    const ic = p.ichimoku;\n    if (ic.cloudBot > px) resi.push({p:ic.cloudBot, edge:ic.cloudTop});\n    if (ic.cloudTop < px) supp.push({p:ic.cloudTop, edge:ic.cloudBot});\n  }\n  if (p.smc && p.smc.fvg){\n    const f = p.smc.fvg;\n    if (f.lo > px) resi.push({p:f.lo, edge:f.hi}); else if (f.hi < px) supp.push({p:f.hi, edge:f.lo});\n  }\n  supp.sort((a,b) => b.p - a.p); resi.sort((a,b) => a.p - b.p);\n  const near = L ? supp : resi, far = L ? resi : supp;\n  let entry = px, mode = 'Vào theo giá thị trường';\n  if (near[0]){\n    const d = Math.abs(px - near[0].p);\n    if (d > .3*A && d <= 1.5*A){ entry = near[0].p; mode = 'Đặt lệnh chờ tại ' + (L ? 'vùng hỗ trợ' : 'vùng kháng cự'); }\n  }\n  const prot = near.find(x => L ? x.p <= entry + 1e-12 : x.p >= entry - 1e-12);\n  const rawDist = prot ? Math.abs(entry - prot.edge) + .3*A : 1.3*A;\n  const risk = clamp(rawDist, .8*A, 3*A);\n  const warn = rawDist > 3*A ? 'SL xa hơn mức thông thường, nên giảm khối lượng.' : '';\n  const sl = entry - sg*risk;\n  const tps = [];\n  for (const x of far){\n    if (tps.length >= 3) break;\n    const t = x.p - sg*.1*A, d = sg*(t - entry), prev = tps.length ? sg*(tps[tps.length-1] - entry) : 0;\n    if (d >= (tps.length ? prev + .5*risk : 1.0*risk) && d <= 5*risk) tps.push(t);\n  }\n  const fill = [1.2, 2, 3.2];\n  while (tps.length < 3){\n    const prev = tps.length ? sg*(tps[tps.length-1] - entry) : 0;\n    tps.push(entry + sg*Math.max(fill[tps.length]*risk, prev + .6*risk));\n  }\n  const rr = tps.map(t => sg*(t - entry) / risk);\n  const riskFrac = risk / entry;\n  const lv = [entry, sl].concat(tps);\n  let ok = true, why = '';\n  if (riskFrac > .12){ ok = false; why = 'Khoảng cách SL quá lớn (' + (riskFrac*100).toFixed(1) + '%), bỏ qua.'; }\n  else if (rr[1] < 1.5){ ok = false; why = 'Tỉ lệ lời/lỗ chưa đạt (TP2 dưới 1,5R).'; }\n  return {ok, why, dir, entry, mode, sl, risk, riskFrac, tps, rr, warn, pending: mode !== 'Vào theo giá thị trường', min: Math.min.apply(null, lv), max: Math.max.apply(null, lv)};\n}\n\n/* Mỗi khung (M5, M15, M30, H1, H4, D, W) tự cho một tín hiệu cuối cùng từ điểm tổng hợp nhiều yếu tố:\n   chỉ báo, vùng thanh khoản, khối lượng, thanh lý, dòng tiền cá voi, sổ lệnh. Không cần đồng thuận giữa các khung. */\nconst tfMs = tf => INTERVAL_MS[TF_SPEC[tf].interval];\nlet evTick = 0;\nlet evLastAt = 0, evLastKey = '';\nfunction evalSignals(){\n  const now = Date.now(), warm = now - APP_START >= (demo ? 20000 : 300000);\n  trackSignals(now);\n  /* Tính điểm 13 khung cho mọi coin rất nặng: chỉ tính lại mỗi 2,5 giây hoặc ngay khi đổi khung/nhóm/coin */\n  const ek = cfg.tf + '|' + cfg.grp + '|' + filterCoin + '|' + cfg.mkt;\n  if (ek === evLastKey && now - evLastAt < 2500) return;\n  evLastKey = ek; evLastAt = now;\n  const cur = COINS.filter(c => c.grp === cfg.grp || c.s === filterCoin), scanAll = (evTick++ % 3 === 0);\n  TF_ORDER.forEach(tf => cur.forEach(c => ensureProfile(c.s, tf, false, c.s === filterCoin && tf === cfg.tf)));\n  (scanAll ? COINS.slice() : cur).forEach(c => {\n    const st = state[c.s]; if (!st) return; st.cand = st.cand || {}; st.lc = st.lc || {};\n    if (st.fq) st.funding = pickFunding(st);\n    st.sf = sigFactors(st, cfg.tf);\n    if (!warm) return;\n    TF_ORDER.forEach(tf => {\n      const f = tf === cfg.tf ? st.sf : sigFactors(st, tf);\n      const ok = f && f.dir && f.plan && f.plan.ok && f.conf !== 'Thấp', cand = ok ? f.dir : null, cs = st.cand[tf] || (st.cand[tf] = {dir:null, since:0});\n      if (cand !== cs.dir){ cs.dir = cand; cs.since = now; }\n      if (!cand || now - cs.since < (demo ? 20000 : 3*60000)) return;\n      if (sigLog.some(x => x.s === c.s && sigMk(x) && (x.tf || 'H1') === tf && x.status !== 'closed')) return;\n      if (now - (st.lc[tf] || 0) < (demo ? 90000 : Math.min(2*3600000, Math.max(15*60000, tfMs(tf))))) return;\n      issueSignal(st, tf, f);\n    });\n  });\n}\nfunction issueSignal(st, tf, f){\n  const pl = f.plan, now = Date.now();\n  sigLog.push({id:++sigUid, s:st.s, dir:f.dir, entry:pl.entry, sl:pl.sl, tps:pl.tps.slice(), rr:pl.rr.slice(), risk:pl.risk, riskFrac:pl.riskFrac,\n    t:now, tOpen: pl.pending ? null : now, status: pl.pending ? 'pending' : 'open', hit:0, result:null, r:null, score:f.S, conf:f.conf, tf, mkt: useFut(st) ? 'fut' : 'spot', qm: qcur(st), demo,\n    marketEntry: !pl.pending, riskPct: cfg.risk, follow: null});\n  if (sigLog.length > 200) sigLog.shift();\n  sigDirty = true;\n  const txt = (useFut(st) ? (f.dir === 'long' ? '📈 LONG ' : '📉 SHORT ') : '🟢 MUA SPOT ') + st.s + ' khung ' + tf + ' (điểm ' + sgn2(f.S) + ', tin cậy ' + f.conf + '): vào ' + pf(pl.entry) + ', SL ' + pf(pl.sl) + ', TP1 ' + pf(pl.tps[0]);\n  if (cfg.sound !== 'off') notify(f.dir === 'long' ? 'buy' : 'sell', txt); else showToast(txt);\n}\nfunction closeSig(g, res, r, now){\n  g.status = 'closed'; g.result = res; g.r = r; g.tClose = now; sigDirty = true;\n  const st = state[g.s]; if (st){ st.lc = st.lc || {}; st.lc[g.tf || 'H1'] = now; }\n}\n\n/* ===== Lời/lỗ ước tính bằng USDT, theo phí và trượt giá kiểu Binance ===== */\nconst ACC_EQUITY = 13000; /* vốn giả định, USDT */\n/* Phí giao dịch Binance, hạng thường (chưa chiết khấu BNB/VIP) */\nconst FEES = { spot:{maker:0.001, taker:0.001}, fut:{maker:0.0002, taker:0.0005} };\n/* Trượt giá ước tính cho lệnh thị trường (vào theo giá thị trường, hoặc chạm SL/hết hạn phải thoát gấp);\n   lệnh chờ (limit) tại vùng hỗ trợ/kháng cự và các mức TP coi như khớp đúng giá, không trượt. Đây là số\n   ước tính hợp lý cho top 20 coin thanh khoản cao, không phải số Binance công bố chính thức. */\nconst SLIP = { entry:0.0003, exit:0.0005 };\nfunction tradeUsd(g){\n  const riskPct = (g.riskPct != null ? g.riskPct : cfg.risk) / 100;\n  let riskUsd = ACC_EQUITY * riskPct;\n  if (!(g.risk > 0)) return 0;\n  let notional = (riskUsd / g.risk) * g.entry; /* giá trị vị thế, dựa trên cỡ lệnh theo % rủi ro */\n  const mkt = g.mkt === 'fut' ? 'fut' : 'spot', f = FEES[mkt];\n  if (mkt === 'spot' && notional > ACC_EQUITY){ riskUsd *= ACC_EQUITY / notional; notional = ACC_EQUITY; } /* Spot không đòn bẩy: tối đa 100% vốn */\n  const entryFeeRate = g.marketEntry ? f.taker : f.maker;\n  const entrySlip = g.marketEntry ? SLIP.entry : 0;\n  const exitMarket = g.result === 'SL' || g.result === 'expired' || g.result === 'trail' || g.result === 'manual';\n  const exitFeeRate = exitMarket ? f.taker : f.maker; /* TP coi như lệnh chờ (maker), SL/hết hạn là thoát gấp (taker) */\n  const exitSlip = exitMarket ? SLIP.exit : 0;\n  const grossUsd = g.r * riskUsd; /* lời/lỗ trước phí, theo R đã ghi nhận */\n  const costUsd = notional * (entryFeeRate + exitFeeRate + entrySlip + exitSlip);\n  return grossUsd - costUsd;\n}\n/* Sau khi chạm TP1/TP2/TP3, dời SL lên (long) hoặc xuống (short) một mức có lời để không còn\n   khả năng bị lỗ ngược, rồi để người theo dõi tự quyết định đóng lệnh hay gồng tiếp các TP sau. */\nfunction trailStop(g){\n  const L = g.dir === 'long', sg = L ? 1 : -1;\n  if (g.hit >= 1 && !g.trail1){ g.sl = g.entry + sg*0.2*g.risk; g.trail1 = true; sigDirty = true; }\n  if (g.hit >= 2 && !g.trail2){ g.sl = g.tps[0]; g.trail2 = true; sigDirty = true; }\n  if (g.hit >= 3 && !g.trail3){ g.sl = g.tps[1]; g.trail3 = true; sigDirty = true; }\n}\nfunction trackSignals(now){\n  for (const g of sigLog){\n    if (g.status === 'closed') continue;\n    const st = state[g.s]; if (!st || st.price == null) continue;\n    const px = st.price, L = g.dir === 'long', sg = L ? 1 : -1;\n    if (g.status === 'pending'){\n      if ((L && px <= g.entry) || (!L && px >= g.entry)){ g.status = 'open'; g.tOpen = now; sigDirty = true; }\n      else if ((L && (px <= g.sl || px >= g.tps[0])) || (!L && (px >= g.sl || px <= g.tps[0])) || now - g.t > Math.min(86400000, Math.max(3600000, 4*tfMs(g.tf || 'H1')))) closeSig(g, 'cancel', 0, now);\n      continue;\n    }\n    if ((L && px <= g.sl) || (!L && px >= g.sl)){\n      const r = sg*(g.sl - g.entry)/g.risk;\n      closeSig(g, g.trail1 ? 'trail' : 'SL', r, now);\n      continue;\n    }\n    const before = g.hit;\n    while (g.hit < 3 && ((L && px >= g.tps[g.hit]) || (!L && px <= g.tps[g.hit]))){ g.hit++; sigDirty = true; }\n    if (g.hit !== before) trailStop(g);\n    /* Không còn giới hạn thời gian mở lệnh: chỉ đóng khi chạm SL (gốc hoặc đã dời), hoặc khi\n       người theo dõi tự bấm đóng lệnh (xem closeManual). */\n  }\n}\nfunction closeManual(id){\n  const g = sigLog.find(x => x.id === id); if (!g || g.status !== 'open') return;\n  const st = state[g.s]; if (!st || st.price == null) return;\n  const L = g.dir === 'long', sg = L ? 1 : -1;\n  closeSig(g, 'manual', sg*(st.price - g.entry)/g.risk, Date.now());\n  render();\n}\nfunction sigStatusText(g){\n  if (g.status === 'pending') return {t:'Chờ vào lệnh', c:''};\n  if (g.status === 'open') return {t: (g.hit ? 'Đang mở, đã chạm TP' + g.hit : 'Đang mở') + (g.trail1 ? ' · SL đã dời lên vùng lời' : ''), c: g.hit ? 'win' : ''};\n  if (g.result === 'SL') return {t:'Chạm SL (' + sgn2(g.r) + 'R)', c:'loss'};\n  if (g.result === 'trail') return {t:'Dừng lệnh đã dời lên vùng lời (' + sgn2(g.r) + 'R)', c: g.r >= 0 ? 'win' : 'loss'};\n  if (g.result === 'manual') return {t:'Tự đóng lệnh (' + sgn2(g.r) + 'R)', c: g.r >= 0 ? 'win' : 'loss'};\n  if (g.result === 'cancel') return {t:'Hủy, lệnh chờ không khớp', c:''};\n  if (g.result === 'expired') return {t:'Hết hạn (' + sgn2(g.r) + 'R)', c: g.r > 0 ? 'win' : 'loss'};\n  return {t:'Chốt ' + g.result + ' (' + sgn2(g.r) + 'R)', c:'win'};\n}\nfunction flowScore(st){\n  const f = st.sf; if (!f) return null;\n  const ks = ['whale','taker','cvd','book'].filter(k => f.F[k] != null); if (!ks.length) return null;\n  let w = 0, sc = 0; ks.forEach(k => { w += SW[k]; sc += SW[k] * f.F[k]; });\n  return sc / w;\n}\nfunction flowChip(st){\n  if (useFut(st)) return '';\n  const v = flowScore(st); if (v == null) return '';\n  if (v >= .15) return '<span class=\"sgchip long soft\">Tiền vào ' + sgn2(v) + '<\/span>';\n  if (v <= -.15) return '<span class=\"sgchip short soft\">Tiền ra ' + sgn2(v) + '<\/span>';\n  return '<span class=\"sgchip soft\">Dòng tiền cân bằng<\/span>';\n}\nfunction sigChip(st){\n  const f = st.sf; if (!f) return '';\n  const act = sigLog.find(x => x.s === st.s && sigMk(x) && (x.tf || 'H1') === cfg.tf && x.status !== 'closed');\n  if (act) return '<span class=\"sgchip ' + act.dir + '\">' + dirLbl(act.dir, !useFut(st)) + (act.status === 'pending' ? ' chờ vào' : ' đang mở') + '<\/span>';\n  if (f.dir) return '<span class=\"sgchip ' + f.dir + ' soft\">Nghiêng ' + dirLbl(f.dir, !useFut(st)) + '<\/span>';\n  return '';\n}\nfunction renderSigFeed(){\n  const fe = $('feed');\n  const isMkSig = x => (x.mkt || 'spot') === (cfg.grp === 'tradfi' || cfg.mkt === 'fut' ? 'fut' : 'spot'); /* Sổ tín hiệu chỉ liệt kê tín hiệu của thị trường đang chọn */\n  const closedAll = sigLog.filter(x => x.status === 'closed' && x.result !== 'cancel' && isMkSig(x));\n  const closed = closedAll.filter(x => x.follow === true);\n  const wins = closed.filter(x => x.r > 0).length, sumR = closed.reduce((s, x) => s + x.r, 0);\n  const sumUsd = closed.reduce((s, x) => s + tradeUsd(x), 0);\n  const undecided = closedAll.filter(x => x.follow == null).length;\n  const head = '<li class=\"sgsum\">' + (closedAll.length\n    ? 'Sổ tín hiệu, vốn giả định ' + usd(ACC_EQUITY) + ': trong ' + closedAll.length + ' lệnh đã đóng (lệnh chờ bị hủy do không khớp không tính), bạn đã chọn <b>theo<\/b> ' + closed.length + ' lệnh — thắng ' + wins + ', thua ' + (closed.length - wins) + ', tổng ' + sgn2(sumR) + 'R · lời/lỗ ước tính ' + usd(sumUsd, true) + ' (đã trừ phí và trượt giá kiểu Binance) → vốn còn khoảng ' + usd(ACC_EQUITY + sumUsd) + '.' + (undecided ? ' Còn ' + undecided + ' lệnh chưa chọn Theo/Bỏ qua, chưa tính vào thống kê.' : '')\n    : 'Sổ tín hiệu: chưa có lệnh nào đóng. Mỗi khung M5, M15, M30, H1, H4, D, W tự ghi tín hiệu riêng khi điểm tổng hợp đủ mạnh và giữ ổn định vài phút.') + '<\/li>';\n  const items = sigLog.filter(x => (filterCoin ? x.s === filterCoin : (state[x.s] && state[x.s].grp === cfg.grp)) && isMkSig(x)).slice(-40).reverse();\n  if (!items.length){\n    const wait = Math.ceil(Math.max(0, (demo ? 20000 : 300000) - (Date.now() - APP_START)) / 60000);\n    fe.innerHTML = head + '<li class=\"empty\">' + (wait > 0 ? 'Đang thu thập dữ liệu ở các khung M5 đến W, tín hiệu đầu tiên có thể xuất hiện sau khoảng ' + wait + ' phút.' : 'Chưa có tín hiệu ' + (cfg.grp !== 'tradfi' && cfg.mkt === 'spot' ? 'MUA Spot ' : '') + 'nào. Mỗi khung tự ghi khi điểm tổng hợp đủ mạnh, kế hoạch lệnh hợp lệ và hướng giữ ổn định vài phút.') + '<\/li>';\n    return;\n  }\n  fe.innerHTML = head + items.map(g => {\n    const s = sigStatusText(g);\n    const canFollow = g.result !== 'cancel';\n    const foot = (canFollow ? '<button class=\"fbtn v\" data-follow=\"' + g.id + '\" data-v=\"1\" aria-pressed=\"' + (g.follow === true) + '\">✓ Theo<\/button>' +\n      '<button class=\"fbtn x\" data-follow=\"' + g.id + '\" data-v=\"0\" aria-pressed=\"' + (g.follow === false) + '\">✗ Bỏ qua<\/button>' : '') +\n      (g.status === 'open' ? '<button class=\"chip\" data-closesig=\"' + g.id + '\">Đóng lệnh<\/button>' : '');\n    const lv = (c, lab, v) => `<div class=\"lc ${c}\"><small>${lab}<\/small><b>${pf(v)}<\/b><\/div>`;\n    const tp = g.tps || [];\n    return `<li class=\"sgi ${g.dir}${g.id > lastSigSeen ? ' new' : ''}\"><div class=\"top\"><span class=\"sgchip ${g.dir}\">${dirLbl(g.dir, (g.mkt || 'spot') !== 'fut')}<\/span><b>${g.s} <em>${g.tf || 'H1'}<\/em><\/b><span class=\"mkt\">${(g.mkt || 'spot') === 'fut' ? 'Futures' : 'Spot'}<\/span><time>${clock(g.t)}<\/time><\/div>` +\n      `<div class=\"sgmeta\"><span class=\"stt ${s.c}\">${s.t}<\/span><\/div>` +\n      `<div class=\"lv3\">${lv('ent','Vào',g.entry)}${lv('sl','SL',g.sl)}${lv('tp','TP1',tp[0])}${lv('tp','TP2',tp[1])}${lv('tp','TP3',tp[2])}<\/div>` +\n      (foot ? `<div class=\"foot\">${foot}<\/div>` : '') + '<\/li>';\n  }).join('');\n  lastSigSeen = sigUid;\n}\n$('feed').addEventListener('click', e => {\n  const fb = e.target.closest('[data-follow]');\n  if (fb){\n    const g = sigLog.find(x => x.id === Number(fb.dataset.follow)); if (!g) return;\n    const v = fb.dataset.v === '1';\n    g.follow = g.follow === v ? null : v; sigDirty = true; render(); return;\n  }\n  const cb = e.target.closest('[data-closesig]');\n  if (cb) closeManual(Number(cb.dataset.closesig));\n});\nfunction saveSig(){\n  if (demo) return;\n  try { localStorage.setItem(SIG_KEY, JSON.stringify(sigLog.slice(-200))); } catch(_){}\n}\nfunction resetSignals(){\n  sigLog.length = 0; sigUid = 0; lastSigSeen = 0;\n  COINS.forEach(c => { const st = state[c.s]; st.candDir = null; st.candSince = 0; st.lastSigClose = 0; st.cand = {}; st.lc = {}; });\n  saveSig();\n  showToast('Đã đặt lại sổ tín hiệu. App bắt đầu quét lại từ đầu.');\n  render();\n}\n$('sigResetBtn').addEventListener('click', resetSignals);\nfunction loadSig(){\n  try {\n    const j = JSON.parse(localStorage.getItem(SIG_KEY) || '[]');\n    if (!Array.isArray(j)) return;\n    sigLog.length = 0; j.forEach(g => { if (g && g.s && g.tps) sigLog.push(g); });\n    sigUid = sigLog.reduce((m, g) => Math.max(m, g.id || 0), 0); lastSigSeen = sigUid;\n  } catch(_){}\n}\nsetInterval(() => { if (sigDirty){ sigDirty = false; saveSig(); } }, 15000);\n\nfunction flowChartSVG(p){\n  const nr = NARROW(), fs = nr ? 12 : 11, s = p.flow.ser, n = s.length, W = nr ? 360 : 640, L = 8, R = 8, T = 18, bh = nr ? 100 : 100, ch = nr ? 70 : 70, gap = nr ? 34 : 30, H = T + bh + gap + ch + 12;\n  const cw = W - L - R, bw = cw / n, mid = T + bh / 2;\n  const mx = Math.max.apply(null, s.map(Math.abs).concat([1]));\n  let cum = 0; const cv = s.map(v => (cum += v));\n  const cmin = Math.min.apply(null, cv.concat([0])), cmax = Math.max.apply(null, cv.concat([0])), cr = (cmax - cmin) || 1, cy0 = T + bh + gap;\n  const yc = v => (cy0 + ch - (v - cmin) / cr * ch).toFixed(1);\n  const bars = s.map((v, i) => { const h = Math.max(.5, Math.abs(v) / mx * (bh / 2 - 2)); return '<rect x=\"' + (L + i*bw + 1).toFixed(1) + '\" y=\"' + (v >= 0 ? mid - h : mid).toFixed(1) + '\" width=\"' + Math.max(1, bw - 2).toFixed(1) + '\" height=\"' + h.toFixed(1) + '\" fill=\"' + (v >= 0 ? 'var(--buy)' : 'var(--sell)') + '\" opacity=\".85\"/>'; }).join('');\n  const pts = cv.map((v, i) => (L + i*bw + bw/2).toFixed(1) + ',' + yc(v)).join(' ');\n  return '<svg viewBox=\"0 0 ' + W + ' ' + H + '\" width=\"100%\" role=\"img\" aria-label=\"Dòng tiền mua bán chủ động và CVD\">' +\n    '<text x=\"' + L + '\" y=\"12\" font-size=\"' + fs + '\" fill=\"var(--muted)\">Mua chủ động − bán chủ động mỗi nến<\/text>' +\n    '<line x1=\"' + L + '\" x2=\"' + (W - R) + '\" y1=\"' + mid + '\" y2=\"' + mid + '\" stroke=\"var(--line)\"/>' + bars +\n    '<text x=\"' + L + '\" y=\"' + (cy0 - 8) + '\" font-size=\"' + fs + '\" fill=\"var(--muted)\">Dòng tiền tích lũy (CVD)<\/text>' +\n    '<line x1=\"' + L + '\" x2=\"' + (W - R) + '\" y1=\"' + yc(0) + '\" y2=\"' + yc(0) + '\" stroke=\"var(--line)\" stroke-dasharray=\"3 3\"/>' +\n    '<polyline points=\"' + pts + '\" fill=\"none\" stroke=\"var(--warn)\" stroke-width=\"' + (nr ? 2.5 : 2) + '\"/><\/svg>';\n}\nfunction flowHTML(st){\n  const f = st.sf, tf = cfg.tf, p = st.tfProf[tf], now = Date.now();\n  if (!p || !p.flow) return '';\n  const bar = (b, se) => { const t = b + se; return '<span class=\"flw-bar\">' + (t ? '<i class=\"b\" style=\"width:' + (b/t*100).toFixed(1) + '%\"><\/i><i class=\"s\" style=\"width:' + (se/t*100).toFixed(1) + '%\"><\/i>' : '') + '<\/span>'; };\n  const vs = flowScore(st);\n  const verdict = vs == null ? 'Chưa đủ dữ liệu' : vs >= .35 ? 'Dòng tiền đang vào mạnh' : vs >= .15 ? 'Dòng tiền nghiêng vào' : vs <= -.35 ? 'Dòng tiền đang ra mạnh' : vs <= -.15 ? 'Dòng tiền nghiêng ra' : 'Dòng tiền cân bằng';\n =\"tp\"><span>Chốt lời TP' + (i + 1) + '<\/span><b>' + pf(t) + '<\/b><small>' + pl.rr[i].toFixed(1) + 'R, ' + pctOf(t) + '<\/small><\/li>').join('') + '<\/ul>' +\n      '<p class=\"note\" style=\"margin:0 0 10px\">Với rủi ro ' + String(cfg.risk).replace('.', ',') + '% vốn, cỡ vị thế khoảng ' + (f.spot ? Math.min(pos, 1)*100 : pos*100).toFixed(0) + '% vốn (' + (f.spot ? 'mua Spot, không đòn bẩy' + (pos > 1 ? ', đã giới hạn ở 100% vốn nên rủi ro thực tế thấp hơn mức chọn' : '') : 'đòn bẩy khoảng ' + pos.toFixed(1) + 'x') + '), vì SL cách điểm vào ' + (pl.riskFrac*100).toFixed(2) + '%. ' + pl.warn + '<\/p>';\n  } else {\n    h += '<p class=\"note\" style=\"margin:0 0 10px\">' + f.reason + '<\/p>';\n  }\n  if (act){\n    const s = sigStatusText(act);\n    h += '<p class=\"inz\">Đã ghi tín hiệu ' + dirLbl(act.dir, f.spot) + ' lúc ' + clock(act.t) + ' (' + s.t + ', khung ' + (act.tf || 'H1') + '). Mức đã ghi: vào ' + pf(act.entry) + ', SL ' + pf(act.sl) + ', TP ' + act.tps.map(pf).join(' / ') + '.<\/p>';\n  } else if (f.dir && warmLeft > 0){\n    h += '<p class=\"note\" style=\"margin:0 0 10px\">Khung ' + tf + ' đang nghiêng ' + (f.spot ? (f.dir==='long'?'Mua':'Bán') : (f.dir==='long'?'Long':'Short')) + '. Đang thu thập dữ liệu, app sẽ tự ghi tín hiệu sau khoảng ' + warmLeft + ' phút.<\/p>';\n  } else if (f.dir){\n    h += '<p class=\"note\" style=\"margin:0 0 10px\">Khung ' + tf + ' đang nghiêng ' + (f.spot ? (f.dir==='long'?'Mua':'Bán') : (f.dir==='long'?'Long':'Short')) + '. App tự ghi tín hiệu của khung này khi kế hoạch lệnh hợp lệ, độ tin cậy từ Vừa trở lên và hướng giữ ổn định vài phút.<\/p>';\n  }\n  h += '<details class=\"facs\"' + (facOpen ? ' open' : '') + '><summary>Chi tiết các yếu tố tạo nên điểm<\/summary>';\n  factorKeys(st).forEach(k => {\n    const v = f.F[k];\n    if (v == null){\n      h += '<div class=\"fac na\"><span class=\"fl\">' + SW_LABEL[k] + '<small>' + (k === 'exch' || k === 'fund' ? 'Chưa có dữ liệu onchain.' : k === 'book' ? 'Mở coin này để t ).replace(/\\/+$/, '');\n  ark.minUsd = Math.max(10000, +$('arkMin').value || 500000);\n  ark.funds = $('arkFunds').value.split(/\\r?\\n/).map(x => x.trim().toLowerCase()).filter(Boolean).slice(0, 15);\n}\nfunction loadArk(){\n  try {\n    const j = JSON.parse(localStorage.getItem(ARK_KEY) || 'null');\n    if (j){ ark.key = j.key || ''; ark.proxy = j.proxy || ''; ark.minUsd = +j.minUsd || 500000; if (Array.isArray(j.funds) && j.funds.length) ark.funds = j.funds; }\n  } catch(_){}\n  arkFill(); arkStatus();\n}\nasync function arkFetch(path, params){\n  const base = (ark.proxy || 'https://api.arkm.com').replace(/\\/+$/, '');\n  const headers = {}; if (!ark.proxy && ark.key) headers['API-Key'] = ark.key;\n  let r;\n  try { r = await fetch(base + path + '?' + new URLSearchParams(params).toString(), {headers}); }\n  catch(e){ throw new Error('không gọi được Arkham từ trình duyệt (bị chặn CORS hoặc mất mạng). Hãy tạo một Cloudflare Worker bằng điện thoại (xem file arkham-worker.js) hoặc chạy arkham-proxy.py trên máy tính, rồi dán địa chỉ vào ô proxy'); }\n  if (r.status === 401 || r.status === 403) throw new Error('API key không hợp lệ hoặc chưa có quyền');\n  if (r.status === 429) throw new Error('vượt giới hạn tốc độ của Arkham (429)');\n  if (!r.ok) throw new Error('Arkham trả về lỗi HTTP ' + r.status);\n  ark.ok = true; arkStatus();\n  return r.json();\n}\n/* Arkham giới hạn 1 lượt/giây cho /transfers nên mọi lượt gọi đi qua một hàng đợi */\nfunction arkGet(path, params){\n  const run = arkChain.then(async () => {\n    const wait = arkLast + 1100 - Date.now(); if (wait > 0) await sleep(wait);\n    arkLast = Date.now(); return arkFetch(path, params);\n  });\n  arkChain = run.catch(() => {}); return run;\n}\nconst eType = a => ((a && a.arkhamEntity && a.arkhamEntity.type) || '').toLowerCase();\nconst eKey = a => { const e = a && a.arkhamEntity; return e ? String(e.id || e.name || '').toLowerCase().replace(/\\s+/g, '-') : ''; };\nconst eName = a => (a && a.arkhamEntity && a.arkhamEntity.name) || (a && a.arkhamLabel && a.arkhamLabel.name) || (a && a.address ? a.address.slice(0, 6) + '…' + a.address.slice(-4) : 'ví ẩn danh');\nconst tUsd = t => +t.historicalUSD || 0;\n\nfunction analyzeArk(cin, cout, fd){\n  const fundSet = new Set(ark.funds), top = [];\n  let cexIn = 0, cexOut = 0, fundIn = 0, fundOut = 0;\n  cin.forEach(t => { if (eType(t.fromAddress) === 'cex') return; const v = tUsd(t); cexIn += v; top.push({v, txt:eName(t.fromAddress) + ' → ' + eName(t.toAddress) + ' (vào sàn)'}); });\n  cout.forEach(t => { if (eType(t.toAddress) === 'cex') return; const v = tUsd(t); cexOut += v; top.push({v, txt:eName(t.fromAddress) + ' → ' + eName(t.toAddress) + ' (rút khỏi sàn)'}); });\n  fd.forEach(t => {\n    const f = fundSet.has(eKey(t.fromAddress)), to = fundSet.has(eKey(t.toAddress));\n    if ((f && to) || (!f && !to)) return;\n    const v = tUsd(t); if (to) fundIn += v; else fundOut += v;\n    top.push({v, txt:eName(t.fromAddress) + ' → ' + eName(t.toAddress) + (to ? ' (quỹ nhận)' : ' (quỹ chuyển đi)')});\n  });\n  top.sort((a,b) => b.v - a.v);\n  return {at:Date.now(), cexIn, cexOut, fundIn, fundOut, top:top.slice(0, 5), trunc:[cin, cout, fd].some(a => a.length >= ark.limit), n:cin.length + cout.length + fd.length};\n}\nasync function fetchArk(sym){\n  const st = state[sym]; if (!st || st.arkLoading) return;\n  if (!ARK_ID[sym]){ st.ark = {unsupported:true, at:Date.now()}; return; }\n  if (!arkHas()){ st.arkErr = 'chưa nhập API key hoặc địa chỉ proxy'; return; }\n  st.arkLoading = true; st.arkErr = null;\n  try {\n    const base = {tokens:ARK_ID[sym], timeLast:'24h', usdGte:String(ark.minUsd), sortKey:'time', sortDir:'desc', limit:String(ark.limit)};\n    const cin = await arkGet('/transfers', Object.assign({}, base, {base:'type:cex', flow:'in'}));\n    const cout = await arkGet('/transfers', Object.assign({}, base, {base:'type:cex', flow:'out'}));\n    const fd = ark.funds.length ? await arkGet('/transfers', Object.assign({}, base, {base:ark.funds.join(','), flow:'all'})) : {transfers:[]};\n    st.ark = analyzeArk(cin.transfers || [], cout.transfers || [], fd.transfers || []);\n  } catch(e){ st.arkErr = (e && e.message) ? e.message : 'lỗi không rõ'; }\n  st.arkLoading = false;\n}\nfunction arkHTML(st){\n  let h = '<h5 style=\"margin-top:14px\">Onchain (Arkham)<\/h5>';\n  if (st.grp === 'tradfi') return h + '<p class=\"note\">Hợp đồng TradFi không có dữ liệu onchain.<\/p>';\n  if (!ARK_ID[st.s]) return h + '<p class=\"note\">Chưa có ánh xạ Arkham cho mã này.<\/p>';\n  if (st.arkLoading) return h + '<p class=\"note\">Đang tải từ Arkham (khoảng 3 đến 4 giây)…<\/p>';\n  const a = st.ark;\n  const btn = label => '<button class=\"toggle\" data-ark=\"fetch\" style=\"margin-top:6px\">' + label + '<\/button>';\n  if (a && !a.unsupported){\n    const exNet = a.cexOut - a.cexIn, fdNet = a.fundIn - a.fundOut;\n    h += '<ul class=\"zl\">' +\n      '<li><div><b>Ví sàn (CEX) 24 giờ<\/b><small>Vào ' + usd(a.cexIn) + ', ra ' + usd(a.cexOut) + '<\/small><\/div><span class=\"d ' + (exNet >= 0 ? 'c-s' : 'c-l') + '\">' + (exNet >= 0 ? 'Rút ròng ' : 'Nạp ròng ') + usd(Math.abs(exNet)) + '<\/span><\/li>' +\n      '<li><div><b>Quỹ và market maker<\/b><small>Nhận ' + usd(a.fundIn) + ', chuyển đi ' + usd(a.fundOut) + '<\/small><\/div><span class=\"d ' + (fdNet >= 0 ? 'c-s' : 'c-l') + '\">' + (fdNet >= 0 ? 'Mua vào ' : 'Bán ra ') + usd(Math.abs(fdNet)) + '<\/span><\/li><\/ul>';\n    if (!a.n) h += '<p class=\"note\">Arkham không trả về lệnh chuyển nào trên ngưỡng ' + usd(ark.minUsd) + ' trong 24 giờ. Có thể coin này chưa được Arkham theo dõi, hoặc bạn nên hạ ngưỡng.<\/p>';\n    if (a.top.length) h += '<ul class=\"zl\">' + a.top.map(x => '<li><div><b>' + usd(x.v) + '<\/b><small>' + x.txt + '<\/small><\/div><\/li>').join('') + '<\/ul>';\n    h += '<p class=\"note\">Cập nhật lúc ' + clock(a.at) + (a.trunc ? '. Có loại đạt giới hạn ' + ark.limit + ' lệnh mới nhất nên số liệu có thể thiếu.' : '.') + '<\/p>' + btn('Làm mới');\n  } else if (a && a.unsupported){\n    h += '<p class=\"note\">Arkham không hỗ trợ mã này.<\/p>';\n  } else if (!arkHas()){\n    h += '<p class=\"note\">Chưa nhập API key Arkham. Điền ở mục “Onchain Arkham” phía trên để thêm 2 yếu tố onchain vào điểm.<\/p><button class=\"toggle\" data-ark=\"open\" style=\"margin-top:6px\">Mở phần cài đặt<\/button>';\n  } else {\n    h += (st.arkErr ? '<p class=\"note c-l\">Lỗi: ' + st.arkErr + '.<\/p>' : '<p class=\"note\">Chưa lấy dữ liệu onchain cho ' + st.s + '.<\/p>') + btn('Lấy dữ liệu onchain');\n  }\n  return h;\n}\n$('arkSave').addEventListener('click', () => {\n  arkRead(); ark.ok = false;\n  try { localStorage.setItem(ARK_KEY, JSON.stringify({key:ark.key, proxy:ark.proxy, minUsd:ark.minUsd, funds:ark.funds})); $('arkMsg').textContent = 'Đã lưu cài đặt.'; }\n  catch(_){ $('arkMsg').textContent = 'Đã áp dụng cho phiên này (trình duyệt không cho lưu).'; }\n  arkStatus();\n});\n$('arkTest').addEventListener('click', async () => {\n  arkRead();\n  if (!arkHas()){ $('arkMsg').textContent = 'Hãy nhập API key hoặc địa chỉ proxy trước.'; return; }\n  $('arkMsg').textContent = 'Đang kiểm tra…';\n  try { await arkGet('/intelligence/entity/binance', {}); $('arkMsg').textContent = 'Kết nối Arkham thành công.'; }\n  catch(e){ $('arkMsg').textContent = 'Lỗi: ' + e.message + '.'; }\n  arkStatus();\n});\n$('arkScan').addEventListener('click', async () => {\n  arkRead();\n  if (!arkHas()){ $('arkMsg').textContent = 'Hãy nhập API key hoặc địa chỉ proxy trước.'; return; }\n  if (arkScanning) return;\n  arkScanning = true;\n  const list = COINS.filter(c => c.grp !== 'tradfi' && ARK_ID[c.s]);\n  let n = 0;\n  for (const c of list){\n    $('arkMsg').textContent = 'Đang quét ' + c.s + ' (' + (++n) + '/' + list.length + ')…';\n    await fetchArk(c.s);\n    if (state[c.s].arkErr){ $('arkMsg').textContent = 'Dừng ở ' + c.s + ': ' + state[c.s].arkErr + '.'; arkScanning = false; return; }\n  }\n  arkScanning = false; $('arkMsg').textContent = 'Đã qu à 3,6%), sổ lệnh sát giá (2,0%). Yếu tố nào chưa có dữ liệu (ví dụ chưa mở coin để lấy sổ lệnh, hoặc chưa cấu hình Arkham) thì bị bỏ ra và các yếu tố còn lại được tính lại tỉ trọng.<\/li>"]], [778, 778, ["        <li><b>Riêng bản Bybit:<\/b> app mở sẵn ở chế độ Futures vì Bybit chủ yếu được dùng để giao dịch perpetual, và ngưỡng lệnh cá voi đặt bằng khoảng 55% so với bản Binance. Nến Bybit không tách sẵn khối lượng mua/bán chủ động, nên lực mua/bán chủ động và CVD của Spot chỉ là ước tính từ vị trí giá đóng trong nến và chỉ tính nửa trọng số. Funding được quy về mỗi 8 giờ theo chu kỳ riêng của từng hợp đồng (Bybit có hợp đồng chia kỳ 1, 2, 4 hoặc 8 giờ). Funding, Open Interest và thanh lý được tăng 20% trọng số; sổ lệnh giảm 25% vì Spot chỉ có 200 mức giá. Bybit không có nến 8 giờ và 3 ngày nên biểu đồ phân tích không có hai khung H8 và 3D.<\/li>"]], [824, 827, ["        <li>TradFi là các hợp đồng perpetual (hợp đồng tương lai không kỳ hạn) trên Bybit Futures, bám theo giá cổ phiếu, ETF, vàng, bạc, dầu… Bạn không sở hữu cổ phiếu hay hàng hóa thật.<\/li>", "        <li>App tự lấy danh sách hợp đồng TradFi đang giao dịch trên Bybit rồi chọn 20 hợp đồng có khối lượng 24 giờ lớn nhất. Ngưỡng lệnh lớn được tính theo khối lượng đó (từ $25K đến $500K), nên hợp đồng càng sôi động thì ngưỡng càng cao.<\/li>", "        <li>Lệnh khớp, vùng thanh khoản, sổ lệnh và thanh lý của nhóm này đều lấy từ Bybit Futures. Giá hợp đồng theo phiên của thị trường gốc, nên ngoài giờ giao dịch có thể rất ít lệnh.<\/li>"]], [831, 832, ["        <li>App lấy %change 24h của toàn bộ cặp .../USDT đang giao dịch trên Bybit Spot, loại BTC, ETH, các stablecoin và token đòn bẩy, chỉ giữ coin có khối lượng 24h từ 1,5 triệu USD trở lên để tránh %change ảo do thanh khoản quá mỏng.<\/li>"]], [834, 835, ["        <li>Một số altcoin chỉ có Spot mà chưa niêm yết Futures trên Bybit, nên sẽ không có dữ liệu Thanh lý, Funding, Open Interest hay giá khi chuyển sang chế độ Futures.<\/li>"]], [845, 846, ["      <p>  (app hiển thị chung dưới dạng coin/USDT) trên Hyperliquid, tự cộng chung thành một (Spot và Futures tính riêng). Lệnh nào vượt ngưỡng của coin đó (ví dụ BTC từ $300K, SOL từ $100K) thì được tính là lệnh cá voi.<\/li>"]], [752, 753, ["        <li><b>Sổ lệnh sát giá<\/b> gồm 20 mức giá tốt nhất mỗi phía của sổ lệnh Hyperliquid (API công khai chỉ trả 20 mức), cho thấy các “tường” lệnh chờ mua và chờ bán. Với BTC và ETH, phạm vi này rất hẹp (dưới 0,1% quanh giá), nên chỉ phản ánh lực đỡ và lực cản ngay lúc này.<\/li>"]], [757, 758, ["        <li>Thanh lý là khi sàn buộc phải đóng một vị thế đòn bẩy vì tài khoản không còn đủ ký quỹ. <b>Hyperliquid không có luồng thanh lý công khai toàn sàn<\/b>, nên khi dùng sàn này mục Thanh lý không có dữ liệu và yếu tố thanh lý bị bỏ qua khỏi điểm số (các yếu tố còn lại tự chia lại trọng số).<\/li>"]], [761, 762, ["        <li>Nếu cần dữ liệu thanh lý, hãy chuyển sang Binance, OKX hoặc Bybit ở ô chọn sàn phía trên.<\/li>"]], [766, 768, ["        <li>App chấm điểm từ -1 (nghiêng Short) đến +1 (nghiêng Long), tổng hợp từ 16 yếu tố và chỉ báo: dòng tiền cá voi (12,5%), vị trí giá so với vùng thanh khoản (10,1%), SuperTrend (8,3%), SMC/ICT (8,3%), Ichimoku Cloud (7,3%), động lượng RSI kết hợp MACD (7,3%), funding rate futures (7,3%), đa khung ngắn/trung/dài trong cùng khung đã chọn (5,5%), xu hướng EMA20/EMA50 (5,5%), Parabolic SAR (4,6%), biến động Open Interest (5,5%), thanh lý futures (4,6%), dải Bollinger (3,7%), 2 yếu tố onchain từ Arkham (3,7% và 3,7%), sổ lệnh sát giá (2,2%). Yếu tố nào chưa có dữ liệu (ví dụ chưa mở coin để lấy sổ lệnh, hoặc chưa cấu hình Arkham) thì bị bỏ ra và các yếu tố còn lại được tính lại tỉ trọng.<\/li>"]], [778, 778, ["        <li><b>Riêng bản Hyperliquid:<\/b> ngưỡng lệnh cá voi đặt bằng khoảng 50% so với bản Binance vì thanh khoản nhỏ hơn. Nến Hyperliquid không tách sẵn khối lượng mua/bán chủ động, nên lực mua/bán chủ động và CVD chỉ là ước tính từ vị trí giá đóng trong nến và chỉ tính nửa trọng số; lệnh cá voi vẫn là dữ liệu khớp lệnh thật. Funding của Hyperliquid trả mỗi giờ, app nhân 8 để so cùng thang với các sàn khác. Giá kPEPE, kSHIB, kBONK… (tính theo 1000 coin) được quy về 1 coin. Hợp đồng TradFi lấy từ các sàn HIP-3 do bên thứ ba triển khai trên Hyperliquid, có thể thay đổi theo thời gian. Biểu đồ TradingView dùng giá tham chiếu Binance.<\/li>"]], [824, 827, ["        <li>TradFi là các hợp đồng perpetual (hợp đồng tương lai không kỳ hạn) trên Hyperliquid Futures, bám theo giá cổ phiếu, ETF, vàng, bạc, dầu… Bạn không sở hữu cổ phiếu hay hàng hóa thật.<\/li>", "        <li>App tự lấy danh sách hợp đồng TradFi đang giao dịch trên Hyperliquid rồi chọn 20 hợp đồng có khối lượng 24 giờ lớn nhất. Ngưỡng lệnh lớn được tính theo khối lượng đó (từ $25K đến $500K), nên hợp đồng càng sôi động thì ngưỡng càng cao.<\/li>", "        <li>Lệnh khớp, vùng thanh khoản, sổ lệnh và thanh lý của nhóm này đều lấy từ Hyperliquid Futures. Giá hợp đồng theo phiên của thị trường gốc, nên ngoài giờ giao dịch có thể rất ít lệnh.<\/li>"]], [831, 832, ["        <li>App lấy %change 24h của toàn bộ hợp đồng perpetual đang giao dịch trên Hyperliquid (Spot Hyperliquid chỉ có ít coin), loại BTC, ETH, các stablecoin và token đòn bẩy, chỉ giữ coin có khối lượng 24h từ 1 triệu USD trở lên để tránh %change ảo do thanh khoản quá mỏng.<\/li>"]], [834, 835, ["        <li>Spot Hyperliquid chỉ niêm yết một số ít coin (như BTC, ETH, SOL, HYPE, PURR…), nên nhiều coin sẽ không có dữ liệu khi chuyển sang chế độ Spot. Vì vậy app mở mặc định ở chế độ Futures khi dùng Hyperliquid.<\/li>"]], [845, 846, ["      <p>Dữ liệu chỉ đến từ sàn Hyperliquid, không phải từ ví on-chain. Cá voi có thể chia nhỏ lệnh nên một số dòng tiền sẽ không bị phát hiện. Đây là công cụ tham khảo, không phải lời khuyên đầu tư.<\/p>"]], [876, 876, ["const TH_SCALE = 0.5; /* ngưỡng lệnh cá voi của 20 coin đầu = ngưỡng Binance x hệ số này, vì thanh khoản Hyperliquid nhỏ hơn Binance */", "COINS.forEach(c => { c.th = Math.max(10000, Math.  0, ready = null, spotP = null, spotAt = 0;", "async function post(body, ms){", "  if (pauseUntil > Date.now()) throw new Error(NAME + ' đang giới hạn tốc độ, app nghỉ ' + Math.ceil((pauseUntil - Date.now())/1000) + ' giây rồi tự thử lại');", "  const ac = new AbortController(), to = setTimeout(() => ac.abort(), ms || 10000);", "  let r; try { r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body), signal:ac.signal}); } finally { clearTimeout(to); }", "  if (r.status === 429 || r.status === 403){ pauseUntil = Date.now() + 30000; throw new Error('HTTP ' + r.status + ' (' + NAME + ' giới hạn tốc độ hoặc chặn khu vực)'); }", "  if (!r.ok) throw new Error('HTTP ' + r.status);", "  return r.json();", "}", "/* Hyperliquid niêm yết kPEPE, kSHIB, kBONK…: giá và khối lượng tính theo 1000 coin, quy về 1 coin thật bằng hệ số mul */", "function norm(n){ const m = /^k([A-Z0-9]+)$/.exec(n); return m ? {b:m[1], m:1000} : {b:n, m:1}; }", "/* Gọi metaAndAssetCtxs cho từng sàn con (dex), nhớ 4 giây để các lệnh gọi liền nhau dùng chung một lượt tải */", "const CT = {};", "function ctx(dex){", "  const c = CT[dex || '']; if (c && Date.now() - c.t < 4000) return c.p;", "  const p = post(dex ? {type:'metaAndAssetCtxs', dex} : {type:'metaAndAssetCtxs'}, 12000).then(v => { if (!Array.isArray(v) || !v[0] || !v[0].universe) throw new Error(NAME + ': dữ liệu hợp đồng không hợp lệ'); return v; });", "  CT[dex || ''] = {t:Date.now(), p}; p.catch(() => { if (CT[dex || ''] && CT[dex || ''].p === p) delete CT[dex || '']; });", "  return p;", "}", "function spotCtx(){", "  if (spotP && Date.now() - spotAt < 4000) return spotP;", "  spotAt = Date.now(); spotP = post({type:'spotMetaAndAssetCtxs'}, 12000);", "  spotP.catch(() => { spotP = null; }); return spotP;", "}", "async function load(){", "  const [pm, sm] = await Promise.all([ctx(''), spotCtx().catch(() => null)]);", "  const fut = {}, spot = {};", "  pm[0].universe.forEach((u, i) => { if (u.
